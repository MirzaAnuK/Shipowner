<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="screen-orientation" content="landscape">
<title>Armatör · Denizcilik Şirketi Oyunu</title>

<meta name="theme-color" content="#0a141d">
<meta property="og:title" content="Armatör · Denizcilik Şirketi Oyunu">
<meta property="og:description" content="Eski bir kosterle başla, limanlar arasında yük taşı, filonu büyüt. Start with an old coaster and grow a shipping company. Türkçe · English · 中文">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Köprüüstü ekranı: ECDIS gündüz paleti. Düzen: gösterge şeridi, deniz haritası, altında defter paneli. */
  --bg:#dde5e4; --panel:#edf1ee; --card:#fbfcf9; --line:#b7c4c5; --ink:#12212a; --mute:#52646d;
  --sea:#dbeaef; --shal:#b6d6e3; --land:#dcc98f; --coast:#8c7a41; --grid:rgba(18,33,42,.07);
  --foam:#ffffff; --hull:#25343d; --deck:#93a1a8; --sup:#fbfcf9; --boot:#a23a28; --rust:#9a5a2c;
  --mag:#ad1279; --onmag:#ffffff; --ok:#15754c; --warn:#9c5700; --bad:#b83022;
  --dry:#1b4d7a; --tank:#a5401a;
  --disp:"Barlow Condensed","Arial Narrow","Roboto Condensed","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#050b11; --panel:#0a141d; --card:#0f1d29; --line:#21374a; --ink:#d7e1e7; --mute:#879cab;
  --sea:#06141d; --shal:#0e2c3c; --land:#3b3a21; --coast:#77713d; --grid:rgba(215,225,231,.05);
  --foam:#a9c4d2; --hull:#5d7385; --deck:#9db0bc; --sup:#d2dde3; --boot:#b5503f; --rust:#b0703c;
  --mag:#e45fbd; --onmag:#1c0617; --ok:#4fcba6; --warn:#f0b24a; --bad:#ff8072;
  --dry:#7fb9ea; --tank:#ff9c6e; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#050b11; --panel:#0a141d; --card:#0f1d29; --line:#21374a; --ink:#d7e1e7; --mute:#879cab;
  --sea:#06141d; --shal:#0e2c3c; --land:#3b3a21; --coast:#77713d; --grid:rgba(215,225,231,.05);
  --foam:#a9c4d2; --hull:#5d7385; --deck:#9db0bc; --sup:#d2dde3; --boot:#b5503f; --rust:#b0703c;
  --mag:#e45fbd; --onmag:#1c0617; --ok:#4fcba6; --warn:#f0b24a; --bad:#ff8072;
  --dry:#7fb9ea; --tank:#ff9c6e; color-scheme:dark;}
/*__CSS__*/
</style>
</head>
<body>
<div id="app">
  <nav id="rail" aria-label="Bölümler" data-ia="rail"><button type="button" data-a="tab" data-t="fleet"><svg viewBox="0 0 20 20" width="22" height="22" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M2.5 12.5h15l-2 4h-11zM5 12.5V9h4v3.5M9 9V5.5h3.5V9M12.5 12.5V7l2.5 1.5v4"/></g></svg><span class="lbl" data-i="fleet">Filo</span><i class="rb2" id="bdFleet" hidden></i></button><button type="button" data-a="tab" data-t="market"><svg viewBox="0 0 20 20" width="22" height="22" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M3 3h6.5l7.5 7.5-6.5 6.5L3 9.5z"/><circle cx="6.8" cy="6.8" r="1.2"/></g></svg><span class="lbl" data-i="market">Pazar</span></button><button type="button" data-a="tab" data-t="xp"><svg viewBox="0 0 20 20" width="22" height="22" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M10 2.8l2.1 4.3 4.7.7-3.4 3.3.8 4.7L10 13.6l-4.2 2.2.8-4.7-3.4-3.3 4.7-.7z"/></g></svg><span class="lbl" data-i="xp">Tecrübe</span><i class="rb2 mag" id="bdXp" hidden></i></button><button type="button" data-a="tab" data-t="office"><svg viewBox="0 0 20 20" width="22" height="22" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M3 17V7l5-3v13M8 17V9h9v8M2 17h16M11 12h3M11 14.5h3"/></g></svg><span class="lbl" data-i="office">Ofis</span></button><button type="button" data-a="tab" data-t="world"><svg viewBox="0 0 20 20" width="22" height="22" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><circle cx="10" cy="10" r="7.5"/><path d="M2.5 10h15M10 2.5c-4 4.5-4 10.5 0 15M10 2.5c4 4.5 4 10.5 0 15"/></g></svg><span class="lbl" data-i="world">Dünya</span></button><button type="button" data-a="tab" data-t="co"><svg viewBox="0 0 20 20" width="22" height="22" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M3 17h14M5 17v-6M9 17V6M13 17v-9M17 17V4"/></g></svg><span class="lbl" data-i="co">Şirket</span></button><button type="button" data-a="tab" data-t="set"><svg viewBox="0 0 20 20" width="22" height="22" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 5h14M3 10h14M3 15h14"/></g><g fill="currentColor"><circle cx="7" cy="5" r="2"/><circle cx="13" cy="10" r="2"/><circle cx="8.5" cy="15" r="2"/></g></svg><span class="lbl" data-i="set">Ayarlar</span></button></nav>
  <section id="mapWrap" aria-label="Dünya haritası" data-ia="map">
    <canvas id="map"></canvas>
    <header id="hud">
      <div class="kpi"><small data-i="cash">Nakit</small><b id="kCash">$0</b></div>
      <div class="kpi"><small data-i="date">Tarih</small><b id="kDate">1 Oca 2027</b></div>
      <div class="kpi rep"><small data-i="rep">İtibar</small><b><span id="kRep">10</span><i>/100</i></b></div>
      <button type="button" class="kpi lv" data-a="tab" data-t="xp"><small data-i="lv">Şirket</small><b id="kLv">Sv.1</b></button>
    </header>
    <div id="legend"><span class="lg" data-i="insp">Denetim</span><span><i class="dot sa"></i><b data-i="lax">gevşek</b></span><span><i class="dot sb"></i><b data-i="mid">orta</b></span><span><i class="dot sc"></i><b data-i="strict">sıkı</b></span><span><i class="dot sx"></i><b data-i="locked">kilitli</b></span></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="tip" role="status" hidden></div>
    <div id="zoom"><button type="button" data-a="zin" aria-label="Yakınlaştır" data-ia="zin">+</button><button type="button" data-a="zout" aria-label="Uzaklaştır" data-ia="zout">−</button><button type="button" class="otg" data-a="oriTog" aria-label="Dikey ya da yatay düzene geç" data-ia="otg"><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7.5" width="9.5" height="6" rx="1.2"/><rect x="11" y="2.5" width="5.5" height="9" rx="1.2"/><path d="M5 4.5a4 4 0 0 1 4-2M8 1.2 9.2 2.6 7.6 3.6M15.5 15.5a4 4 0 0 1-4 2.2M12.6 18.9l-1.2-1.3 1.6-1"/></g></svg></button></div>
    <button type="button" id="idlePill" data-a="nextIdle" hidden><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10" cy="3.6" r="1.8"/><path d="M10 5.4v11.2M6 8h8M3.2 11.5c.5 3.4 3 5.1 6.8 5.1s6.3-1.7 6.8-5.1"/></g></svg><span id="idleTxt"></span></button>
    <div id="speed" role="group" aria-label="Oyun hızı" data-ia="speed"><button type="button" data-a="speed" data-v="0" aria-label="Duraklat" data-ia="s0">❚❚</button><button type="button" data-a="speed" data-v="1" aria-label="Normal hız" data-ia="s1">▶</button><button type="button" data-a="speed" data-v="2" aria-label="Hızlı" data-ia="s2">▶▶</button></div>
    <button type="button" id="pTog" data-a="ptog" aria-label="Paneli aç" data-ia="ptog"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M12 4l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </section>
  <aside id="side">
    <header id="ph"><h1 id="phT"></h1><div id="phA"></div><button type="button" class="ib pcb" data-a="ptog" aria-label="Paneli kapat, haritayı büyüt" data-ia="pcb"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M8 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></header>
    <main id="panel" class="scr"></main>
    <div id="sheet" hidden><div id="sheetBar"><button type="button" class="btn sm" id="sheetBack" data-a="back" data-i="back">Geri</button><span id="sheetTitle"></span><button type="button" class="btn sm" data-a="close" data-i="close">Kapat</button></div><div id="sheetBody" class="scr"></div></div>
  </aside>
  <div id="modal" class="scr" hidden></div>
  <div id="intro" class="scr" hidden></div>
  <div id="tut" hidden><div class="th"></div><div class="tb"></div></div>
</div>
<div id="rot" hidden></div>
<script>
'use strict';
/*__JS__*/
</script>
</body>
</html>
