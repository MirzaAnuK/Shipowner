/* ---------- banka ---------- */
function debt(){let t=0;for(const l of S.loans||[])t+=l.bal;return t;}
function debtPay(){let t=0;for(const l of S.loans||[])t+=l.pay;return t;}
function loanRate(kind){return Math.round((0.05+(100-S.rep)*0.0006+(kind==='biz'?0.015:0))*1000)/1000;}
function bankLimit(){return Math.max(0,Math.floor((0.5*fleetValue()+250000*(S.hq||1)+15000*S.rep-debt())/50000)*50000);}
function annuity(P,rate,n){const r=rate/12;return r>0?P*r/(1-Math.pow(1+r,-n)):P/n;}
const PCT1=r=>PC(D1(r*100));
function takeLoan(amt,months,kind,sid){amt=Math.round(amt/1000)*1000;if(amt<=0)return null;const rate=loanRate(kind),l={id:S.nid++,kind,amt,bal:amt,rate,n:months,pay:Math.round(annuity(amt,rate,months)),next:Math.floor(S.day)+30,sid:sid||0,t0:Math.floor(S.day)};S.loans.push(l);earn(amt,'kredi');return l;}
function borrow(frac){const lim=bankLimit(),amt=Math.max(50000,Math.floor(lim*frac/50000)*50000);if(amt>lim||lim<50000){toast(L('Banka bu tutarı vermiyor','The bank won’t lend that much','银行不肯贷这么多'),'','bad');return;}
 const l=takeLoan(amt,24,'biz');logMsg(()=>L('İşletme kredisi çekildi: '+USD(l.amt)+', 24 ay, faiz '+PCT1(l.rate)+', aylık taksit '+USD(l.pay),'Business loan taken: '+USD(l.amt)+', 24 months, interest '+PCT1(l.rate)+', monthly instalment '+USD(l.pay),'借入经营贷款：'+USD(l.amt)+'，24个月，利率'+PCT1(l.rate)+'，每月还款'+USD(l.pay)));
 toast(L('Kredi hesabına geçti: ','Loan paid out: ','贷款已到账：')+USD(l.amt),'','ok');save();}
function repayLoan(id){const i=S.loans.findIndex(l=>l.id===id);if(i<0)return;const l=S.loans[i],fee=Math.round(l.bal*0.01);if(!canPay(l.bal+fee)){toast(L('Krediyi kapatmaya nakit yetmiyor','Not enough cash to repay the loan','现金不足，无法还清贷款'),'','bad');return;}
 pay(l.bal,'kredi');pay(fee,'faiz');S.loans.splice(i,1);const b=l.bal;logMsg(()=>L('Kredi erken kapatıldı: '+USD(b)+' (erken ödeme ücreti '+USD(fee)+')','Loan repaid early: '+USD(b)+' (early repayment fee '+USD(fee)+')','提前还清贷款：'+USD(b)+'（提前还款费'+USD(fee)+'）'));toast(L('Kredi kapandı','Loan repaid','贷款已还清'),'','ok');save();}
function shipLoan(m){return Math.round(m.price*0.5/1000)*1000;}
function shipLoanOk(m){return shipLoan(m)<=bankLimit()+0.5*shipValue(m)&&canPay(m.price-shipLoan(m));}
function buyShipLoan(lid){const m=S.market.find(x=>x.id===lid);if(!m)return null;const k=buyBlock(m);if(k&&k!=='cash'){toast(buyWhy(m),'','bad');return null;}
 const amt=shipLoan(m);if(amt>bankLimit()+0.5*shipValue(m)){toast(L('Banka bu gemi için kredi vermiyor','The bank won’t finance this ship','银行不为这艘船提供贷款'),'','bad');return null;}
 if(!canPay(m.price-amt)){toast(L('Peşinat için nakit yetmiyor','Not enough cash for the down payment','现金不足以支付首付'),'','bad');return null;}
 const l=takeLoan(amt,60,'ship'),s=buyShip(lid);if(!s){S.loans.pop();S.cash-=amt;fin('kredi',-amt);return null;}l.sid=s.id;
 logMsg(()=>L(s.name+' için gemi kredisi: '+USD(l.amt)+', 60 ay, faiz '+PCT1(l.rate)+', aylık taksit '+USD(l.pay),'Ship mortgage for '+s.name+': '+USD(l.amt)+', 60 months, interest '+PCT1(l.rate)+', monthly instalment '+USD(l.pay),s.name+'的船舶抵押贷款：'+USD(l.amt)+'，60个月，利率'+PCT1(l.rate)+'，每月还款'+USD(l.pay)));return s;}
function payoffShip(s){const i=S.loans.findIndex(l=>l.sid===s.id);if(i<0)return;const l=S.loans[i];pay(l.bal,'kredi');S.loans.splice(i,1);const b=l.bal;
 logMsg(()=>L(s.name+' satışından gemi kredisi kapatıldı: '+USD(b),'Ship mortgage repaid from the sale of '+s.name+': '+USD(b),'用'+s.name+'的售船款还清抵押贷款：'+USD(b)));}
function loanDay(day){for(const l of S.loans.slice()){if(day<l.next)continue;l.next+=30;const it=l.bal*l.rate/12,pr=Math.min(l.bal,Math.max(0,l.pay-it));pay(it,'faiz');pay(pr,'kredi');l.bal-=pr;
 if(l.bal<1){S.loans.splice(S.loans.indexOf(l),1);const a=l.amt;logMsg(()=>L('Kredi borcu bitti ('+USD(a)+')','Loan fully repaid ('+USD(a)+')','贷款已全部还清（'+USD(a)+'）'));toast(L('Bir kredinin son taksiti ödendi','The last instalment of a loan has been paid','一笔贷款的最后一期已还清'),'','ok');}}}

/* ---------- zaman çarteri ---------- */
const TCH={koster:2900,gcargo:5400,ctank:6400,handy:9000,supra:13800,pmax:18000,mr:22500,afra:33300,feeder:9000,cbox:23000,pctc:22000,lng:45000};
const TCREP={koster:0,gcargo:5,ctank:10,handy:15,supra:25,pmax:30,mr:35,afra:45,feeder:15,cbox:35,pctc:30,lng:60};
const CHRS=['Anatolian Grain Trading','Nordhavn Bulk','Gulfstar Energy Trading','Pacific Ore Logistics','Levant Cement Co.','Baltic Timber Lines','Orient Steel Trading','Atlas Commodities','Meridian Chartering','Bosphorus Agro'];
function fillTC(){S.tco=(S.tco||[]).filter(o=>o.exp>S.day);for(const c of CLSORD){while(S.tco.filter(o=>o.cls===c).length<2){const mo=wpick([3,6,12],[4,4,2]),used=S.tco.filter(o=>o.cls===c).map(o=>o.who);S.tco.push({id:S.nid++,cls:c,who:pick(CHRS.filter(n=>!used.includes(n))),mo,mul:Math.round(rnd(0.8,1.0)*S.tcIdx*(mo===12?0.97:1)*1000)/1000,exp:S.day+rnd(15,40)});}}}
function tcRate(s,o){const c=CLS[s.cls],sp=(c.spd[0]+c.spd[1])/2;return Math.round(TCH[s.cls]*o.mul*(0.85+0.15*clamp((s.cond-50)/40,0,1))*(s.spd/sp)*(1+0.05*(catLv(FLEETOF[s.cls])-1))/50)*50;}
function tcWhy(s,o){if(s.state!=='idle')return L('gemi limanda emir bekliyor olmalı','the ship must be idle in port','船舶须在港待命');if(missingRoles(s).length)return L('personel eksik','crew missing','缺少船员');
 const mc=s.type==='lng'?70:s.type==='tank'?65:55;if(s.cond<mc)return L('kiracı en az %'+mc+' durum istiyor','the charterer wants at least '+mc+'% condition','租家要求船况至少'+mc+'%');
 if(S.rep<TCREP[s.cls])return L('itibar '+TCREP[s.cls]+' gerekli','reputation '+TCREP[s.cls]+' required','需要声誉'+TCREP[s.cls]);
 if(s.svD-S.day<o.mo*30+10)return L('klas sörveyi kiralama süresine denk geliyor, önce sörveyi yaptır','the class survey falls due during the charter; do the survey first','船级检验将在租期内到期，请先完成检验');return '';}
function tcFix(sid,oid){S.done.tcDone=1;const s=S.ships.find(x=>x.id===sid),o=S.tco.find(x=>x.id===oid);if(!s||!o)return false;const w=tcWhy(s,o);if(w){toast(w,s.id,'bad');return false;}
 const rate=tcRate(s,o);S.tco=S.tco.filter(x=>x!==o);if(s.prov<60){pay((60-s.prov)*provRate(s),'kumanya',s);s.prov=60;}s.state='tc';s.op=0;s.ack=false;s.tc={who:o.who,rate,mo:o.mo,end:S.day+o.mo*30,t0:S.day,off:0,offT:0,earned:0,xpa:0,stay:rnd(1,2)};
 logMsg(()=>L(s.name+', '+o.who+' firmasına '+o.mo+' aylığına kiralandı: günlük '+USD(rate),s.name+' fixed on a '+o.mo+'-month time charter to '+o.who+': '+USD(rate)+' a day',s.name+'以期租方式租给'+o.who+'，租期'+o.mo+'个月：日租金'+USD(rate)));
 toast(L(s.name+' kiralandı',s.name+' is on charter',s.name+'已出租'),s.id,'ok');fillTC();resume();save();return true;}
function tcNext(s){const A=PORTS.filter(p=>p.id!==s.port&&portOpen(p.id)&&RTc[s.port].dist[p.id]<7000);if(!A.length)return null;return wpick(A,A.map(p=>1/(1+RTc[s.port].dist[p.id]/1800))).id;}
function crewXp(s,d){for(const r of ROLES){const p=s.crew[r.k];if(!p)continue;p.xp=(p.xp||0)+d;if(p.skill<5&&p.xp>=120*p.skill){p.xp=0;p.skill++;p.wage=Math.round(p.wage*1.15/50)*50;toast(L(p.name+' ('+r.n+') tecrübe kazandı',p.name+' ('+r.n+') gained experience',p.name+'（'+r.n+'）经验提升'),s.id,'ok');R();}}}
function tcStep(s,d){const t=s.tc;if(!t){goIdle(s);return;}
 if(t.off>0){t.off-=d;if(t.off<=0&&!managed(s))toast(L(s.name+' tamir edildi, kira yeniden işliyor',s.name+' repaired and back on hire',s.name+'已修好，恢复计租'),s.id,'ok');return;}
 earn(t.rate*d,'kira');t.earned+=t.rate*d;t.xpa+=0.28*d;if(t.xpa>=5){const g=Math.floor(t.xpa);t.xpa-=g;addXP(FLEETOF[s.cls],g);}
 if(s.voy){const v=s.voy,dn=seaSpeed(s)*24*d*wxSea(s,d,true);v.done+=dn;s.cf=(s.cf||0)+consSea(s)*d;s.cd=(s.cd||0)+dn*s.dwt;s.cond=Math.max(15,s.cond-0.08*(1+s.age/20)*(1.3-0.1*sk(s,'c2'))*(up(s,'eng')?0.8:1)*d);crewXp(s,d);
  if(Math.random()<pBreak(s)*d*0.8){const days=Math.round(rnd(1,3.5)*10)/10,c=Math.round((4000+s.dwt*0.4)/100)*100;pay(c,'bakım',s);t.off=days;t.offT+=days;
   toast(L(s.name+' arıza yaptı: '+D1(days)+' gün kira kesildi (off-hire), tamir '+USD(c),s.name+' broke down: '+D1(days)+' days off-hire, repairs '+USD(c),s.name+'发生故障：停租'+D1(days)+'天，修理费'+USD(c)),s.id,'bad');
   logMsg(()=>L(s.name+' kiralamadayken arıza yaptı, '+D1(days)+' gün off-hire',s.name+' broke down on charter, '+D1(days)+' days off-hire',s.name+'在租期内故障，停租'+D1(days)+'天'));}
  if(v.done>=v.nm){s.port=v.to;s.voy=null;t.stay=rnd(1.5,4);if(s.prov<40){pay((60-s.prov)*provRate(s),'kumanya',s);s.prov=60;}deepArrive(s);R();}}
 else{s.cond=Math.max(15,s.cond-0.015*d);t.stay-=d;if(t.stay<=0){if(S.day>=t.end){tcEnd(s);return;}const to=tcNext(s);if(!to){t.stay=1;return;}const r=route(s.port,to);s.voy={from:s.port,to,path:r.path,cum:legs(r.path),nm:r.nm,done:0,trig:[],lastEv:S.day,t0:S.day};s.port=null;R();}}}
function tcEnd(s){const t=s.tc;s.tc=null;const e=Math.round(t.earned),w=t.who,off=t.offT;
 logMsg(()=>L(s.name+' '+w+' kiralamasından döndü. Toplam kira '+USD(e)+(off?', off-hire '+D1(off)+' gün':''),s.name+' redelivered by '+w+'. Total hire '+USD(e)+(off?', off-hire '+D1(off)+' days':''),s.name+'已由'+w+'还船。租金合计'+USD(e)+(off?'，停租'+D1(off)+'天':'')));
 goIdle(s,L('kiralama bitti','charter ended','租期结束'));}

/* ---------- klas sörveyleri ---------- */
function svFor(age){const ph=age%5;return ph<2.5?{k:'ara',days:Math.floor((2.5-ph)*365)}:{k:'ozel',days:Math.floor((5-ph)*365)};}
function svInit(s){if(s.svD!==undefined)return;const f=svFor(s.age);s.svK=f.k;s.svD=Math.floor(S.day)+f.days;}
const svLeft=s=>s.svD-S.day,svOver=s=>s.svD!==undefined&&s.svD<S.day&&s.svP!=='ara'&&s.svP!=='ozel',svOpen=s=>svLeft(s)<=120;
const svName=k=>k==='ozel'?L('özel sörvey','special survey','特别检验'):L('ara sörvey','intermediate survey','中间检验');
function svInfo(s){const P=s.port?PORT[s.port]:null;if(!P||!P.yard)return null;const base=(6000+s.dwt*0.5)*P.yard*inspCf();
 if(s.svK==='ozel'){const d=dockInfo(s),steel=s.cond<65?Math.round((65-s.cond)*ppCost(s)*2):0;return {cost:Math.round((d.cost+base*1.2+steel)/100)*100,steel,days:Math.round(10+(steel?3:0)),to:maxCond(s)};}
 return {cost:Math.round(base*0.9/100)*100,steel:0,days:3,to:Math.min(maxCond(s),Math.max(s.cond,s.cond+4))};}
function doSurvey(s){if(s.state!=='idle'||!svOpen(s))return false;S.done.svy=1;const f=svInfo(s);if(!f){toast(L('Sörvey tersaneli bir limanda yapılır','Surveys are done at a port with a shipyard','检验须在有船厂的港口进行'),'','bad');return false;}

 for(const [k,p,lo,la,v] of A){if(S.wx.filter(w=>w.k===k).length>=2||Math.random()>p)continue;const K=WXK[k];
  S.wx.push({id:S.nid++,k,nm:k==='gal'?'':WXN[(S.wxN=(S.wxN||0)+1)%WXN.length],lon:rnd(lo[0],lo[1]),lat:rnd(la[0],la[1]),vx:v[0]*rnd(0.8,1.2),vy:v[1]*rnd(0.7,1.3),r:K.r*rnd(0.85,1.15),str:rnd(0.65,1),age:0,life:rnd(K.life[0],K.life[1])});}}

 if(Math.random()<0.012){const p=pick(PORTS.filter(x=>portUnl(x.id)));S.strike[p.id]=day+ri(8,16);toast(L(p.n+' limanında grev: gemiler kuyrukta bekliyor',p.n+': port strike, ships are queuing',p.n+'港口罢工：船舶排队等候'),'','warn');
  logMsg(()=>L(p.n+' limanında liman işçileri greve çıktı',p.n+': dock workers have gone on strike',p.n+'：码头工人罢工'));}}

 if(v>40000&&Math.random()<0.25){const Pn=PORT[c.to].n;lawOpen('dem',s,v,0.62,()=>L(s.name+' '+Pn+' limanında laytime’ı aştı ama kiracı demurajı ödemeyi reddediyor; gecikmenin gemiden kaynaklandığını iddia ediyor.',s.name+' went over laytime at '+Pn+', but the charterer refuses to pay demurrage, claiming the delay was the ship’s fault.',s.name+'在'+Pn+'超出装卸时间，但租船人拒付滞期费，声称延误是船方造成的。'));return 0;}

/* ---------- karbon: CII notu, ekonomik seyir, AB emisyon bedeli ---------- */
const EUP=()=>PORTS.filter(p=>EU.includes(p.c)).map(p=>p.id);
const isEU=pid=>!!PORT[pid]&&EU.includes(PORT[pid].c);
const CIIB=['A','B','C','D','E'];
function ciiRef(cls){const c=CLS[cls];return ((c.cons[0]+c.cons[1])/2)/(((c.spd[0]+c.spd[1])/2)*24*((c.dwt[0]+c.dwt[1])/2));}
function ciiReq(y){return 1-0.017*Math.min(10,(y||gameYear())-2026);}
function slowFrac(s){return (s.sdy||0)>20?(s.sly||0)/s.sdy:(s.slow?1:0);}
function ciiAtt(s){const q=1+0.4*((s.cons/(s.spd*24*s.dwt))/ciiRef(s.cls)-1);
 return q*(1+0.005*(s.age-12))*(s.cond<70?1+(70-s.cond)/250:1)*(up(s,'prop')?0.95:1)*(up(s,'coat')?0.97:1)*(up(s,'eng')?0.97:1)*(s.lngf?0.75:1)*(1-0.18*slowFrac(s));}
function ciiRatio(s,y){return ciiAtt(s)/ciiReq(y);}
function ciiBand(r){return r<=0.92?0:r<=1.0?1:r<=1.1?2:r<=1.21?3:4;}
const ciiNow=s=>ciiBand(ciiRatio(s));
const ciiOf=s=>s.cii===undefined?2:s.cii;
function ciiMul(s){return [1.04,1.02,1,0.96,0.9][ciiOf(s)];}
function ciiBanned(s){return ciiOf(s)===4;}
function ciiYear(){tip('cii');const y=gameYear()-1,A=[0,0,0,0,0];for(const s of S.ships){const b=ciiBand(ciiRatio(s,y));s.cii=b;s.ciiY=y;s.cf=0;s.cd=0;s.sdy=0;s.sly=0;A[b]++;}
 if(!S.ships.length)return;const ban=S.ships.filter(ciiBanned).map(s=>s.name);
 pushInfo(()=>L(y+' karbon notları',y+' carbon ratings',y+'年碳强度评级'),()=>L('Gemilerinin '+y+' yılı karbon yoğunluğu notları (CII): '+CIIB.map((b,i)=>A[i]?b+' '+A[i]:'').filter(Boolean).join(', ')+'. A ve B notlu gemilere yük sahipleri biraz fazla öder, D ve E notlulara daha az. '+(ban.length?ban.join(', ')+' E notu yüzünden Avrupa Birliği limanlarına giremez. ':'')+'Kurallar her yıl yaklaşık %2 sıkılaşıyor; ekonomik seyir, makine revizyonu ve yeni gemiler notu iyileştirir.',
  'Your ships’ carbon intensity ratings (CII) for '+y+': '+CIIB.map((b,i)=>A[i]?b+' '+A[i]:'').filter(Boolean).join(', ')+'. Cargo owners pay a little more for A and B ships and less for D and E. '+(ban.length?ban.join(', ')+' cannot enter EU ports because of an E rating. ':'')+'The rules tighten by about 2% a year; slow steaming, engine overhauls and new ships improve the rating.',
  '你的船舶'+y+'年碳强度评级（CII）：'+CIIB.map((b,i)=>A[i]?b+' '+A[i]:'').filter(Boolean).join('，')+'。货主对A、B级船舶的运费略高，对D、E级船舶的运费较低。'+(ban.length?ban.join('，')+'因E级不得进入欧盟港口。':'')+'规则每年收紧约2%；经济航速、主机大修和新船都能改善评级。'));}
function etsShare(a,b){return isEU(a)&&isEU(b)?1:isEU(a)||isEU(b)?0.5:0;}
function etsPhase(){return gameYear()<=2027?0.7:1;}
function etsCalc(fuel,a,b){return Math.round(fuel*3.114*etsShare(a,b)*S.eua*etsPhase()/10)*10;}
function etsArrive(s,v){if(!v||!v.fu)return;const c=etsCalc(v.fu,v.from,v.to);if(c<=0)return;pay(c,'karbon',s);const co=Math.round(v.fu*3.114);
 logMsg(()=>L(s.name+': AB emisyon bedeli '+USD(c)+' ('+N(co)+' t CO₂)',s.name+': EU emissions charge '+USD(c)+' ('+N(co)+' t CO₂)',s.name+'：欧盟排放费'+USD(c)+'（'+N(co)+'吨二氧化碳）'));}

const TERML=[null,['Rıhtım','Berth','泊位'],['Terminal','Terminal','码头'],['Büyük terminal','Major terminal','大型码头']];
function termBase(pid){return Math.round(5e6*(1+0.25*portTier(pid))*(1+congBase(pid)*0.15)/1e5)*1e5;}
function termCost(pid,lvl){return Math.round(termBase(pid)*[0,1,1.4,1.9][lvl]/1e4)*1e4;}

function termSell(pid){const t=S.term[pid];if(!t)return;const v=Math.round(t.inv*0.8/1e4)*1e4;earn(v,'terminal');delete S.term[pid];
 logMsg(()=>L(PORT[pid].n+' terminali satıldı: '+USD(v),PORT[pid].n+' terminal sold: '+USD(v),PORT[pid].n+'码头已出售：'+USD(v)));save();}
function termMonth(){for(const pid in S.term){const t=S.term[pid],b=termBase(pid),rev=Math.round(b*0.014*[0,1,2.1,3.3][t.lvl]*rnd(0.85,1.15)*(S.strike[pid]>S.day?0.4:1)/100)*100,cost=Math.round(b*0.0025*t.lvl/100)*100;
 earn(rev,'terminal');pay(cost,'terminal');t.inc=rev-cost;t.tot=(t.tot||0)+rev-cost;}}
const hasTerm=pid=>!!(S.term&&S.term[pid]);

 if(!s.port){toast(L('Kadet limanda katılır','Cadets join in port','实习生须在港口上船'),'','bad');return false;}if((s.cad||[]).length>=2){toast(L('Bir gemide en fazla iki kadet olur','A ship can take at most two cadets','每艘船最多两名实习生'),'','bad');return false;}
 const c=S.cpool.splice(i,1)[0];c.since=Math.floor(S.day);s.cad=s.cad||[];s.cad.push(c);pay(800,'personel',s);S.cpool.push(mkCadet());

function cadetGrad(s,c){const role=c.track==='deck'?'zab':'c2',ment=sk(s,c.track==='deck'?'kap':'cb'),skill=clamp(Math.round(1+c.pot*0.45+(ment>=4?1:0)+rnd(-0.4,0.4)),1,4),nat=c.nat;

 for(const c of s.cad.slice()){if(sea)c.sd++;if(s.morale<25&&Math.random()<0.004){s.cad.splice(s.cad.indexOf(c),1);toast(L(s.name+': kadet '+c.name+' moral bozukluğundan programı bıraktı',s.name+': cadet '+c.name+' quit the programme over low morale',s.name+'：实习生'+c.name+'因士气低落退出计划'),s.id,'bad');continue;}
  if(c.sd>=300&&!c.done&&!S.ev.some(e=>e.k==='grad')){c.done=1;const p=cadetGrad(s,c),role=p.role,cur=s.crew[role];c.pid=p.id;c.grad=p;

    opts:[{l:()=>L('Bu gemide göreve başlasın','Put them to work on this ship','在本船任职'),s:()=>cur?L('mevcut '+ROLE[role].n.toLocaleLowerCase('tr')+' acenteye döner','the current '+ROLE[role].n.toLowerCase()+' goes back to the agency','现任'+ROLE[role].n+'回到中介'):L('boş göreve atanır','fills the vacancy','填补空缺')},{l:()=>L('Acentede beklesin','Keep them at the agency','留在中介待命'),s:()=>L('istediğin gemiye sonra atarsın (6 ay bekler)','assign them to any ship later (waits 6 months)','以后可派到任意船上（等待6个月）')}]});}}}}

/* ---------- sözleşmeler ve personel değişimi ---------- */
const CONTR={kap:120,cb:120,zab:160,c2:160,asc:240};
const NOAIR=['TRP','ALG','NOV','BND','KHI','CGP','DKR','MBA','SSZ'];
const crewAir=pid=>!!pid&&!NOAIR.includes(pid)&&rel(PORT[pid].c)>=30;
const NATH={TR:[33,39],PH:[121,14],UA:[31,49],IN:[77,20],GE:[44,42],AZ:[49,40],ID:[107,-6],CN:[116,40]};
function travelCost(p,pid){const h=NATH[p.nat]||[30,40],P=PORT[pid],d=hav([h[0],h[1]],[P.lon,P.lat]);return Math.round((700+d*0.32)/50)*50;}

/* süresi dolan denizciyi izne gönderip yerine benzer birini alır */
function crewChange(s,rk){if(!s.port||!crewAir(s.port))return false;const p=s.crew[rk];if(!p)return false;
 const want=p.skill,A=S.pool.filter(q=>q.role===rk).sort((a,b)=>(b.own||b.ret?1:0)-(a.own||a.ret?1:0)||Math.abs(a.skill-want)-Math.abs(b.skill-want)||a.wage-b.wage);if(!A.length)return false;
 const q=A[0],c=travelCost(p,s.port)+travelCost(q,s.port);delete s.crew[rk];S.leave.push({p,back:Math.floor(S.day)+ri(45,90)});
 S.pool.splice(S.pool.indexOf(q),1);s.crew[rk]=q;q.since=Math.floor(S.day);q.ce=Math.floor(S.day)+CONTR[rk]+ri(-15,15);pay(c,'personel',s);q.poolT=undefined;
 if(S.pool.filter(x=>x.role===rk).length<3)S.pool.push(mkPerson(rk,rndSkill()));
 logMsg(()=>L(s.name+': '+ROLE[rk].n+' değişimi, '+p.name+' izne çıktı, yerine '+q.name+' geldi (yol '+USD(c)+')',s.name+': '+ROLE[rk].n.toLowerCase()+' change, '+p.name+' went on leave, '+q.name+' joined (travel '+USD(c)+')',s.name+'：'+ROLE[rk].n+'换班，'+p.name+'休假，'+q.name+'上船（差旅'+USD(c)+'）'));return true;}
function crewChangeAll(s){let n=0;for(const r of dueCrew(s))if(crewChange(s,r.k))n++;return n;}

 const k=pick(['fire','ground']),C=Math.round((80000+s.dwt*3)*(1.25-s.cond/100)/1000)*1000,dl=ri(6,12),what={fire:['makine dairesinde yangın','an engine-room fire','机舱火灾'],ground:['karaya oturma','a grounding','搁浅']}[k];

const RZ={red:{n:['Güney Kızıldeniz','Southern Red Sea','红海南部'],b:[[38,12,44,20]],k:'war'},aden:{n:['Aden Körfezi ve Somali','Gulf of Aden and Somalia','亚丁湾和索马里'],b:[[43,10,58,16],[48,0,62,10]],k:'pir'},guinea:{n:['Gine Körfezi','Gulf of Guinea','几内亚湾'],b:[[-4,-2,9,7]],k:'pir'},hormuz:{n:['Hürmüz Boğazı','Strait of Hormuz','霍尔木兹海峡'],b:[[54,24.5,58,27.5]],k:'seize'},bsea:{n:['Kuzey Karadeniz','Northern Black Sea','黑海北部'],b:[[30,43,40,47]],k:'mine'}};
const RZL=[['sakin','calm','平静'],['dikkat','caution','注意'],['yüksek','high','高'],['çok yüksek','very high','极高']];
function rzLvl(z){let l=(S.rz&&S.rz[z])||0;if(z==='red'&&S.pol&&S.pol.cr.redsea)l=Math.max(l,2);if(z==='hormuz'&&S.pol&&S.pol.cr.hormuz)l=Math.max(l,2);return clamp(l,0,3);}
function rzAt(lon,lat){for(const z in RZ)for(const b of RZ[z].b)if(lon>=b[0]&&lon<=b[2]&&lat>=b[1]&&lat<=b[3])return z;return null;}
function rzRoute(path){const out=new Set();for(let i=0;i<path.length;i++){const n=NODE[path[i]];if(!n)continue;const z=rzAt(n[0],n[1]);if(z)out.add(z);if(i){const m=NODE[path[i-1]];if(m){const z2=rzAt((n[0]+m[0])/2,(n[1]+m[1])/2);if(z2)out.add(z2);}}}return [...out].filter(z=>rzLvl(z)>0);}
function rzCost(s,z){const l=rzLvl(z),v=shipValue(s),ins=RZ[z].k==='pir'?v*0.0006*l:v*0.0012*l,grd=RZ[z].k==='pir'?(z==='guinea'?25000:18000):0;return {ins:Math.round(ins/100)*100,grd};}
function rzEst(s,path){const zs=rzRoute(path);let cost=0;for(const z of zs){const c=rzCost(s,z);cost+=(S.rpol.ins?c.ins:0)+(S.rpol.grd?c.grd:0);}return {zs,cost};}
function rzEnter(s,z){const v=s.voy;v.rz=v.rz||{};if(v.rz[z])return;const c=rzCost(s,z),r={ins:!!S.rpol.ins,grd:!!S.rpol.grd&&c.grd>0};v.rz[z]=r;
 if(r.ins&&c.ins){pay(c.ins,'sigorta',s);}if(r.grd){pay(c.grd,'sigorta',s);}
 if((r.ins&&c.ins)||r.grd)logMsg(()=>L(s.name+': '+tx(RZ[z].n)+' için '+(r.ins?'savaş riski sigortası':'')+(r.ins&&r.grd?' ve ':'')+(r.grd?'silahlı koruma':'')+' '+USD((r.ins?c.ins:0)+(r.grd?c.grd:0)),s.name+': '+(r.ins?'war-risk cover':'')+(r.ins&&r.grd?' and ':'')+(r.grd?'armed guards':'')+' for '+tx(RZ[z].n)+' '+USD((r.ins?c.ins:0)+(r.grd?c.grd:0)),s.name+'：'+tx(RZ[z].n)+(r.ins?'战争险':'')+(r.ins&&r.grd?'和':'')+(r.grd?'武装护卫':'')+USD((r.ins?c.ins:0)+(r.grd?c.grd:0))));}
function rzDay(){for(const s of S.ships){const sea=s.state==='sea'&&s.voy;if(!sea)continue;const p=posOn(s.voy),z=rzAt(p.lon,p.lat);if(!z)continue;const l=rzLvl(z);if(!l)continue;rzEnter(s,z);const r=s.voy.rz[z],K=RZ[z].k;
 let pr={pir:0.025,war:0.02,seize:0.012,mine:0.01}[K]*l*(K==='pir'&&r.grd?0.15:1)*(up(s,'sec')?0.5:1);if(Math.random()>pr||S.ev.some(e=>e.sid===s.id))continue;rzHit(s,z,r);}}
function rzHit(s,z,r){const K=RZ[z].k,zn=tx(RZ[z].n);let cost=0,days=0,cov=0,msg;
 if(K==='pir'){if(r.grd&&Math.random()<0.9){toast(L(s.name+': korsan saldırısı silahlı korumayla püskürtüldü',s.name+': pirates driven off by the armed guards',s.name+'：武装护卫击退了海盗'),s.id,'ok');s.morale=Math.max(0,s.morale-6);return;}
  cost=Math.round((z==='guinea'?150000:280000)+s.dwt*3);days=ri(12,25);cov=r.ins?0.8:0;s.morale=Math.max(0,s.morale-40);
  msg=[(z==='guinea'?'Korsanlar gemiye çıktı ve üç denizciyi kaçırdı. ':'Gemi korsanların eline geçti. ')+'Fidye ve aracı masrafı '+USD(cost)+(cov?', sigorta %80’ini karşıladı':'')+'. Gemi '+days+' gün tutuldu.',(z==='guinea'?'Pirates boarded the ship and kidnapped three seafarers. ':'The ship was hijacked by pirates. ')+'Ransom and negotiators cost '+USD(cost)+(cov?'; insurance covered 80%':'')+'. The ship was held for '+days+' days.',(z==='guinea'?'海盗登船并绑架了三名船员。':'船舶被海盗劫持。')+'赎金和谈判费用'+USD(cost)+(cov?'，保险赔付了80%':'')+'。船舶被扣'+days+'天。'];}
 else if(K==='war'){cost=Math.round(60000+s.dwt*1.2);days=3;cov=r.ins?0.9:0;s.cond=Math.max(15,s.cond-15);s.morale=Math.max(0,s.morale-20);msg=['Gemi '+zn+' açıklarında insansız hava aracıyla vuruldu. Hasar '+USD(cost)+(cov?', savaş riski sigortası %90’ını karşıladı':'')+'. Yaralı yok.','The ship was hit by a drone off the '+zn+'. Damage '+USD(cost)+(cov?'; war-risk cover paid 90%':'')+'. No injuries.','船舶在'+zn+'附近遭无人机袭击。损失'+USD(cost)+(cov?'，战争险赔付了90%':'')+'。无人受伤。'];}
 else if(K==='seize'){days=ri(10,30);addRel('IR',-3);msg=['Gemi '+zn+' açıklarında askerler tarafından durdurulup alıkonuldu. '+days+' gün sonra serbest bırakıldı.','The ship was stopped and detained by soldiers off the '+zn+'. She was released after '+days+' days.','船舶在'+zn+'附近被军方拦截扣押，'+days+'天后获释。'];}
 else{cost=Math.round(100000+s.dwt*1.5);days=6;cov=r.ins?0.9:0;s.cond=Math.max(15,s.cond-25);s.morale=Math.max(0,s.morale-25);msg=['Gemi '+zn+' bölgesinde sürüklenen bir mayına çarptı. Hasar '+USD(cost)+(cov?', savaş riski sigortası %90’ını karşıladı':'')+'.','The ship struck a drifting mine in the '+zn+'. Damage '+USD(cost)+(cov?'; war-risk cover paid 90%':'')+'.','船舶在'+zn+'触碰漂雷。损失'+USD(cost)+(cov?'，战争险赔付了90%':'')+'。'];}
 if(cost)pay(Math.round(cost*(1-cov)),'bakım',s);s.hold=(s.hold||0)+days;
 pushInfo(()=>L('Saldırı: ','Attack: ','遇袭：')+s.name,()=>L(msg[0],msg[1],msg[2]));logMsg(()=>L(s.name+': '+zn+' bölgesinde saldırı',s.name+': attacked in the '+zn,s.name+'：在'+zn+'遇袭'));}
function rzMonth(){for(const z in S.rz){if(Math.random()<0.18){const o=S.rz[z];S.rz[z]=clamp(o+(Math.random()<0.5?-1:1),0,3);if(S.rz[z]!==o){const up2=S.rz[z]>o,lv=S.rz[z];rnews(()=>L(tx(RZ[z].n)+': risk '+(up2?'arttı':'azaldı')+' ('+tx(RZL[lv])+')',tx(RZ[z].n)+': risk '+(up2?'rising':'easing')+' ('+tx(RZL[lv])+')',tx(RZ[z].n)+'：风险'+(up2?'上升':'下降')+'（'+tx(RZL[lv])+'）'));}}}}

function caseP(c){return clamp(c.p0+0.07*lawSk(),0.05,0.92);}
function caseFee(c){return lawyer()?Math.round((3000+c.amt*0.01)/100)*100:Math.round((9000+c.amt*0.07)/100)*100;}
function caseSet(c){const k=lawSk();return Math.round(c.amt*(LAWK[c.k].us?0.42+0.06*k:0.72-0.05*k)/100)*100;}
function caseDays(c){return Math.max(45,ri(80,160)-8*lawSk());}
function lawOpen(k,s,amt,p0,story){amt=Math.round(amt/1000)*1000;const c={id:S.cnid++,k,sid:s?s.id:0,sn:s?s.name:'',amt,p0,t0:Math.floor(S.day),st:'new',story:LX(story)};S.cases.push(c);tip('case');
 const K=LAWK[k],us=!!K.us;
 pushEv({k:'case',sid:c.sid,title:()=>tx(K.n)+(c.sn?': '+c.sn:''),body:()=>tx(c.story)+' '+(us?L('Alacağın '+USD(c.amt)+'. Kiracı ödemiyor.','You are owed '+USD(c.amt)+'. The charterer refuses to pay.','应收'+USD(c.amt)+'，租船人拒绝支付。'):L('Talep edilen '+USD(c.amt)+'. Davayı açan: '+tx(K.by)+'.','The claim is '+USD(c.amt)+', brought by '+tx(K.by)+'.','索赔金额'+USD(c.amt)+'，起诉方：'+tx(K.by)+'。'))+' '+(lawyer()?L('Hukuk müşavirin '+lawyer().name+' mahkemede kazanma şansını yaklaşık %'+Math.round(caseP(c)*100)+' görüyor.','Your legal counsel '+lawyer().name+' puts the chance of winning in court at about '+Math.round(caseP(c)*100)+'%.','你的法律顾问'+lawyer().name+'认为胜诉几率约为'+Math.round(caseP(c)*100)+'%。'):L('Hukuk müşavirin olmadığı için davayı dışarıdan bir büroya vermen gerekir; kazanma şansını kestiremiyorsun.','You have no legal counsel, so the case would go to an outside law firm, and you can’t judge the chances.','你没有法律顾问，案件只能交给外部律所，也无法判断胜算。')),d:{cid:c.id},
  opts:[{l:()=>us?L('Uzlaş','Settle','和解'):L('Uzlaş','Settle','和解'),s:()=>us?L(USD(caseSet(c))+' tahsil edilir · hemen kapanır',USD(caseSet(c))+' collected · closed at once','收回'+USD(caseSet(c))+' · 立即结案'):L(USD(caseSet(c))+' ödenir · hemen kapanır',USD(caseSet(c))+' paid · closed at once','支付'+USD(caseSet(c))+' · 立即结案')},
   {l:()=>us?L('Dava aç','Sue','起诉'):L('Mahkemede savun','Defend in court','出庭应诉'),s:()=>L('avukatlık ve mahkeme masrafı '+USD(caseFee(c))+' · karar '+caseDays(c)+' gün civarı','legal fees '+USD(caseFee(c))+' · ruling in about '+caseDays(c)+' days','律师和诉讼费'+USD(caseFee(c))+' · 约'+caseDays(c)+'天后判决')+(us?'':L(' · kaybedersen '+USD(c.amt),' · '+USD(c.amt)+' if you lose',' · 败诉需付'+USD(c.amt)))}]
   .concat(lawyer()?[{l:()=>L('Hukuk müşavirine bırak','Leave it to your counsel','交给法律顾问'),s:()=>L('en akıllıca yolu o seçer','they choose the wisest course','由其选择最明智的做法')}]:[])});
 return c;}
function lawDecide(c,i){if(i===2){const p=caseP(c),f=caseFee(c),us=!!LAWK[c.k].us;i=us?(p*c.amt-f>caseSet(c)?1:0):((1-p)*c.amt+f<caseSet(c)?1:0);
  const l=lawyer();if(l){l.stat.jobs++;}logMsg(()=>L((l?l.name:'')+': '+tx(LAWK[c.k].n)+' için '+(i?'mahkeme':'uzlaşma')+' yolunu seçti',(l?l.name:'')+' chose to '+(i?'go to court':'settle')+' in the '+tx(LAWK[c.k].n).toLowerCase(),(l?l.name:'')+'决定'+tx(LAWK[c.k].n)+(i?'诉诸法庭':'和解')));}
 const us=!!LAWK[c.k].us;
 if(i===0){const v=caseSet(c);if(us)earn(v,'hukuk');else{pay(v,'hukuk');addRep(-Math.ceil(LAWK[c.k].rep/2));}c.st='done';c.res='set';c.paid=us?-v:v;c.end=Math.floor(S.day);
  logMsg(()=>L(tx(LAWK[c.k].n)+' uzlaşmayla kapandı: '+USD(v),tx(LAWK[c.k].n)+' settled: '+USD(v),tx(LAWK[c.k].n)+'和解结案：'+USD(v)));}
 else{const f=caseFee(c);pay(f,'hukuk');c.st='court';c.fee=f;c.due=Math.floor(S.day)+caseDays(c);c.p=caseP(c);if(lawyer())lawyer().stat.jobs++;}}
function lawVerdict(c){const win=Math.random()<c.p,us=!!LAWK[c.k].us,l=lawyer();c.st='done';c.end=Math.floor(S.day);c.res=win?'won':'lost';
 if(us){if(win){earn(c.amt,'hukuk');c.paid=-c.amt;}}
 else if(win){addRep(1);if(c.sec){earn(c.sec,'hukuk');c.sec=0;}c.paid=0;}
 else{const owe=Math.max(0,c.amt-(c.sec||0));pay(owe,'hukuk');c.paid=c.amt;c.sec=0;addRep(-LAWK[c.k].rep);}
 if(l&&win)l.stat.won=(l.stat.won||0)+1;
 pushInfo(()=>L('Karar: ','Ruling: ','判决：')+tx(LAWK[c.k].n),()=>win?(us?L('Mahkeme haklı buldu, kiracı '+USD(c.amt)+' ödeyecek.','The court found in your favour; the charterer must pay '+USD(c.amt)+'.','法院判你胜诉，租船人须支付'+USD(c.amt)+'。'):L('Mahkeme şirketini haklı buldu, tazminat ödenmeyecek.'+(c.secd?' Yatırdığın teminat geri döndü.':''),'The court found in your company’s favour; no damages are due.'+(c.secd?' Your security has been returned.':''),'法院判你公司胜诉，无需赔偿。'+(c.secd?'你缴纳的担保金已退还。':''))):(us?L('Mahkeme kiracıyı haklı buldu, alacağını tahsil edemedin.','The court sided with the charterer; you could not recover the money.','法院支持租船人，你没能追回款项。'):L('Mahkeme şirketini kusurlu buldu: '+USD(c.amt)+' tazminat. İtibarın zarar gördü.','The court found your company at fault: '+USD(c.amt)+' in damages. Your reputation has suffered.','法院判你公司有过错：赔偿'+USD(c.amt)+'，声誉受损。')));}

function lawArrive(s,P){const c=S.cases.find(x=>x.st==='court'&&x.sid===s.id&&!x.secd&&!LAWK[x.k].us&&['cargo','coll','quay','crew'].includes(x.k));if(!c||Math.random()>0.3||S.ev.some(e=>e.sid===s.id))return;
 pushEv({k:'arrest',sid:s.id,title:()=>L('Gemi tutuklandı: ','Ship arrested: ','船舶被扣押：')+s.name,body:()=>L(P.n+' mahkemesi, '+tx(LAWK[c.k].n).toLocaleLowerCase('tr')+' için davacının talebiyle gemiyi tutukladı. Teminat yatırmadan ya da uzlaşmadan gemi limandan çıkamaz.','At the claimant’s request, the court in '+P.n+' has arrested the ship over the '+tx(LAWK[c.k].n).toLowerCase()+'. She cannot leave port until you post security or settle.',P.n+'法院应原告申请，就'+tx(LAWK[c.k].n)+'扣押了该船。在提供担保或和解之前，船舶不得离港。'),d:{cid:c.id},
  opts:[{l:()=>L('Teminat yatır','Post security','提供担保'),s:()=>USD(c.amt)+L(' · davayı kazanırsan geri döner',' · returned if you win',' · 胜诉后退还')},{l:()=>L('Uzlaş','Settle','和解'),s:()=>USD(caseSet(c))+L(' · dava kapanır',' · the case is closed',' · 结案')}]});}
function lawArrest(c,i,s){if(i===0){pay(c.amt,'hukuk');c.sec=c.amt;c.secd=1;}else{const v=caseSet(c);pay(v,'hukuk');addRep(-1);c.st='done';c.res='set';c.paid=v;c.end=Math.floor(S.day);}if(s){s.op=(s.op||0)+1;}addRep(-1);}
function lawWhistle(s){if(Math.random()<(s.morale<40?0.3:0.16))S.whq.push({sid:s.id,sn:s.name,at:Math.floor(S.day)+ri(20,120),amt:(60000+s.dwt*3)*1.6});}
const TSS=[[0.5,50.5,2.5,51.6],[98,0.8,104.5,6],[28.8,40.9,29.3,41.3],[-6.2,35.7,-5.2,36.2],[32.2,29.8,32.7,31.4],[121,23,123,26]];
function inTSS(lon,lat){return TSS.some(b=>lon>=b[0]&&lon<=b[2]&&lat>=b[1]&&lat<=b[3]);}
function collRoll(s){if(s.state!=='sea'||!s.voy||S.ev.some(e=>e.sid===s.id))return;const p=posOn(s.voy);if(!inTSS(p.lon,p.lat))return;
 const pr=0.012*(1.6-0.15*sk(s,'kap'))*(s.morale<30?1.5:1)*(dueCrew(s).length?1.4:1);if(Math.random()>pr)return;
 const nm=pick(SHIPS2),dmg=Math.round((40000+s.dwt*1.2)/1000)*1000;pay(dmg,'bakım',s);s.cond=Math.max(15,s.cond-10);s.hold=(s.hold||0)+3;s.morale=Math.max(0,s.morale-10);
 lawOpen('coll',s,(120000+s.dwt*6)*rnd(0.7,1.4),0.3+0.06*sk(s,'kap'),()=>L(s.name+', trafik ayırım düzeninde '+nm+' ile çatıştı. Kendi hasarın '+USD(dmg)+', 3 gün kayıp. Diğer gemi kusurun bizde olduğunu iddia ediyor.',s.name+' collided with '+nm+' in a traffic separation scheme. Your own damage is '+USD(dmg)+' and 3 days are lost. The other ship says we were at fault.',s.name+'在分道通航区与'+nm+'相撞。本船损失'+USD(dmg)+'，耽误3天。对方声称过错在我方。'));}
function quayRoll(s,P){if(cong(P.id)<2||Math.random()>0.02*(1.5-0.1*sk(s,'kap')))return;const a=(30000+s.dwt*1.5)*rnd(0.8,1.3);
 lawOpen('quay',s,a,0.35,()=>L(s.name+' '+P.n+' limanında yanaşırken rıhtıma sert çarptı ve iskeleye zarar verdi.',s.name+' struck the quay hard while berthing at '+P.n+' and damaged it.',s.name+'在'+P.n+'靠泊时重重撞上码头，造成损坏。'));}
function lawDay(){for(const c of S.cases)if(c.st==='court'&&S.day>=c.due)lawVerdict(c);
 for(const w of S.whq.slice())if(S.day>=w.at){S.whq.splice(S.whq.indexOf(w),1);const s=S.ships.find(x=>x.id===w.sid);
  lawOpen('marpol',s||null,w.amt,0.3,()=>L('Eski bir denizci, '+w.sn+' gemisinden denize yağlı su basıldığını belge ve fotoğraflarla ihbar etti.','A former seafarer has reported, with documents and photos, that oily water was pumped overboard from '+w.sn+'.','一名前船员举报'+w.sn+'向海里排放含油污水，并提供了文件和照片。'));}
 for(const s of S.ships)collRoll(s);
 S.cases=S.cases.filter(c=>c.st!=='done'||S.day-c.end<200);}
function lawEv(ev,i,s,d){if(ev.k==='case'){const c=S.cases.find(x=>x.id===d.cid);if(c)lawDecide(c,i);return true;}
 if(ev.k==='arrest'){const c=S.cases.find(x=>x.id===d.cid);if(c)lawArrest(c,i,s);return true;}return false;}

 const opts=`<div class="opts">${ev.opts.map((o,i)=>`<button type="button" class="btn opt ${ev.opts.length===1||(ev.k==='maint'&&i===0)?'pri':''}" data-a="ev" data-i="${i}">${esc(tx(o.l))}${o.s?`<small>${esc(tx(o.s))}</small>`:''}</button>`).join('')}</div>${canAuto?`<button type="button" class="chk" data-a="evAuto" aria-pressed="${!!ui.evAuto}"><i>${ui.evAuto?'✓':''}</i><span>${L('Bu tür durumlarda bir daha sorma, aynı kararı uygula','Don’t ask again in this kind of situation, apply the same decision','遇到此类情况不再询问，采用同样的决定')}</span></button>`:''}`;
 return `<div class="dlg ${two?'two ':''}${ev.k==='pol'?'pold':ev.k==='maint'?'warnd':ev.k==='lvl'?'lvd':''}" role="dialog" aria-modal="true" aria-labelledby="evT"><div class="dl">${who}<h2 id="evT">${esc(tx(ev.title))}</h2><p>${esc(tx(ev.body))}</p></div><div class="dr">${opts}</div></div>`;}
function vAsk(A){return `<div class="dlg two warnd" role="dialog" aria-modal="true" aria-labelledby="akT"><div class="dl"><h2 id="akT">${L(A.length+' gemin emir bekliyor',A.length+' '+pl(A.length,'ship is','ships are')+' awaiting orders',A.length+'艘船在等待指令')}</h2><p>${L('Zaman başlatılmadı. Boşta bekleyen gemi her gün maaş ve işletme gideri yazar.','Time hasn’t started. An idle ship still costs wages and running costs every day.','时间尚未开始。闲置的船每天仍要支付工资和运营费用。')}</p><button type="button" class="btn pri" data-a="askQuick">${L('Hepsini hızlı sevk et','Quick-dispatch all','全部快速派船')}<small>${L('her gemiye en kârlı güvenli yük','the most profitable safe cargo for each ship','为每艘船选最赚钱的安全货物')}</small></button></div><div class="dr"><div class="opts">${A.map(s=>`<button type="button" class="btn opt sm" data-a="askShip" data-id="${s.id}">${esc(s.name)}<small>${L(PORT[s.port].n+' limanında · emir ver','at '+PORT[s.port].n+' · give orders','在'+PORT[s.port].n+' · 下达指令')}</small></button>`).join('')}<button type="button" class="btn opt sm" data-a="askGo">${L('Yine de zamanı başlat','Start time anyway','仍然开始计时')}<small>${L('bu gemiler limanda bekler','these ships wait in port','这些船在港等待')}</small></button><button type="button" class="btn opt xs" data-a="askClose">${L('Kapat','Close','关闭')}</button></div></div></div>`;}

/* ================= ARAYÜZ: banka, kiralama, klas, rakipler ================= */

/* ---------- banka ---------- */
function loanLeft(l){const r=l.rate/12;if(l.pay<=l.bal*r)return l.n;return Math.max(1,Math.ceil(-Math.log(1-l.bal*r/l.pay)/Math.log(1+r)));}
function vBank(){const lim=bankLimit(),dt=debt(),yr=L(' / yıl',' / yr',' / 年');
 let h=`<div class="card"><h3 class="h">${L('Banka','Bank','银行')}</h3>${kv(L('Toplam kredi borcu','Total loan debt','贷款总额'),USD(dt),dt?'neg':'')}${dt?kv(L('Aylık taksitler','Monthly instalments','每月还款'),USD(debtPay())):''}${kv(L('Kullanılabilir kredi','Credit available','可用贷款额度'),USD(lim))}${kv(L('İşletme kredisi faizi','Business loan rate','经营贷款利率'),PCT1(loanRate('biz'))+yr)}${kv(L('Gemi kredisi faizi','Ship mortgage rate','船舶抵押贷款利率'),PCT1(loanRate('ship'))+yr)}`;
 h+=S.loans.map(l=>{const sh=l.sid?ship(l.sid):null,n=loanLeft(l),fee=Math.round(l.bal*0.01);return `<div class="prow"><span class="pn">${l.kind==='ship'?L('Gemi kredisi','Ship mortgage','船舶抵押贷款')+(sh?' · '+esc(sh.name.slice(4)):''):L('İşletme kredisi','Business loan','经营贷款')}<small>${L('kalan ','left ','剩余')}${USD(l.bal)} · ${USD(l.pay)}${L('/ay','/mo','/月')} · ${L(n+' taksit',n+' '+pl(n,'payment','payments'),n+'期')} · ${PCT1(l.rate)}</small></span><span></span><button type="button" class="btn xs" data-a="repay" data-id="${l.id}">${L('Kapat','Repay','还清')}<small>${MUSD(l.bal+fee)}</small></button></div>`;}).join('');
 const opts=[];[0.25,0.5,1].forEach(f=>{const a=Math.floor(lim*f/50000)*50000;if(a>=50000&&!opts.some(x=>x[1]===a))opts.push([f,a]);});
 if(opts.length)h+=`<div class="btns">${opts.map(([f,a])=>`<button type="button" class="btn sm" data-a="borrow" data-f="${f}">${L('Kredi çek','Borrow','借款')} ${MUSD(a)}<small>24 ${L('ay','mo','个月')} · ${USD(Math.round(annuity(a,loanRate('biz'),24)))}${L('/ay','/mo','/月')}</small></button>`).join('')}</div>`;
 return h+`<p class="note">${L('Banka, filo değerine, ofisine ve itibarına göre kredi verir; itibar arttıkça faiz düşer. Taksitler her 30 günde bir otomatik ödenir. Gemi kredisiyle alınan gemi satılırsa kalan borç satıştan kapanır. Borç şirket değerinden düşülür.','The bank lends against your fleet value, office and reputation; better reputation means lower interest. Instalments are paid automatically every 30 days. If a mortgaged ship is sold, the remaining debt is paid from the sale. Debt is deducted from company value.','银行根据船队价值、办公室和声誉提供贷款；声誉越高，利率越低。每30天自动还款一次。抵押贷款购买的船舶出售时，剩余贷款从售船款中扣除。债务会从公司价值中扣除。')}</p></div>`;}

/* ---------- zaman çarteri ---------- */
function vTC(sh){const s=ship(sh.id),A=S.tco.filter(o=>o.cls===s.cls).sort((a,b)=>tcRate(s,b)-tcRate(s,a)),own=Math.round(wageDay(s)+opexDay(s));
 let h=`<p class="note">${L('Zaman çarterinde gemiyi bir kiracıya belli bir süre, günlük sabit ücretle verirsin. Yakıt, liman ve kanal masraflarını kiracı öder; personel, işletme ve bakım senin. Gemi hiç boş beklemez ama navlunlar yükselirse fazlasını kaçırırsın. Arıza olursa tamir süresince kira kesilir (off-hire). Günde yaklaşık 0,3 tecrübe kazandırır.','On a time charter you hand the ship to a charterer for a fixed period at a fixed daily rate. The charterer pays fuel, port and canal costs; crew, running costs and maintenance are yours. The ship is never idle, but you miss out if freight rates rise. A breakdown stops the hire while repairs last (off-hire). It earns about 0.3 XP a day.','期租时，你把船按固定日租金租给租家一段时间。燃油、港口和运河费用由租家承担；船员、运营和维修费用由你承担。船舶不会闲置，但运费上涨时你赚不到更多。发生故障时，修理期间停止计租（停租）。每天约获得0.3经验。')}</p>`;
 if(!A.length)return h+`<p class="note">${L('Bu sınıf için şu an kiralama teklifi yok.','No charter offers for this class right now.','目前没有该船型的租船报价。')}</p>`;
 return h+A.map(o=>{const r=tcRate(s,o),w=tcWhy(s,o),ex=Math.max(1,Math.ceil(o.exp-S.day));return `<div class="card"><div class="row"><b class="nm">${esc(o.who)}</b><b class="pr">${USD(r)}${L('/gün','/day','/天')}</b></div><div class="sub">${L(o.mo+' ay',o.mo+' months',o.mo+'个月')} · ${L('toplam yaklaşık ','about ','合计约')}${MUSD(r*o.mo*30)} · ${L('teklif '+ex+' gün geçerli','offer valid '+ex+' '+pl(ex,'day','days'),'报价有效期'+ex+'天')}</div>${kv(L('Senin günlük giderin','Your daily costs','你的每日成本'),USD(own))}${kv(L('Günlük net','Daily net','每日净收入'),USD(r-own),r-own>=0?'pos':'neg')}${w?`<p class="note neg">${w}${L('.','.','。')}</p>`:`<button type="button" class="btn pri" data-a="tcFix" data-id="${s.id}" data-o="${o.id}">${L('Kirala','Fix the charter','签订租约')}</button>`}</div>`;}).join('');}
function tcCard(s){const t=s.tc;if(!t)return '';const left=Math.max(0,Math.ceil(t.end-S.day));
 return `<div class="card"><h3 class="h">${L('Zaman çarteri','Time charter','期租')}</h3>${kv(L('Kiracı','Charterer','租家'),esc(t.who))}${kv(L('Günlük kira','Daily hire','日租金'),USD(t.rate))}${kv(L('Bitiş','Ends','结束'),fmtDate(t.end)+' · '+L(left+' gün',left+' '+pl(left,'day','days'),left+'天'))}${kv(L('Şimdiye kadar','Earned so far','已赚取'),USD(t.earned),'pos')}${t.offT?kv('Off-hire',DAYS(D1(t.offT)),'neg'):''}${t.off>0?`<p class="note neg">${L('Gemi arızalı, kira kesik.','The ship is broken down and off-hire.','船舶故障，停租中。')}</p>`:''}<p class="note">${L('Kiralama bitince gemi bulunduğu limanda sana geri teslim edilir.','When the charter ends, the ship is redelivered to you at the port where it is.','租期结束后，船舶会在所在港口交还给你。')}</p></div>`;}

/* ---------- klas sörveyi ---------- */
function svText(s){if(s.svP==='ara'||s.svP==='ozel')return svName(s.svP)+L(' yapılıyor',' in progress','进行中');const lf=Math.ceil(svLeft(s));
 if(lf<0)return L('askıda · '+svName(s.svK)+' '+(-lf)+' gün gecikti','suspended · '+svName(s.svK)+' '+(-lf)+' '+pl(-lf,'day','days')+' overdue','暂停 · '+svName(s.svK)+'逾期'+(-lf)+'天');
 return svName(s.svK)+' · '+(lf<=120?L(lf+' gün sonra','in '+lf+' '+pl(lf,'day','days'),lf+'天后'):fmtDate(s.svD));}
function svCls(s){const lf=svLeft(s);return s.svP?'':lf<0?'neg':lf<=120?'wrn':'';}
function svCard(s){if(!svOpen(s)||s.svP)return '';const f=svInfo(s),lf=Math.ceil(svLeft(s));
 return `<div class="card"><h3 class="h">${L('Klas sörveyi','Class survey','船级检验')}</h3><p class="note ${lf<0?'neg':''}">${lf<0?L('Klas askıda: '+svName(s.svK)+' '+(-lf)+' gün gecikti. Gemi yük alamaz, kiralanamaz.','Class suspended: the '+svName(s.svK)+' is '+(-lf)+' '+pl(-lf,'day','days')+' overdue. The ship can’t load cargo or go on charter.','船级暂停：'+svName(s.svK)+'已逾期'+(-lf)+'天。船舶不能装货，也不能出租。'):L(svName(s.svK)+' '+lf+' gün içinde yapılmalı. Kaçırılırsa klas askıya alınır.','The '+svName(s.svK)+' must be done within '+lf+' '+pl(lf,'day','days')+'. If missed, class is suspended.',svName(s.svK)+'须在'+lf+'天内完成，否则船级将被暂停。')} ${s.svK==='ozel'?L('Özel sörvey havuzlamayı da kapsar; gemi bu yaşta çıkabileceği en iyi duruma gelir.','The special survey includes drydocking; the ship comes out in the best condition possible at its age.','特别检验包括进坞；船舶将恢复到这个船龄可达到的最佳状态。'):''}</p>
 ${f?(s.state==='idle'?`<button type="button" class="btn sm pri" data-a="svy" data-id="${s.id}">${L('Sörveyi yaptır','Do the survey','进行检验')}<small>${USD(f.cost)} · ${DAYS(f.days)}${f.steel?L(' · sac yenileme dahil',' · incl. steel renewal',' · 含换板'):''}</small></button>`:`<p class="note">${L('Sörvey için geminin limanda emir bekliyor olması gerekir.','For the survey the ship must be waiting for orders in port.','检验时船舶须在港待命。')}</p>`):`<p class="note">${L('Bu limanda tersane yok. Tersaneli limanlar: ','There is no shipyard in this port. Ports with shipyards: ','该港口没有船厂。有船厂的港口：')}${LJ(PORTS.filter(p=>p.yard).map(p=>p.n))}${L('.','.','。')}</p>`}</div>`;}

/* ---------- personel ---------- */
function crewMeta(p){if(p.age===undefined)personInit(p);const yrs=p.since!==undefined?Math.floor((S.day-p.since)/365):0;
 return L(Math.floor(p.age)+' yaş',Math.floor(p.age)+' yrs old',Math.floor(p.age)+'岁')+(yrs?' · '+L(yrs+' yıldır gemide',yrs+' '+pl(yrs,'yr','yrs')+' aboard','在船'+yrs+'年'):'')+' · '+L('sadakat %'+Math.round(p.loy),'loyalty '+Math.round(p.loy)+'%','忠诚度'+Math.round(p.loy)+'%')+(p.leave?' · '+L('limanda ayrılacak','leaving at the next port','将在下一个港口离船'):'')+(p.promoTo?' · '+L('limanda terfi edecek','promotion at the next port','将在下一个港口晋升'):'');}

/* ---------- rakipler ---------- */
function vRivals(){const me={n:S.name,v:netWorth(),sh:S.ships.length,rep:S.rep,me:1,c:'var(--mag)',tr:0},A=S.riv.filter(r=>r.st!=='gone').concat([me]).sort((a,b)=>b.v-a.v),gone=S.riv.filter(r=>r.st==='gone');
 const st=r=>r.me?L('sen','you','你'):r.st==='ok'?'':`<em class="neg">${L('zor durumda','in trouble','陷入困境')}</em>`;
 let h=`<p class="note">${L('Sıralama şirket değerine göre: filo değeri artı nakit, eksi borç. Rakipler de büyür, zorlanır ve bazen batar. Zor durumdaki bir rakip şirketini sana satmayı teklif edebilir.','Ranked by company value: fleet value plus cash, minus debt. Rivals grow, struggle and sometimes go under. A rival in trouble may offer to sell you its company.','按公司价值排名：船队价值加现金减债务。对手也会成长、陷入困境，有时还会倒闭。陷入困境的对手可能会提出把公司卖给你。')}</p><div class="card"><div class="tbl">`;
 h+=A.map((r,i)=>`<div class="prow rv${r.me?' me':''}"><span class="pn"><i class="rk">${i+1}</i><i class="dot" style="background:${r.c}"></i>${esc(r.n)}<small>${L(r.sh+' gemi',r.sh+' '+pl(r.sh,'ship','ships'),r.sh+'艘船')} · ${L('itibar ','reputation ','声誉')}${Math.round(r.rep)}${st(r)?' · '+st(r):''}</small></span><span class="pm ${r.tr>0.001?'pos':r.tr<-0.001?'neg':''}">${r.me?'':(r.tr>0.001?'▲':r.tr<-0.001?'▼':'•')}</span><span class="num">${MUSD(r.v)}</span></div>`).join('')+`</div></div>`;
 if(S.pw&&S.pw.until>S.day){const r=riv(S.pw.rid),dl=Math.ceil(S.pw.until-S.day);h+=`<div class="card"><h3 class="h">${L('Navlun savaşı','Freight war','运费战')} · ${CNAME[S.pw.c]}</h3><p class="note">${S.pw.mode===0?L(CNAME[S.pw.c]+' limanlarında '+(r?r.n+' ile ':'')+'fiyat kırıyorsun: bu ülkeye ve bu ülkeden navlunlar %10 düşük.','You are cutting prices'+(r?' against '+r.n:'')+' in '+CNAME[S.pw.c]+'’s ports: freight to and from this country is 10% lower.','你正在'+CNAME[S.pw.c]+'港口'+(r?'与'+r.n:'')+'打价格战：往返该国的运费降低10%。'):L(CNAME[S.pw.c]+' limanlarından çekildin: orada daha az yük var.','You have pulled out of '+CNAME[S.pw.c]+'’s ports: there are fewer cargoes there.','你已退出'+CNAME[S.pw.c]+'港口：那里的货源变少。')} ${L(dl+' gün kaldı.',dl+' '+pl(dl,'day','days')+' left.','还剩'+dl+'天。')}</p></div>`;}
 if(S.rnews.length)h+=`<div class="card"><h3 class="h">${L('Sektör haberleri','Industry news','行业新闻')}</h3><ul class="log">${S.rnews.map(n=>`<li><time>${fmtDate(n.d)}</time>${esc(tx(n.t))}</li>`).join('')}</ul></div>`;
 if(gone.length)h+=`<p class="note">${L('Piyasadan çekilenler: ','Gone from the market: ','已退出市场：')}${LJ(gone.map(r=>esc(r.n)))}${L('.','.','。')}</p>`;
 return h;}

 <p class="note">${L('Telefon kendiliğinden yan dönerse oyun her zaman yatay düzene geçer. Haritadaki döndürme düğmesiyle iki düzen arasında hızlıca geçebilirsin.','If the phone rotates by itself, the game always switches to landscape. Use the rotate button on the map to switch quickly between the two layouts.','如果手机自动旋转，游戏会自动切换到横屏。可以用地图上的旋转按钮在两种布局间快速切换。')}</p>
 ${fsCan()?`<button type="button" class="btn sm" data-a="fs">${fsOn()?L('Tam ekrandan çık','Exit full screen','退出全屏'):L('Tam ekran','Full screen','全屏')}</button>`:''}</div>`;

function scrapBtn(s){if(s.state!=='idle'||s.cargo)return '';if(SCRAP[s.port])return `<button type="button" class="btn sm" data-a="scrap" data-id="${s.id}">${L('Hurdaya sat','Sell for scrap','作为废钢出售')}<small>${N(ldt(s))} LDT · ${MUSD(scrapVal(s,s.port))}</small></button>`;return '';}
function scrapNote(s){if(SCRAP[s.port])return '';const best=Object.keys(SCRAP).sort((a,b)=>SCRAP[b]-SCRAP[a]);return `<p class="note">${L('Hurda: ','Scrap: ','拆船：')}${LJ(Object.keys(SCRAP).map(p=>PORT[p].n))} · ${L('yaklaşık ','about ','约')}${MUSD(scrapVal(s,'IZM'))}–${MUSD(scrapVal(s,best[0]))} · ${L('çelik ','steel ','钢价')}$${Math.round(S.steel)}${L('/LDT','/LDT','/轻吨')}</p>`;}

function wxCard(){const A=S.wx.filter(w=>wxPower(w)>0.2),mon=monsoon(S.day),st=PORTS.filter(p=>S.strike[p.id]>S.day);if(!A.length&&!mon&&!st.length)return '';
 const where=w=>{const P=PORTS.slice().sort((a,b)=>Math.hypot(a.lon-w.lon,a.lat-w.lat)-Math.hypot(b.lon-w.lon,b.lat-w.lat))[0];return L(P.n+' açıkları','off '+P.n,P.n+'附近海域');};
 return `<div class="card"><h3 class="h">${L('Hava ve limanlar','Weather and ports','天气与港口')}</h3>${A.map(w=>kv(wxName(w),where(w)+' · '+(wxPower(w)>0.7?L('şiddetli','severe','强烈'):L('orta','moderate','中等')),wxPower(w)>0.7?'neg':'wrn')).join('')}${mon?kv(wxName({k:'mon'}),L('Arap Denizi ve Bengal Körfezi','Arabian Sea and Bay of Bengal','阿拉伯海和孟加拉湾'),'wrn'):''}${st.map(p=>kv(p.n,L('grev · '+Math.ceil(S.strike[p.id]-S.day)+' gün','strike · '+Math.ceil(S.strike[p.id]-S.day)+' days','罢工 · '+Math.ceil(S.strike[p.id]-S.day)+'天'),'neg')).join('')}
 <p class="note">${L('Fırtınadaki gemi yavaşlar ve yıpranır; çok sert havada limanda yükleme durur. Mevsimler: Atlantik’te haziran–kasım kasırga, Pasifik’te temmuz–ekim tayfun, Kuzey Atlantik’te kışın fırtına, Ege’de kışın poyraz, Hint Okyanusu’nda yazın muson.','A ship in a storm slows down and wears out; in very bad weather, cargo work in port stops. Seasons: Atlantic hurricanes June–November, Pacific typhoons July–October, North Atlantic winter storms, winter poyraz gales in the Aegean, and the summer monsoon in the Indian Ocean.','处于风暴中的船舶会减速并加剧磨损；天气极端恶劣时，港口装卸会停止。季节：大西洋6–11月有飓风，太平洋7–10月有台风，北大西洋冬季多风暴，爱琴海冬季刮东北大风，印度洋夏季有季风。')}</p></div>`;}
function drawWx(cx,t,z){if(!S||!S.wx)return;cx.save();
 if(monsoon(S.day))for(const m of MONZ){const x=sx(m.lon),y=sy(m.lat),R=m.r*z;cx.globalAlpha=0.12;cx.fillStyle=TH.warn;cx.beginPath();cx.ellipse(x,y,R*KX,R,0,0,7);cx.fill();cx.globalAlpha=0.5;cx.strokeStyle=TH.warn;cx.setLineDash([4,5]);cx.lineWidth=1;cx.stroke();cx.setLineDash([]);}
 for(const w of S.wx){const pw=wxPower(w);if(pw<0.12)continue;const x=sx(w.lon),y=sy(w.lat),R=w.r*z;if(x<-R*2||x>CW+R*2||y<-R*2||y>CH+R*2)continue;
  const g=cx.createRadialGradient(x,y,0,x,y,R);g.addColorStop(0,'rgba(200,60,60,'+(0.35*pw)+')');g.addColorStop(1,'rgba(200,60,60,0)');cx.globalAlpha=1;cx.fillStyle=g;cx.beginPath();cx.ellipse(x,y,R*KX,R,0,0,7);cx.fill();
  cx.strokeStyle=TH.bad;cx.lineWidth=1.4;cx.globalAlpha=0.5+0.4*pw;const rot=(w.k==='typ'||w.k==='hur'||w.k==='cyc'?-1:1)*t*0.6;
  for(let a=0;a<3;a++){cx.beginPath();for(let k=0;k<=16;k++){const f=k/16,ang=rot+a*2.094+f*2.4,rr=R*0.12+f*R*0.55;const px=x+Math.cos(ang)*rr*KX,py=y+Math.sin(ang)*rr;k?cx.lineTo(px,py):cx.moveTo(px,py);}cx.stroke();}
  if(z>=1.6){cx.globalAlpha=1;cx.font='600 11px '+FD;cx.textAlign='center';cx.lineWidth=3;cx.strokeStyle=TH.sea;const nm=wxName(w);cx.strokeText(nm,x,y+R*0.75+10);cx.fillStyle=TH.bad;cx.fillText(nm,x,y+R*0.75+10);cx.textAlign='left';}}
 cx.restore();}

 const st=TUT[S.tut];if(!st){tutEnd(true);return;}if(st.done&&st.done()){S.tut++;tutEnter();return;}
 const blocked=!$('#modal').hidden||!$('#rot').hidden;box.hidden=blocked;if(blocked)return;

 if(el&&box.dataset.s!==key){box.dataset.s=key;tutScroll(el);}

function impulse(c,sec,dec){const n=Math.floor(c.sampleRate*sec),b=c.createBuffer(2,n,c.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,dec);}return b;}
function auInit(oc){if(AU.ctx&&!oc)return true;const C=window.AudioContext||window.webkitAudioContext;if(!C&&!oc)return false;
 try{if(navigator.audioSession)navigator.audioSession.type='ambient';}catch(e){}
 let c;try{c=AU.ctx=oc||new C();}catch(e){return false;}
 const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=3;comp.connect(c.destination);
 AU.mg=c.createGain();AU.mg.gain.value=0;AU.mg.connect(comp);
 AU.mus=c.createGain();AU.mus.gain.value=0;AU.mus.connect(AU.mg);AU.sea=c.createGain();AU.sea.gain.value=0;AU.sea.connect(AU.mg);

function seaInit(){const c=AU.ctx,L=c.sampleRate*8,N=c.sampleRate,b=c.createBuffer(2,L,c.sampleRate);
 for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch),x=new Float32Array(L+N);let b0=0,b1=0,b2=0;for(let i=0;i<L+N;i++){const w=Math.random()*2-1;b0=0.99765*b0+w*0.099046;b1=0.963*b1+w*0.2965164;b2=0.57*b2+w*1.0526913;x[i]=(b0+b1+b2+w*0.1848)*0.16;}
  for(let i=0;i<L;i++)d[i]=i<N?x[i]*(i/N)+x[L+i]*(1-i/N):x[i];}
 const lay=(type,f,q,base,depth,rate,ph)=>{const s=c.createBufferSource();s.buffer=b;s.loop=true;s.loopEnd=8;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=c.createGain();g.gain.value=base;

function nearIdx(m){let b=0;for(let i=0;i<SCALE.length;i++)if(Math.abs(SCALE[i]-m)<Math.abs(SCALE[b]-m))b=i;return b;}
function motif(chord){const r=RHY[Math.floor(Math.random()*RHY.length)],out=[];let pc=chord[Math.floor(Math.random()*3)];let i=nearIdx(pc+(pc<5?12:0));for(const b of r){out.push([b,i]);i=clamp(i+[-2,-1,-1,1,1,2][Math.floor(Math.random()*6)],1,SCALE.length-2);}return out;}

 [['Büyümek','Growing','发展'],['Gemi almak için para yetmez: o sınıfın ruhsatı ve ofiste yer gerekir. Ofisin yönetebileceği gemi sayısı binaya bağlıdır.','Money alone won’t buy a ship: you need the licence for that class and room in your office. The number of ships your office can manage depends on the building.','光有钱买不了船：还需要该船型的执照和办公室的管理容量。办公室能管理的船舶数量取决于办公楼。']],
 [['Personel','Crew','船员'],['Yıldız sayısı beceriyi gösterir. Kaptan hızı ve denetimleri, çarkçıbaşı arızaları ve yakıtı, 2. kaptan yükleme süresini ve yük hasarını, 2. çarkçı gemide tamiri, aşçı morali etkiler. Personel denizde geçen günlerle tecrübe kazanır.','Stars show skill. The captain affects speed and inspections, the chief engineer breakdowns and fuel, the chief officer loading time and cargo damage, the second engineer repairs on board, and the cook morale. Crew gain experience with days at sea.','星级代表能力。船长影响航速和检查，轮机长影响故障和油耗，大副影响装卸时间和货损，大管轮影响船上修理，厨师影响士气。船员会随着海上天数积累经验。']],
 [['Denetim','Inspections','检查'],['Limanların denetim sıkılığı farklıdır. Durumu kötü gemi sıkı limanda tutulur ve ceza öder. Haritadaki liman rengi denetimi gösterir: yeşil gevşek, turuncu orta, kırmızı sıkı.','Ports differ in how strictly they inspect. A ship in poor condition gets detained and fined in a strict port. The port colour on the map shows the inspection level: green lax, orange moderate, red strict.','各港口的检查严格程度不同。船况差的船在严格的港口会被滞留并罚款。地图上港口的颜色表示检查力度：绿色宽松，橙色中等，红色严格。']],
 [['Geliştirmeler','Upgrades','改装'],['Gemi ekranının Geliştir bölümünden pervane, makine revizyonu, scrubber, yük donanımı gibi parçalar taktırabilir, gövdeyi boyatabilir, gemiye yeni ad verebilirsin. Çoğu tersaneli limanda yapılır ve gemi o süre çalışmaz.','In the Upgrade section of the ship screen you can fit parts such as a propeller, engine overhaul, scrubber or cargo gear, repaint the hull and rename the ship. Most of this is done at a port with a shipyard, and the ship doesn’t work in the meantime.','在船舶页面的“改装”中，可以加装螺旋桨、主机大修、脱硫塔、装卸设备等，也可以重新涂装船体、给船改名。大多需在有船厂的港口进行，期间船舶不能营运。']],
 [['Personel hikâyeleri','Crew stories','船员故事'],['Her denizcinin yaşı ve sadakati var. Sadakat denizde geçen zamanla ve iyi davranışla artar, moral düşükse azalır. Tecrübeli 2. kaptan ve 2. çarkçılar terfi ister; yaşlananlar emekli olmak ister; yıl sonunda ikramiye beklenir. Sadakati çok düşen personel limanda istifa edebilir.','Every seafarer has an age and a loyalty level. Loyalty grows with time at sea and good treatment, and falls when morale is low. Experienced chief officers and second engineers ask for promotion; older crew want to retire; a bonus is expected at the end of the year. Crew with very low loyalty may quit in port.','每名船员都有年龄和忠诚度。忠诚度随着海上时间和善待而提高，士气低落时则下降。有经验的大副和大管轮会要求晋升；年长的船员会想退休；年底大家期待年终奖。忠诚度很低的船员可能在港口辞职。']],
 [['Banka','Bank','银行'],['Şirket › Banka bölümünden işletme kredisi çekebilir, gemi pazarında gemiyi yarı peşin, yarı krediyle alabilirsin. Faiz itibarına bağlıdır. Taksitler her 30 günde bir ödenir; krediyle hızlı büyürsün ama piyasa kötüleşirse taksitler seni batırabilir.','Under Company › Bank you can take a business loan, and in the ship market you can buy a ship half cash, half mortgage. Interest depends on your reputation. Instalments are paid every 30 days; loans let you grow faster, but if the market turns, the instalments can sink you.','在“公司 › 银行”中可以借经营贷款，在船舶市场中可以一半首付、一半贷款买船。利率取决于你的声誉。每30天还款一次；贷款能让你更快扩张，但市场转坏时，还款压力可能让你破产。']],
 [['Kiralama','Chartering','租船'],['Limanda bekleyen gemiyi “Kirala” düğmesiyle 3, 6 ya da 12 aylığına bir kiracıya verebilirsin. Kiracı yakıtı ve liman masraflarını öder, sen günlük sabit kira alırsın. Kira gemi durumuna, hızına ve tecrübene göre değişir. Kiracılar bakımlı gemi ister.','Use the “Charter” button to hand an idle ship to a charterer for 3, 6 or 12 months. The charterer pays fuel and port costs, and you receive a fixed daily hire. The hire depends on the ship’s condition, speed and your experience. Charterers want well-maintained ships.','用“出租”按钮可以把在港待命的船租给租家3、6或12个月。租家承担燃油和港口费用，你收取固定日租金。租金取决于船况、航速和你的经验。租家要求船舶保养良好。']],
 [['Klas sörveyleri','Class surveys','船级检验'],['Her gemi 2,5 yılda bir ara sörvey, 5 yılda bir özel sörvey yaptırmak zorunda. Zamanı yaklaşınca uyarı gelir; sörvey tersaneli limanda yapılır. Kaçırılırsa klas askıya alınır: gemi yük alamaz, kiralanamaz ve denetimlerde tutulma riski artar. Özel sörvey havuzlamayı da kapsar.','Every ship must pass an intermediate survey every 2.5 years and a special survey every 5 years. You are warned as the date approaches; surveys are done at shipyard ports. If missed, class is suspended: the ship can’t load cargo or go on charter, and detentions become more likely. The special survey includes drydocking.','每艘船每2.5年须做一次中间检验，每5年做一次特别检验。临近到期时会有提醒；检验在有船厂的港口进行。如果错过，船级将被暂停：船舶不能装货、不能出租，被滞留的风险增加。特别检验包括进坞。']],
 [['Rakipler','Rivals','竞争对手'],['Dört rakip şirket seninle aynı denizlerde çalışır. Dünya › Rakipler bölümünde sıralamayı ve sektör haberlerini görürsün. Rakipler personelini ayartmaya çalışabilir, bir ülkede navlun savaşı açabilir, gemilerini ucuza satabilir; zor duruma düşen bir rakip şirketini sana satmayı teklif edebilir.','Four rival companies work the same seas. Under World › Rivals you see the ranking and industry news. Rivals may try to poach your crew, start a freight war in a country or sell ships cheaply; a rival in trouble may offer to sell you its company.','四家竞争对手在同一片海域经营。在“世界 › 对手”中可以看到排名和行业新闻。对手可能挖你的船员、在某国发动运费战或低价卖船；陷入困境的对手可能提出把公司卖给你。']],
 [['Gemi tipleri','Ship types','船型'],['Kuru yük ve tankerin yanında konteyner, araç taşıyıcı (Ro-Ro) ve LNG tankeri var. Her tipin kendi yükü ve limanı vardır: LNG yalnızca LNG terminalleri arasında, araçlar ve konteynerler büyük limanlarda taşınır. Tehlikeli madde (IMO) konteynerleri için gemide tehlikeli yük belgesi gerekir.','Besides dry cargo and tankers there are container ships, car carriers (Ro-Ro) and LNG carriers. Each type has its own cargo and ports: LNG moves only between LNG terminals, while cars and containers go through the big ports. Dangerous goods (IMO) containers need a dangerous goods certificate on board.','除干货船和油轮外，还有集装箱船、汽车运输船（滚装船）和LNG运输船。每种船型都有各自的货物和港口：LNG只在LNG接收站之间运输，汽车和集装箱经由大港口运输。运输危险品（IMO）集装箱需要船上持有危险品适装证书。']],
 [['Yeni inşa ve hurda','Newbuilding and scrapping','新造船与拆船'],['Pazar › Yeni inşa bölümünden tersaneye sıfır gemi sipariş edebilirsin; teslim 1–2 yıl sürer, ödeme üç taksittir. Yaşlı gemiyi Aliağa (İzmir), Alang (Mumbai) ya da Chittagong’da hurdaya satabilirsin; fiyat geminin çelik ağırlığına ve çelik fiyatına bağlıdır.','Under Market › Newbuilding you can order a brand-new ship from a yard; delivery takes 1–2 years and payment is in three instalments. Old ships can be sold for scrap at Aliaga (Izmir), Alang (Mumbai) or Chittagong; the price depends on the ship’s steel weight and the steel price.','在“市场 › 新造船”中可以向船厂订造全新的船；交期1–2年，分三期付款。旧船可以在阿利阿加（伊兹密尔）、阿朗（孟买）或吉大港作为废钢出售；价格取决于船舶的钢材重量和钢价。']],
 [['Hava ve mevsimler','Weather and seasons','天气与季节'],['Haritada fırtınalar hareket eder. Fırtınaya giren gemi yavaşlar, yıpranır ve kaptan karar ister; çok sert havada limanda yük işi durur. Kasırga, tayfun, kış fırtınası, poyraz ve muson kendi mevsiminde gelir. Sefer planı rotadaki kötü havayı gösterir.','Storms move across the map. A ship that sails into one slows down, wears out and the captain asks for a decision; in very bad weather, cargo work in port stops. Hurricanes, typhoons, winter storms, poyraz gales and the monsoon each come in their season. The voyage plan shows bad weather on the route.','风暴会在地图上移动。驶入风暴的船舶会减速、加剧磨损，船长会请你做决定；天气极端恶劣时港口装卸会停止。飓风、台风、冬季风暴、东北大风和季风各有季节。航次计划会显示航线上的恶劣天气。']],
 [['Laytime ve demuraj','Laytime and demurrage','装卸时间与滞期费'],['Her yükün yükleme ve tahliye için bir laytime süresi vardır. Limanlarda kuyruk olur, grevler kuyruğu uzatır. Gemi laytime’dan uzun kalırsa yük sahibi sana demuraj öder; erken bitirirsen ona dispeç ödersin. İyi 2. kaptan ve yük donanımı işi hızlandırır.','Every cargo comes with laytime for loading and discharge. Ports have queues, and strikes make them longer. If the ship stays longer than the laytime, the cargo owner pays you demurrage; if you finish early, you pay them despatch. A good chief officer and cargo gear speed up the work.','每批货物都有装货和卸货的装卸时间。港口会排队，罢工会让队伍更长。船舶在港超过装卸时间，货主付你滞期费；提前完成，你付货主速遣费。优秀的大副和装卸设备能加快作业。']],
 [['Karbon kuralları','Carbon rules','碳排放规则'],['Her gemi her yıl sonunda A’dan E’ye bir karbon yoğunluğu notu (CII) alır. Not geminin yakıt verimine, yaşına ve durumuna bağlıdır; kurallar her yıl sıkılaşır. A ve B notlu gemilere yük sahipleri biraz fazla öder, D ve E notlulara daha az; E notlu gemi AB limanlarına giremez. Ekonomik seyir hızı %15 düşürür ama yakıtı %38 azaltır ve notu iyileştirir. Yeni inşada LNG yakıtlı makine seçebilirsin. AB limanlarına giden ya da oradan çıkan seferlerde yakılan yakıtın karbon bedeli ödenir (iki uç AB’deyse tamamı, biri AB’deyse yarısı).','Every ship gets a carbon intensity rating (CII) from A to E at the end of each year. It depends on fuel efficiency, age and condition, and the rules tighten every year. Cargo owners pay a little more for A and B ships and less for D and E; an E-rated ship cannot enter EU ports. Slow steaming cuts speed by 15% but fuel by 38% and improves the rating. You can order an LNG-fuelled engine on a newbuilding. Voyages to or from EU ports pay a carbon charge for the fuel burned (all of it if both ends are in the EU, half if one is).','每艘船每年年底获得A到E的碳强度评级（CII）。评级取决于燃油效率、船龄和船况，规则每年收紧。货主对A、B级船舶支付略高的运费，对D、E级支付较低运费；E级船舶不得进入欧盟港口。经济航速使航速降低15%，但油耗减少38%，并改善评级。新造船可以选择LNG燃料主机。往返欧盟港口的航次需为所烧燃油支付碳排放费（两端都在欧盟则全额，一端在欧盟则一半）。']],
 [['Terminaller','Terminals','码头'],['Şirket seviyesi 3’ten sonra bir limanın sayfasından rıhtım satın alabilir, sonra terminale büyütebilirsin. Kendi terminalinde gemilerin kuyruk beklemez, liman masrafı %60 azalır, liman işleri %25 hızlanır. Başka şirketlerin gemileri de terminalini kullanır; her ay gelir getirir, grev olursa geliri düşer.','From company level 3 you can buy a berth from a port’s page and later grow it into a terminal. At your own terminal your ships skip the queue, port costs fall by 60% and cargo work is 25% faster. Other companies’ ships use it too, so it earns income every month; strikes cut that income.','公司等级达到3后，可以在港口页面购买泊位，之后扩建为码头。在自有码头，你的船无需排队，港口费用减少60%，装卸快25%。其他公司的船也会使用你的码头，每月带来收入；罢工时收入下降。']],
 [['Sözleşmeler ve kadetler','Contracts and cadets','合同与实习生'],['Denizciler 4–8 aylık sözleşmeyle çalışır. Süre dolunca havalimanı bağlantısı olan bir limanda yol masrafını ödeyip değişim yapmalısın; değişen kişi izne çıkar ve sana bağlıysa birkaç ay sonra acenteye geri döner. Süre geçtikçe moral ve sadakat düşer, 45 günden sonra denizci gemiyi terk eder. Ofis’ten kadet programını başlatırsan gemilere kadet alabilirsin; 300 gün deniz stajından sonra ucuz ve sadık 2. kaptan ya da 2. çarkçı olurlar.','Seafarers work on 4–8 month contracts. When a contract ends, change the crew member at a port with an airport and pay their travel; the one relieved goes on leave and, if loyal, comes back to the agency a few months later. Overdue contracts drain morale and loyalty, and after 45 days the seafarer walks off. Start the cadet programme in the Office to put cadets on your ships; after 300 days at sea they become cheap, loyal officers or engineers.','船员签4到8个月的合同。合同到期后，须在有机场的港口支付差旅费换班；换下的人去休假，如果忠诚，几个月后会回到中介。合同超期会降低士气和忠诚度，超过45天船员会离船。在办公室启动实习生计划后，可以让实习生上船；海上实习300天后，他们会成为便宜又忠诚的驾驶员或轮机员。']],
 [['Riskli bölgeler','High-risk areas','高风险海域'],['Güney Kızıldeniz, Aden Körfezi, Gine Körfezi, Hürmüz ve Kuzey Karadeniz’in risk seviyeleri zamanla değişir; Dünya › Gündem’de görünür ve haritada işaretlidir. Ofis’ten şirket politikasını seçersin: savaş riski sigortası bölgeye girerken prim alır ve zararın çoğunu karşılar; silahlı koruma korsan saldırılarının çoğunu önler; Kızıldeniz’den kaçınırsan gemiler Ümit Burnu’ndan dolaşır. Denizde imdat çağrısı alırsan yardıma gitmek zaman kaybettirir ama ödül ve itibar getirir. Ağır bir kazada müşterek avarya ilan edersen masrafı yük sahipleriyle paylaşırsın.','The risk levels of the southern Red Sea, the Gulf of Aden, the Gulf of Guinea, Hormuz and the northern Black Sea change over time; they are shown under World › Agenda and marked on the map. You set company policy in the Office: war-risk insurance charges a premium on entry and covers most of the damage; armed guards stop most pirate attacks; avoiding the Red Sea sends ships round the Cape of Good Hope. If you receive a distress call at sea, helping costs time but brings a reward and reputation. After a serious casualty you can declare general average and share the cost with the cargo owners.','红海南部、亚丁湾、几内亚湾、霍尔木兹和黑海北部的风险等级会随时间变化；可在 世界 › 时事 中查看，地图上也有标示。你在办公室设定公司政策：战争险在进入时收取保费并赔付大部分损失；武装护卫可阻止大部分海盗袭击；避开红海则船舶绕行好望角。海上收到求救信号时，前往救援会耽误时间，但能获得报酬和声誉。发生严重事故后，可以宣布共同海损，与货主分担费用。']],
 [['Deniz hukuku','Maritime law','海事法'],['Deniz kurallarına aykırı davranırsan şirketine dava açılır: denize yağlı su basmak (MARPOL), imdat çağrısına uymamak (SOLAS), sözleşmesi dolan denizciyi tutmak. Yük hasarı, trafik ayırım düzenlerinde çatışma ve rıhtım kazaları da mahkemeye gidebilir; kiracı demurajı ödemezse sen dava açarsın. Her davada uzlaşabilir ya da mahkemeye gidebilirsin. Ofis’e hukuk müşaviri alırsan kazanma şansını görürsün, şansın artar, uzlaşma ve avukatlık masrafı azalır. Davası süren gemi limanda tutuklanabilir; teminat yatırınca serbest kalır.','Breaking the rules of the sea gets your company sued: pumping oily water overboard (MARPOL), ignoring a distress call (SOLAS), keeping seafarers past their contract. Cargo damage, collisions in traffic separation schemes and quay accidents can also go to court; if a charterer won’t pay demurrage, you sue them. In every case you can settle or go to court. With a legal counsel in the Office you see your chances, they improve, and settlements and legal fees are lower. A ship with a pending case can be arrested in port; posting security releases her.','违反海上规则会让公司被起诉：向海里排放含油污水（MARPOL）、不响应求救（SOLAS）、让合同到期的船员继续工作。货损、分道通航区内的碰撞和码头事故也可能闹上法庭；租船人不付滞期费时，你可以起诉对方。每个案件都可以和解或打官司。办公室有法律顾问时，你能看到胜算，胜算更高，和解金额和律师费也更低。有未决案件的船可能在港口被扣押；提供担保即可放行。']],
 [['Görevler ve ipuçları','Missions and tips','任务与提示'],['Şirket sekmesindeki görevler oyunu adım adım öğretir ve her biri ödül verir; Filo sekmesinin üstünde sıradaki görev görünür. Bir şeyle ilk kez karşılaştığında haritanın altında kısa bir ipucu çıkar. İkisini de Ayarlar’dan kapatabilir, ipuçlarını sıfırlayabilirsin. Filo müdürleri 15 teslimattan sonra açılır; o zamana kadar yükü kendin seçerek işi öğrenirsin.','Missions in the Company tab teach the game step by step and each pays a reward; the next one is shown at the top of the Fleet tab. The first time you meet something new, a short tip appears below the map. You can turn both off in Settings and reset the tips. Fleet managers unlock after 15 deliveries; until then you learn the trade by choosing cargoes yourself.','公司页面的任务会一步步教你玩法，每个都有奖励；下一个任务显示在船队页面顶部。第一次遇到新情况时，地图下方会出现简短提示。两者都可以在设置中关闭，提示也可以重置。完成15次交货后才能任命船队经理；在那之前，你要自己选货来学习这一行。']],
 [['Zaman','Time','时间'],['Sen yönettiğin bir gemi emir bekliyorsa oyun durur ve uyarır. Haritanın sol altındaki düğme bekleyen gemiye götürür.','When a ship you manage awaits orders, the game pauses and warns you. The button at the bottom left of the map takes you to the waiting ship.','你管理的船等待指令时，游戏会暂停并提醒你。地图左下角的按钮会带你到等待中的船。']],
 [['Otomasyon','Automation','自动化'],['15 teslimattan sonra bir filoya müdür atayabilirsin; o filonun gemilerine yükü o bulur. İyi müdür kârlı iş bağlar, kötüsü zarar ettirir. Makine enspektörü bakım zamanı gelince sorar.','After 15 deliveries you can appoint a manager to a fleet, and they find cargo for its ships. A good manager makes profitable deals, a bad one loses money. The technical superintendent asks you when maintenance is due.','完成15次交货后可以为船队任命经理，经理会为船队的船寻找货源。好的经理能谈成赚钱的生意，差的会让你亏钱。机务主管会在需要维修时征求你的意见。']],
 [['Ülkeler','Countries','国家'],['İlişki iyiyse o ülkenin limanlarında navlun artar, masraf ve denetim azalır; çok kötüyse limanlar kapanır. Gündem olayları kurgusaldır.','Good relations mean higher freight, lower costs and fewer inspections in that country’s ports; very bad relations close them. Agenda events are fictional.','关系好时，该国港口运费更高、费用和检查更少；关系很差时港口会关闭。时事事件均为虚构。']]];
function vHelp(){return `<div class="card help">${HELP.map(x=>`<h3 class="h">${tx(x[0])}</h3><p>${tx(x[1])}</p>`).join('')}</div>`;}
const SHEET={cad:vCad,nbo:vNBOrder,tc:vTC,ship:vShip,crew:vCrew,offers:vOffers,ballast:vBallast,trip:vTrip,port:vPort,buy:vBuy,sell:vSell,asknew:vAskNew,help:vHelp,staff:vStaff,emp:vEmp,country:vCountry};

function appH(W,H){if(!PWA||!window.screen)return H;const sw=Math.min(screen.width,screen.height),sh=Math.max(screen.width,screen.height);if(Math.abs(W-sw)<=2&&H<sh)return sh;if(Math.abs(W-sh)<=2&&H<sw)return sw;return H;}

document.addEventListener('touchstart',e=>{if(!ROT||e.touches.length!==1){TS=null;return;}const el=e.target.closest&&e.target.closest('.scr');if(!el){TS=null;return;}cancelAnimationFrame(INR);const t=e.touches[0];TS={el,x:t.clientX,y:t.clientY,st:el.scrollTop,moved:0,v:0,lx:t.clientX,lt:performance.now()};},{passive:true});

 if(TS.moved>6){TS.el.scrollTop=TS.st-(TS.x-t.clientX);const dt=Math.max(1,now-TS.lt);TS.v=0.7*TS.v+0.3*((TS.lx-t.clientX)/dt);TS.lx=t.clientX;TS.lt=now;}},{passive:false});
document.addEventListener('touchend',()=>{if(!ROT||!TS)return;const T=TS;TS=null;if(T.moved<=6)return;SUP=performance.now();if(performance.now()-T.lt>80)return;let v=T.v,last=performance.now();
 const step=now=>{const dt=now-last;last=now;v*=Math.pow(0.996,dt);if(Math.abs(v)<0.03)return;T.el.scrollTop-=v*dt;INR=requestAnimationFrame(step);};if(Math.abs(v)>0.08)INR=requestAnimationFrame(step);},{passive:true});

 crewPol(d){const f=S.fleet[d.k];f.crew=f.crew==='best'?'cheap':'best';save();R();},
 hqUp(){upgradeHQ();R();},
 wtab(d){ui.wtab=d.v;$('#panel').scrollTop=0;R();},
 country(d){ui.pc=false;ui.sheet.push({t:'country',c:d.c});R();},
 heyet(d){sendHeyet(d.c);save();R();},
 boy(d){S.boy[d.c]=S.boy[d.c]?0:1;save();R();},
 evAuto(){ui.evAuto=!ui.evAuto;R();},
 autoReset(d){delete S.auto[d.k];save();R();},
 speed(d){setSpeed(+d.v);},zin(){zoomAt(CW/2,CH/2,view.z*1.6);},zout(){zoomAt(CW/2,CH/2,view.z/1.6);},
 ship(d){openShip(+d.id);},port(d){openPort(d.p);const P=PORT[d.p];requestAnimationFrame(()=>{resizeMap();focusOn(P.lon,P.lat,7);});},
 back(){ui.sheet.pop();R();},close(){ui.sheet=[];ui.sel=null;R();},
 stab(d){const t=ui.sheet[ui.sheet.length-1];if(t&&t.t==='ship'){t.tab=d.v;R();}},
 crew(d){ui.sheet.push({t:'crew',id:+d.id,r:d.r});R();},
 hire(d){if(hire(ship(+d.id),d.r,+d.p))ui.sheet.pop();R();},
 fire(d){fire(ship(+d.id),d.r);R();},
 auto(d){autoCrew(ship(+d.id),d.m);R();},
 fuel(d){const s=ship(+d.id);buyFuel(s,d.q==='full'?s.fuelCap:s.fuelCap*0.25);R();},
 prov(d){buyProv(ship(+d.id),+d.q);R();},
 repair(d){const s=ship(+d.id);doRepair(s,d.k==='dock');if(s.state==='maint'){ui.sheet=[{t:'ship',id:s.id}];afterOrder();}R();},
 upg(d){const s=ship(+d.id);if(doUpg(s,d.k)){toast(L(s.name+': '+UPG[d.k].n+' işi başladı',s.name+': '+UPG[d.k].n+' work started',s.name+'：'+UPG[d.k].n+'工程开始'),s.id,'ok');afterOrder();}R();},
 paint(d){const s=ship(+d.id);if(doPaint(s,+d.c)){toast(L(s.name+' boyaya girdi',s.name+' is being painted',s.name+'开始涂装'),s.id,'ok');afterOrder();}R();},
 ack(d){const s=ship(+d.id);s.ack=!s.ack;save();R();},
 offers(d){ui.sheet.push({t:'offers',id:+d.id});R();},
 ballast(d){ui.sheet.push({t:'ballast',id:+d.id});R();},
 trip(d){ui.sheet.push({t:'trip',id:+d.id,to:d.to,o:d.o?+d.o:0});R();},
 toCrew(d){ui.sheet=[{t:'ship',id:+d.id,tab:'personel'}];R();},
 go(d){const s=ship(+d.id);if(depart(s,d.to,d.o?+d.o:0,d.top==='1')){ui.sheet=[{t:'ship',id:s.id}];ui.sel=s.id;afterOrder();}R();},
 buy(d){ui.pc=false;ui.sheet.push({t:'buy',id:+d.id});R();},
 tutNext(){tutNext();},tutSkip(){tutEnd(false);},tutGo(){ui.sheet=[];ui.tab='fleet';tutStart();},
 mtabGo(){ui.tab='market';ui.mtab='nb';ui.sheet=[];R();},
 mtab(d){ui.mtab=d.v;$('#panel').scrollTop=0;R();},
 nbPick(d){ui.pc=false;ui.sheet.push({t:'nbo',y:d.y,c:d.c,o:{eco:0,scr:0,imo:0}});R();},
 nbOpt(d){const t=ui.sheet[ui.sheet.length-1],el=$('#nbName');if(!t)return;if(el)t.nm=el.value;t.o[d.k]=t.o[d.k]?0:1;R();},
 nbGo(){const t=ui.sheet[ui.sheet.length-1],el=$('#nbName');if(!t)return;if(nbOrder(t.y,t.c,t.o,el?el.value:'')){ui.sheet=[];ui.tab='market';ui.mtab='nb';}R();},
 nbCancel(d){nbCancel(+d.id);R();},
 scrap(d){scrapShip(+d.id);ui.sheet=[];ui.sel=null;R();},
 tcList(d){ui.sheet.push({t:'tc',id:+d.id});R();},
 tcFix(d){if(tcFix(+d.id,+d.o)){ui.sheet=[{t:'ship',id:+d.id}];afterOrder();}R();},
 borrow(d){borrow(+d.f);R();},repay(d){repayLoan(+d.id);R();},
 svy(d){const s=ship(+d.id);if(doSurvey(s)){ui.sheet=[{t:'ship',id:s.id}];afterOrder();}R();},
 buyLoan(d){const s=buyShipLoan(+d.id);if(s){ui.tab='fleet';ui.sheet=[{t:'ship',id:s.id,tab:'personel'}];ui.sel=s.id;const P=PORT[s.port];focusOn(P.lon,P.lat,9,true);}R();},
 buyok(d){const s=buyShip(+d.id);if(s){ui.tab='fleet';ui.sheet=[{t:'ship',id:s.id,tab:'personel'}];ui.sel=s.id;const P=PORT[s.port];focusOn(P.lon,P.lat,9,true);}R();},
 sell(d){ui.sheet.push({t:'sell',id:+d.id});R();},sellok(d){sellShip(+d.id);ui.sheet=[];ui.sel=null;R();},
 ev(d){const ev=S.ev[0];if(ev&&ui.evAuto&&ev.k!=='pol'&&ev.k!=='over')S.auto[ev.k]=+d.i;ui.evAuto=false;resolveEv(+d.i);R();},
 askShip(d){ui.ask=null;openShip(+d.id);},askGo(){const v=ui.ask?ui.ask.v:1;idleList().forEach(s=>s.ack=true);ui.ask=null;S.lastSpd=v;S.speed=v;save();R();},askClose(){ui.ask=null;R();},
 askQuick(){const v=ui.ask?ui.ask.v:1;ACT.quickAll();if(!idleList().length){ui.ask=null;S.lastSpd=v;S.speed=v;}R();},
 nextIdle(){const A=S.ships.filter(s=>s.state==='idle'&&!managed(s));if(!A.length)return;const i=A.findIndex(s=>s.id===ui.sel);openShip(A[(i+1)%A.length].id);},
 opt(){S.opt.autoPause=!S.opt.autoPause;save();R();},
 help(){ui.pc=false;ui.sheet.push({t:'help'});R();},askNew(){ui.sheet.push({t:'asknew'});R();},
 newgame(){clearSave();S=null;ui.sheet=[];ui.sel=null;showIntro();}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;if(!S&&a!=='ori'&&a!=='lang'&&a!=='theme')return;const f=ACT[a];if(f){f(el.dataset,el);if(S&&S.done&&!['tab','back','close','ptog','speed','zin','zout','ship','port','stab','tipOk','tipGo','msnHow','msnGo','msnAll'].includes(a))msnAct(a);}});
document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset||f.dataset.f!=='rename')return;e.preventDefault();const s=ship(+f.dataset.id);if(s&&renameShip(s,f.elements.nm.value)){toast(L('Yeni ad: ','New name: ','新船名：')+s.name,s.id,'ok');}R();});
document.addEventListener('pointerdown',()=>{ui.ptr=performance.now();},true);
const ptrOff=()=>{ui.ptr=0;};document.addEventListener('pointerup',ptrOff,true);document.addEventListener('pointercancel',ptrOff,true);
document.addEventListener('keydown',e=>{if(!S||ui.intro||/INPUT|TEXTAREA/.test(e.target.tagName))return;
 if(e.code==='Space'&&!S.ev.length&&e.target.tagName!=='BUTTON'){e.preventDefault();setSpeed(S.speed?0:(S.lastSpd||1));}
 else if(/^Digit[1-7]$/.test(e.code)&&!S.ev.length){ACT.tab({t:['fleet','market','xp','office','world','co','set'][+e.code.slice(5)-1]});}
 else if(e.code==='Escape'){if(ui.sheet.length){ui.sheet.pop();R();}}});
window.addEventListener('resize',applyOri);window.addEventListener('orientationchange',()=>setTimeout(applyOri,120));

/* ---------- döngü ---------- */
let lastT=performance.now(),liveT=0,thT=9;
function frame(now){const dt=Math.min(0.1,(now-lastT)/1000);lastT=now;
 if(S&&!S.over&&S.speed>0&&!S.ev.length&&!ui.intro){let d=dt*SPD[S.speed];while(d>1e-6&&S&&S.speed>0&&!S.ev.length){const st=Math.min(d,0.2);tick(st);d-=st;}}
 thT+=dt;if(thT>1.5){thT=0;readTheme();const top=ui.sheet[ui.sheet.length-1];if(S&&top&&top.t==='ship'&&!ptrs.size){const fs=ship(top.id);if(fs&&fs.state==='sea'){const fp=shipPos(fs);focusOn(fp.lon,fp.lat,0);}}const el=cv.parentElement;if(Math.abs(el.clientWidth-CW)>1||Math.abs(el.clientHeight-CH)>1)resizeMap();}
 if(S&&ui.tab==='co'&&!ui.sheet.length){ui.coT+=dt;if(ui.coT>1.5&&S.speed>0){ui.coT=0;ui.dirty=true;}}
 if(ui.dirty&&(!ui.ptr||now-ui.ptr>2500)){ui.dirty=false;renderAll();}
 liveT+=dt;if(liveT>0.2){liveT=0;updateLive();}
 drawMap(now);requestAnimationFrame(frame);}
function boot(data){
 applyTheme();setLangIdx(LANGS.indexOf(detectLang()));applyStatic();renderRot();
 if(data&&data.v===1&&Array.isArray(data.ships))S=data;else S=loadSave();
 const old=!!S&&S.hq===undefined,oldP=!!S&&S.xp===undefined;if(S)initCorp();applyOri();readTheme();resizeMap();
 if(S){S.speed=0;S.ev=S.ev||[];if(S.lastSpd>2)S.lastSpd=2;
  if(old&&!S.over)S.ev.push(evText({k:'info',title:()=>L('Yenilikler: otomasyon, ofis ve dünya','What’s new: automation, office and world','新内容：自动化、办公室和世界'),body:()=>L('Filo sekmesinde gemiler filolara ayrılıyor ve bekleyen gemiyi tek dokunuşla sefere çıkarabiliyorsun. Ofis sekmesinden filo müdürü ve makine enspektörü atayabilirsin. Dünya sekmesinde ülkelerle ilişkilerini ve gündemi görürsün.','Ships are now grouped into fleets in the Fleet tab, and you can dispatch a waiting ship with one tap. In the Office tab you can appoint fleet managers and a technical superintendent. The World tab shows your relations with countries and the agenda.','船队页面中的船舶现在按船队分组，等待中的船一键即可派出。在办公室页面可以任命船队经理和机务主管。世界页面显示你与各国的关系和时事。'),opts:[{l:OK3}]}));
  if(oldP&&!S.over)S.ev.push(evText({k:'info',title:()=>L('Yenilikler: tecrübe, ruhsat ve geliştirmeler','What’s new: experience, licences and upgrades','新内容：经验、执照和改装'),body:()=>L('Artık her gemi sınıfında ayrı tecrüben var. Yeni gemi almak için o sınıfın ruhsatı ve ofiste yer gerekiyor; büyük limanlar şirket seviyesiyle açılıyor. Şimdiye kadarki seferlerin tecrübe olarak sayıldı ve sahip olduğun gemilerin ruhsatları verildi. Gemi ekranındaki Geliştir bölümünden gemilerine yeni donanım taktırabilirsin.','You now have separate experience for each ship class. Buying a new ship needs that class’s licence and room in your office; big ports open with the company level. Your voyages so far count as experience, and you hold licences for the ships you own. Use the Upgrade section of the ship screen to fit new equipment.','现在每种船型都有各自的经验。购买新船需要该船型的执照和办公室容量；大港口随公司等级开放。你之前的航次已计入经验，并已获得所拥有船舶的执照。可以在船舶页面的“改装”中为船加装新设备。'),opts:[{l:OK3}]}));
  if(S.ships.length){const p=shipPos(S.ships[0]);focusOn(p.lon,p.lat,7,true);}R();}else showIntro();
 requestAnimationFrame(frame);}
if('serviceWorker' in navigator&&(location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname))&&document.querySelector('link[rel=manifest]'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
document.addEventListener('fullscreenchange',()=>setTimeout(applyOri,200));
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>S&&!ui.intro?JSON.parse(JSON.stringify(S)):{});}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);else boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});


</script>
</body>
