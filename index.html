<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="screen-orientation" content="landscape">
<title>Armatör · Denizcilik Şirketi Oyunu</title>
<meta name="description" content="Eski bir kosterle başla, dünya limanları arasında yük taşı, tecrübe kazan ve denizcilik şirketini büyüt. A browser shipping-company game in Turkish, English and Chinese · 土耳其语、英语、中文航运公司经营游戏。">
<meta name="theme-color" content="#0a141d">
<meta property="og:title" content="Armatör · Denizcilik Şirketi Oyunu">
<meta property="og:description" content="Eski bir kosterle başla, limanlar arasında yük taşı, filonu büyüt. Start with an old coaster and grow a shipping company. Türkçe · English · 中文">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Armatör">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Köprüüstü ekranı: ECDIS gündüz paleti. Düzen: gösterge şeridi, deniz haritası, altında defter paneli. */
  --bg:#dde5e4; --panel:#edf1ee; --card:#fbfcf9; --line:#b7c4c5; --ink:#12212a; --mute:#52646d;
  --sea:#dbeaef; --shal:#b6d6e3; --land:#dcc98f; --coast:#8c7a41; --grid:rgba(18,33,42,.07);
  --foam:#ffffff; --hull:#25343d; --deck:#93a1a8; --sup:#fbfcf9; --boot:#a23a28; --rust:#9a5a2c;
  --mag:#ad1279; --onmag:#ffffff; --ok:#15754c; --warn:#9c5700; --bad:#b83022;
  --dry:#1b4d7a; --tank:#a5401a;
  --disp:"Barlow Condensed","Arial Narrow","Roboto Condensed","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#050b11; --panel:#0a141d; --card:#0f1d29; --line:#21374a; --ink:#d7e1e7; --mute:#879cab;
  --sea:#06141d; --shal:#0e2c3c; --land:#3b3a21; --coast:#77713d; --grid:rgba(215,225,231,.05);
  --foam:#a9c4d2; --hull:#5d7385; --deck:#9db0bc; --sup:#d2dde3; --boot:#b5503f; --rust:#b0703c;
  --mag:#e45fbd; --onmag:#1c0617; --ok:#4fcba6; --warn:#f0b24a; --bad:#ff8072;
  --dry:#7fb9ea; --tank:#ff9c6e; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#050b11; --panel:#0a141d; --card:#0f1d29; --line:#21374a; --ink:#d7e1e7; --mute:#879cab;
  --sea:#06141d; --shal:#0e2c3c; --land:#3b3a21; --coast:#77713d; --grid:rgba(215,225,231,.05);
  --foam:#a9c4d2; --hull:#5d7385; --deck:#9db0bc; --sup:#d2dde3; --boot:#b5503f; --rust:#b0703c;
  --mag:#e45fbd; --onmag:#1c0617; --ok:#4fcba6; --warn:#f0b24a; --bad:#ff8072;
  --dry:#7fb9ea; --tank:#ff9c6e; color-scheme:dark;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
h1,h2,h3,p,ul,ol,dl,dd{margin:0;padding:0}
ul,ol{list-style:none}
:focus-visible{outline:2px solid var(--mag);outline-offset:2px}
[hidden]{display:none!important}
.num,.pr,td,.kv b,.kpi b{font-variant-numeric:tabular-nums}
.pos{color:var(--ok)}.neg{color:var(--bad)}.wrn{color:var(--warn)}

/* ===== yerleşim: sol ray · harita · sağ panel ===== */
:root{--rw:66px;--sw:clamp(300px,44vw,480px)}
#app{position:fixed;top:0;left:0;width:100%;height:100%;display:grid;grid-template-columns:var(--rw) minmax(0,1fr) var(--sw);grid-template-rows:100%;grid-template-areas:"rail map side";background:var(--bg)}
html.pc #app{grid-template-columns:var(--rw) minmax(0,1fr) 0}
html.pc #side{visibility:hidden}
html.rot #app{width:var(--vh);height:var(--vw);transform-origin:0 0;transform:translateX(var(--vw)) rotate(90deg)}

#rail{grid-area:rail;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);padding:4px 0 4px env(safe-area-inset-left);min-height:0;z-index:3}
#rail button{position:relative;flex:1 1 0;min-height:38px;max-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 2px;font:600 11.5px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);border-left:3px solid transparent}
#rail button.on{color:var(--ink);border-left-color:var(--mag);background:var(--card)}
#rail button svg{width:22px;height:22px}
.rb2{position:absolute;top:5px;right:6px;min-width:17px;padding:2px 4px;background:var(--warn);color:var(--card);font:700 11px/1 var(--disp);border-radius:8px;text-align:center}
.rb2.mag{background:var(--mag);color:var(--onmag)}
@media (max-height:350px){#rail button span.lbl{display:none}#rail button{gap:0}}

#mapWrap{grid-area:map;position:relative;touch-action:none;overflow:hidden;background:var(--sea);min-width:0}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#hud{position:absolute;left:8px;top:8px;right:58px;display:flex;align-items:stretch;gap:0;pointer-events:none}
#hud>*{pointer-events:auto}
.kpi{flex:none;display:flex;flex-direction:column;justify-content:center;padding:4px 10px 4px;background:var(--card);border:1px solid var(--line);border-left-width:0;min-width:0}
.kpi:first-child{border-left-width:1px;border-radius:3px 0 0 3px}.kpi:last-child{border-radius:0 3px 3px 0}
.kpi small{display:block;font:600 10px/1.1 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.kpi b{display:block;font:600 17px/1.1 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b i{font-style:normal;font-size:12px;color:var(--mute);margin-left:1px}
.kpi b.neg{color:var(--bad)}
.kpi.lv{text-align:left;cursor:pointer}.kpi.lv b{color:var(--mag)}
@container (max-width:470px){.kpi.rep{display:none}}
#mapWrap{container-type:inline-size}
@container (max-width:430px){.kpi.lv{display:none}}
@container (max-width:340px){.kpi b{font-size:15px}}
#toasts{position:absolute;left:8px;top:54px;right:58px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;pointer-events:none;z-index:2}
.toast{pointer-events:auto;max-width:min(100%,420px);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;background:var(--ink);color:var(--bg);padding:6px 10px;font-size:13px;line-height:1.3;border-left:4px solid var(--mute);text-align:left}
.toast.ok{border-left-color:var(--ok)}.toast.warn{border-left-color:var(--warn)}.toast.bad{border-left-color:var(--bad)}
#zoom{position:absolute;right:8px;top:8px;display:grid}
#zoom button,#speed button{width:42px;height:38px;display:grid;place-items:center;background:var(--card);border:1px solid var(--ink);font:600 18px/1 var(--disp)}
#zoom button+button{margin-top:-1px}
#speed{position:absolute;right:8px;bottom:8px;display:flex}
#speed button{width:44px;font-size:12px;letter-spacing:-1px}
#speed button+button{margin-left:-1px}
#speed button.on{background:var(--ink);color:var(--card)}
#idlePill{position:absolute;left:8px;bottom:8px;display:flex;align-items:center;gap:6px;height:38px;max-width:calc(100% - 200px);padding:0 12px 0 9px;background:var(--mag);color:var(--onmag);border:1px solid var(--mag);border-radius:3px;font:600 15px/1 var(--disp);letter-spacing:.03em}
#idlePill.dim{background:var(--card);color:var(--ink);border-color:var(--ink)}
#idlePill svg{flex:none}#idleTxt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#pTog{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:64px;display:none;place-items:center;background:var(--card);border:1px solid var(--ink);border-radius:3px 0 0 3px;margin-right:-8px}
html.pc #pTog{display:grid}
#legend{position:absolute;right:58px;top:8px;display:flex;gap:8px;align-items:center;font:600 11px/1 var(--disp);letter-spacing:.04em;background:var(--card);border:1px solid var(--line);padding:5px 7px;pointer-events:none}
@container (max-width:620px){#legend{display:none}}
.lg{color:var(--mute);text-transform:uppercase;letter-spacing:.09em;font-size:10px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;border:1px solid var(--ink);margin-right:4px;vertical-align:-1px}
.dot.sa{background:var(--ok)}.dot.sb{background:var(--warn)}.dot.sc{background:var(--bad)}.dot.sx{background:var(--line);border-style:dashed}

#side{grid-area:side;position:relative;display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0;background:var(--bg);border-left:1px solid var(--line);padding-right:env(safe-area-inset-right);z-index:2}
#ph,#sheetBar{display:flex;align-items:center;gap:8px;min-height:46px;padding:5px 6px 5px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
#phT,#sheetTitle{flex:1;min-width:0;font:700 19px/1.1 var(--disp);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#phT small{font:500 13px var(--body);color:var(--mute);letter-spacing:0;margin-left:6px}
#phA{display:flex;gap:6px}
.ib{flex:none;width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:3px;background:var(--card);color:var(--ink)}
#panel,#sheetBody{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:10px 12px 24px;display:flex;flex-direction:column;gap:9px;min-height:0}
#sheet{position:absolute;inset:0;background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr);z-index:5;padding-right:env(safe-area-inset-right)}
#sheetBar{padding-left:6px}
#sheetBar .btn{min-height:36px}

/* dikey yedek düzen */
html.port #app{grid-template-columns:100%;grid-template-rows:minmax(150px,36%) minmax(0,1fr) auto;grid-template-areas:"map" "side" "rail"}
html.port #rail{flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
html.port #rail button{border-left:0;border-top:3px solid transparent;max-height:none;padding:6px 0 7px;font-size:11px}
html.port #rail button.on{border-top-color:var(--mag)}
html.port #side{border-left:0;border-top:1px solid var(--line)}
html.port .pcb,html.port #pTog{display:none!important}
html.port.pc #side{visibility:visible}

/* ===== ortak parçalar ===== */
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:42px;padding:7px 12px;border:1px solid var(--ink);border-radius:3px;background:var(--card);font:600 16px/1.15 var(--disp);letter-spacing:.03em;text-align:center}
.btn.pri{background:var(--mag);border-color:var(--mag);color:var(--onmag)}
.btn.sm{min-height:36px;padding:5px 10px;font-size:15px}
.btn.xs{min-height:32px;padding:4px 9px;font-size:14px}
.btn small{display:block;margin-top:2px;font:400 12px/1.25 var(--body);letter-spacing:0;opacity:.88}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:default}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:7px}
.card{display:flex;flex-direction:column;gap:6px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:3px;padding:10px 12px}
button.card:active{border-color:var(--ink)}
.card.ship{border-left:5px solid var(--dry)}.card.ship.tank{border-left-color:var(--tank)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.nm{font:700 18px/1.15 var(--disp);letter-spacing:.01em}.nm.big{font-size:22px}
.pr{font:700 18px/1.15 var(--disp);white-space:nowrap}.pr.no{color:var(--mute)}
.sub{font-size:13px;color:var(--mute)}
.st{font-weight:500}
.note{font-size:13px;color:var(--mute);max-width:65ch}
.h{font:600 12px/1.2 var(--disp);letter-spacing:.11em;text-transform:uppercase;color:var(--mute);padding-bottom:4px;border-bottom:1px solid var(--line)}
.gs{display:grid;gap:3px;margin-top:2px}
.g{display:grid;grid-template-columns:70px minmax(0,1fr) 92px;gap:8px;align-items:center;font-size:12px}
.g label{font:600 12px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.g i{display:block;height:6px;background:var(--line)}
.g i b{display:block;height:100%;background:var(--ink)}.g i b.low{background:var(--bad)}
.g span{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.chip{font:600 12px/1 var(--disp);letter-spacing:.07em;text-transform:uppercase;padding:3px 6px;border:1px solid currentColor;border-radius:2px}
.chip.warn{color:var(--warn)}.chip.bad{color:var(--bad)}.chip.ok{color:var(--ok)}.chip.mag{color:var(--mag)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px dotted var(--line)}
.kv:last-child{border-bottom:0}.kv span{color:var(--mute)}.kv b{font-weight:500;text-align:right}
.kv.tot{border-top:1px solid var(--ink);border-bottom:0;margin-top:2px;padding-top:5px}.kv.tot span{color:var(--ink);font-weight:600}.kv.tot b{font-weight:600}
.kv.pos b{color:var(--ok)}.kv.neg b{color:var(--bad)}.kv.wrn b{color:var(--warn)}
.crew{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;padding:6px 0;border-bottom:1px dotted var(--line)}
.cr1{display:flex;flex-direction:column;min-width:0}.cr1 b{font:600 16px/1.15 var(--disp)}.cr1 span{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr2{display:flex;flex-direction:column;align-items:flex-end;font-size:12px}
.stars{letter-spacing:1px;color:var(--mag);font-size:13px}
.ck{display:grid;gap:4px;font-size:13px}
.steps{display:grid;gap:7px;counter-reset:s;margin:2px 0 4px}
.steps li{counter-increment:s;display:grid;grid-template-columns:20px 1fr;gap:6px;font-size:13.5px}
.steps li::before{content:counter(s);font:700 17px/1.2 var(--disp);color:var(--mag)}
.empty h2{font:700 22px/1.1 var(--disp)}
.tbl{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;width:100%;padding:7px 2px;border-bottom:1px dotted var(--line)}
.prow:last-child{border-bottom:0}
.prow.off{opacity:.55}
.pn{font-weight:500;min-width:0}.pn small{display:block;font-weight:400;font-size:12px;color:var(--mute)}
.pm{font-size:13px;color:var(--mute);text-align:right}
table.fin{width:100%;border-collapse:collapse;font-size:13px}
.fin th{text-align:left;font-weight:400;color:var(--mute);padding:3px 0}.fin thead th{font:600 11px var(--disp);letter-spacing:.08em;text-transform:uppercase;text-align:right}
.fin td{text-align:right;padding:3px 0 3px 8px;white-space:nowrap}
.fin tr.tot th,.fin tr.tot td{border-top:1px solid var(--ink);font-weight:600;color:var(--ink)}.fin tr.tot td.neg{color:var(--bad)}.fin tr.tot td.pos{color:var(--ok)}
.log{display:grid;gap:5px;font-size:13px}.log time{display:inline-block;min-width:86px;color:var(--mute);font-variant-numeric:tabular-nums}
.help{gap:8px}.help p{max-width:65ch}
.fig{display:block;width:100%;max-width:210px;height:auto;min-width:0}
.fig.big{max-width:300px;align-self:center}
.mgs{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-top:2px}
.mg{display:grid;grid-template-columns:58px minmax(0,1fr);gap:6px;align-items:center}
.mg label{font:600 11px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.mg i{display:block;height:5px;background:var(--line)}.mg i b{display:block;height:100%;background:var(--ink)}.mg i b.low{background:var(--bad)}
.vp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font:600 12px/1 var(--disp);letter-spacing:.04em;color:var(--mute)}
.vp i{display:block;height:4px;background:var(--line);position:relative}.vp i b{display:block;height:100%;background:var(--mag);position:relative}
.vp i b::after{content:"";position:absolute;right:-4px;top:-3px;width:10px;height:10px;border-radius:50%;background:var(--mag);border:2px solid var(--card)}
.segs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--ink);border-radius:3px;overflow:hidden;flex:none}
.segs button{position:relative;padding:8px 2px;text-align:center;white-space:nowrap;overflow:hidden;font:600 14px/1.1 var(--disp);letter-spacing:.03em;background:var(--card);border-left:1px solid var(--ink)}
.segs button:first-child{border-left:0}.segs button.on{background:var(--ink);color:var(--card)}
.bdg{display:inline-block;font-style:normal;margin-left:4px;min-width:15px;padding:1px 3px;background:var(--bad);color:var(--card);border-radius:2px;font-size:12px}
.lock{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--bad)}
.lock svg{flex:none}

/* filo */
.fsec{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:3px;background:var(--card);flex:none}
.fhead{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:1px 10px;padding:8px 10px 8px 12px;background:var(--panel);border-bottom:1px solid var(--line);align-items:center}
.fhead b{font:700 17px/1.15 var(--disp)}.fhead span{grid-column:1;font-size:12.5px;color:var(--mute)}.fhead em{font-style:normal}
.fhead .lvt{grid-row:1/3;grid-column:2;font:700 13px/1 var(--disp);letter-spacing:.06em;color:var(--mag);text-transform:uppercase}
.fhead i{grid-row:1/3;grid-column:3;font:700 22px/1 var(--disp);font-style:normal;width:20px;text-align:center}
.fmgr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line)}
.fmgr.none{grid-template-columns:minmax(0,1fr) auto}
.fmgr b{display:block;font:600 15px/1.15 var(--disp)}.fmgr small{display:block;font-size:12px;color:var(--mute)}.fmgr i{font-style:normal;font-size:20px;color:var(--mute)}
.av{border-radius:50%;flex:none;border:1px solid var(--line);display:block}
.srow{display:flex;align-items:center;gap:6px;padding-right:8px;border-bottom:1px dotted var(--line);border-left:4px solid var(--dry)}
.srow.tank{border-left-color:var(--tank)}.srow:last-child{border-bottom:0}
.srow.need{box-shadow:inset 0 0 0 999px rgba(200,120,0,.09)}
.srow.sel{box-shadow:inset 3px 0 0 var(--mag)}
.srm{flex:1;min-width:0;display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0 6px 6px}
.srm .fig{width:92px;max-width:92px}
.sn{min-width:0;display:flex;flex-direction:column}.sn b{font:600 15.5px/1.15 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sn small{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc{font:600 13px/1 var(--disp);color:var(--mute);font-variant-numeric:tabular-nums}.sc.neg{color:var(--bad)}
.qk{flex:none}
.sum{display:flex;flex-wrap:wrap;gap:4px 14px;font:500 13.5px/1.2 var(--disp);letter-spacing:.04em;color:var(--mute);text-transform:uppercase}
.sum b{color:var(--ink);font-weight:700;font-size:16px}.sum .wrn,.sum .wrn b{color:var(--warn)}

/* pazar */
.mrow{display:grid;grid-template-columns:100px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:7px 10px 7px 8px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--dry);border-radius:3px}
.mrow.tank{border-left-color:var(--tank)}.mrow .fig{width:100px}
.mrow.lk{background:transparent}.mrow.lk .fig{opacity:.55}
.mi{min-width:0;display:flex;flex-direction:column;gap:1px}.mi b{font:600 16px/1.15 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi small{font-size:12px;color:var(--mute)}
.mp{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}.mp b{font:700 17px/1 var(--disp)}
.cap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:2px 10px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;background:var(--panel);font-size:13px}
.cap b{font:700 16px var(--disp)}

/* tecrübe */
.xpc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.xpc b{font:700 17px/1.1 var(--disp)}.xpc .lv{font:700 22px/1 var(--disp);color:var(--mag);grid-row:1/3;grid-column:2;text-align:right}
.xpc .lv small{display:block;font:600 10px var(--disp);letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.bar{display:block;height:7px;background:var(--line);border-radius:1px;overflow:hidden}.bar b{display:block;height:100%;background:var(--mag)}
.bar.ink b{background:var(--ink)}
.xpn{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.tiers{display:grid;gap:6px}
.tier{display:grid;grid-template-columns:54px minmax(0,1fr);gap:8px;align-items:baseline;font-size:13px}
.tier b{font:700 13px var(--disp);letter-spacing:.06em;text-transform:uppercase}.tier.off{color:var(--mute)}
.lic{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dotted var(--line);font-size:13.5px}
.lic:last-child{border-bottom:0}.lic small{display:block;color:var(--mute);font-size:12px}

/* gemi: yük, geliştirme */
.acts{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:7px}
.orow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:7px 8px 7px 10px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--mag);border-radius:3px}
.orow.late{border-left-color:var(--warn)}
.ob{min-width:0;display:flex;flex-direction:column}.ob b{font:600 16px/1.15 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ob small{font-size:12px;line-height:1.3;color:var(--mute)}
.op{display:flex;flex-direction:column;align-items:flex-end;font-variant-numeric:tabular-nums}.op b{font:700 16px/1.1 var(--disp)}.op small{font-size:12px}
.urow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px dotted var(--line)}
.urow:last-child{border-bottom:0}.urow b{font:600 15.5px/1.15 var(--disp)}.urow p{grid-column:1;font-size:12.5px;color:var(--mute)}
.urow .btn{grid-row:1/3;grid-column:2;min-width:96px}
.urow .done{grid-row:1/3;grid-column:2;font:600 13px var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--ok)}
.urow.lk b{color:var(--mute)}
.sws{display:flex;flex-wrap:wrap;gap:6px}
.sw{display:flex;flex-direction:column;align-items:center;gap:3px;width:62px;padding:5px 2px;border:1px solid var(--line);border-radius:3px;font-size:11.5px;background:var(--card)}
.sw i{display:block;width:40px;height:16px;border-radius:2px;border:1px solid var(--ink)}
.sw.on{border-color:var(--mag);box-shadow:0 0 0 1px var(--mag)}
.rn{display:flex;gap:6px}.rn input{flex:1;min-width:0;height:38px;padding:0 10px;background:var(--bg);border:1px solid var(--ink);border-radius:3px;font-size:16px}

/* ofis, dünya */
.cand{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dotted var(--line)}
.cand:last-of-type{border-bottom:0}.cand .cr1 span{white-space:normal}.cv{font-style:italic}
.prow.emp{grid-template-columns:auto minmax(0,1fr) auto}
.avx{display:grid;place-items:center;width:34px;height:34px;border:1px dashed var(--mute);border-radius:50%;color:var(--mute);font:600 18px/1 var(--disp)}
.rb{display:grid;grid-template-columns:84px;gap:3px;text-align:right}.rb i{display:block;height:6px;background:var(--line)}
.rb b{display:block;height:100%;background:var(--ok)}.rb b.m{background:var(--warn)}.rb b.l{background:var(--bad)}.rb small{font-size:12px;color:var(--mute);white-space:nowrap}
.hqs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px}
.hqs svg{display:block;width:100%;height:auto;border:1px solid var(--line)}
.who{display:flex;align-items:center;gap:10px}.who b{display:block;font:700 17px/1.1 var(--disp)}.who small{color:var(--mute);font-size:12.5px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);padding:4px 0;text-align:left}
.chk i{display:grid;place-items:center;width:20px;height:20px;border:1px solid var(--ink);border-radius:2px;font-style:normal;color:var(--ink);font-weight:700;flex:none}

/* ===== pencereler ===== */
#modal,#intro{position:absolute;inset:0;z-index:20;display:flex;padding:10px;background:rgba(5,11,17,.62);overflow-y:auto}
#modal>*,#intro>*{margin:auto}
#intro{z-index:30}
.dlg{width:100%;max-width:400px;background:var(--card);border:1px solid var(--ink);border-top:5px solid var(--mag);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.dlg h2{font:700 21px/1.15 var(--disp);text-wrap:balance}
.dlg.warnd{border-top-color:var(--warn)}.dlg.pold{border-top-color:var(--ink)}.dlg.lvd{border-top-color:var(--ok)}
.opts{display:grid;gap:7px}
.dl,.dr{display:flex;flex-direction:column;gap:10px;min-width:0}
@media (min-width:600px){
 .dlg.two{max-width:720px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
 .dlg.two .dr{padding-top:2px}}
html.rot .dlg.two{max-width:720px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
.logo{font:700 46px/.95 var(--disp);letter-spacing:.14em;text-transform:uppercase}
.tag{color:var(--mute);font-size:13.5px}
#fNew{display:grid;gap:8px}
#fNew label{font:600 12px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
#fNew input{height:42px;padding:0 10px;background:var(--bg);border:1px solid var(--ink);border-radius:3px;font-size:16px}

#rot{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:var(--bg);text-align:center}
#rot>div{max-width:360px;display:flex;flex-direction:column;align-items:center;gap:16px}
#rot h2{font:700 26px/1.1 var(--disp)}
#rot p{color:var(--mute);font-size:14px}
#rot .btn{width:100%}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}}
html.rot .scr{touch-action:none}

.shd{display:grid;grid-template-columns:minmax(0,46%) minmax(0,1fr);gap:6px 12px;align-items:center}
.shd .fig.big{max-width:none;align-self:center}
.shd .vp,.shd .shc{grid-column:1/-1}
.shi{display:flex;flex-direction:column;gap:3px;min-width:0}
#side{container-type:inline-size}
@container (max-width:330px){
 .shd{grid-template-columns:1fr}.shd .fig.big{max-width:220px;justify-self:center}
 .mrow{grid-template-columns:minmax(0,1fr) auto}.mrow .fig{display:none}
 .srm{grid-template-columns:minmax(0,1fr) auto}.srm .fig{display:none}
 .acts .btn{padding:6px 4px}
 .orow{grid-template-columns:minmax(0,1fr) auto;row-gap:4px}.orow .btn{grid-column:1/-1}
}
.sline{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:7px 10px;border:1px solid var(--line);border-left:4px solid var(--dry);border-radius:3px;background:var(--card);font-size:13.5px}.sline.tank{border-left-color:var(--tank)}.sline .chips{margin:0}

.fig.crop{background:var(--card)}
#zoom .otg{margin-top:6px;font-size:0}
.oc{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.oo{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;padding:16px 10px 14px;border:1px solid var(--ink);border-radius:4px;background:var(--card);text-align:center;color:var(--ink)}
.oo svg{height:92px;width:auto}
.oo b{font:700 22px/1 var(--disp)}.oo small{font-size:12.5px;color:var(--mute);line-height:1.35}
.oo:active{border-color:var(--mag);box-shadow:0 0 0 1px var(--mag)}
/* dikey düzen: gemi resimleri büyük */
html.port .srm{grid-template-columns:128px minmax(0,1fr) auto}html.port .srm .fig{width:128px;max-width:128px}
html.port .mrow{grid-template-columns:136px minmax(0,1fr) auto}html.port .mrow .fig{width:136px}
html.port .shd{grid-template-columns:1fr}html.port .shd .fig.big{max-width:340px;justify-self:center}
html.port #zoom button{width:38px;height:34px}
#zoom .otg{display:none}html.rot #zoom .otg,html.port #zoom .otg{display:grid}
/* dil seçimi */
#legend b{font-weight:inherit}
.langs{margin:4px 0 8px}.langs button{font-family:var(--body);font-size:13px;font-weight:600;letter-spacing:0}
#rot .langs{width:100%}
.tag.sub2{margin-top:-4px;font:600 13px/1.1 var(--disp);letter-spacing:.12em;text-transform:uppercase}
:lang(zh) .logo{letter-spacing:.08em}
:lang(zh) .lg,:lang(zh) .tag.sub2{letter-spacing:.04em}
:lang(en) #rail button{letter-spacing:.02em}
/* ===== çentik / Dynamic Island / ana ekran çubuğu güvenli alanları =====
   Ana ekrana eklenen iOS uygulamasında içerik durum çubuğunun altına uzanır.
   --st/--sr/--sb/--sl düzenin üst/sağ/alt/sol kenarındaki güvenli boşluktur;
   döndürülmüş (html.rot) düzende fiziksel kenarlara göre yeniden eşlenir. */
:root{--st:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--mt:var(--st);--mr:0px;--mb:var(--sb)}
html.rot{--st:env(safe-area-inset-right,0px);--sr:env(safe-area-inset-bottom,0px);--sb:env(safe-area-inset-left,0px);--sl:env(safe-area-inset-top,0px);--mt:var(--st);--mb:var(--sb)}
html.pc:not(.port){--mr:var(--sr)}
html.port{--mb:0px}
#app{grid-template-columns:calc(var(--rw) + var(--sl)) minmax(0,1fr) calc(var(--sw) + var(--sr))}
html.pc #app{grid-template-columns:calc(var(--rw) + var(--sl)) minmax(0,1fr) 0}
#rail{padding:calc(4px + var(--st)) 0 calc(4px + var(--sb)) var(--sl)}
#side,#sheet{padding-top:var(--st);padding-right:var(--sr)}
#panel,#sheetBody{padding-bottom:calc(24px + var(--sb))}
#hud{top:calc(8px + var(--mt));right:calc(58px + var(--mr))}
#toasts{top:calc(54px + var(--mt));right:calc(58px + var(--mr))}
#zoom{top:calc(8px + var(--mt));right:calc(8px + var(--mr))}
#legend{top:calc(8px + var(--mt));right:calc(58px + var(--mr))}
#speed{bottom:calc(8px + var(--mb));right:calc(8px + var(--mr))}
#idlePill{bottom:calc(8px + var(--mb))}
#pTog{right:calc(8px + var(--mr))}
#modal,#intro{padding:calc(10px + var(--st)) calc(10px + var(--sr)) calc(10px + var(--sb)) calc(10px + var(--sl))}
#rot{padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}
html.port #app{grid-template-columns:100%}
html.port #rail{padding:0 var(--sr) var(--sb) var(--sl)}
html.port #side,html.port #sheet{padding-top:0}
html.port #panel,html.port #sheetBody{padding-bottom:24px}
/* iOS ana ekran uygulaması: tam ekran yüksekliği */
html.pwa,html.pwa body{height:var(--vh,100%)}
html.pwa #app{height:var(--vh,100%)}
html.pwa.rot #app{height:var(--vw)}
/* derinlik: personel, rakipler */
.cr1 span.cm{font-size:12px;white-space:normal}
.prow.rv .pn{display:block}.prow.rv .rk{display:inline-block;min-width:20px;font:700 15px/1 var(--disp);font-style:normal;color:var(--mute)}.prow.rv .dot{margin-right:6px}
.prow.rv.me{background:var(--card);box-shadow:inset 3px 0 0 var(--mag)}.prow.rv.me .pn{font-weight:600}
/* ayarlar */
.btn.tgl{flex-direction:column;align-items:flex-start;text-align:left;padding:7px 12px}.btn.tgl>span{display:flex;align-items:center;gap:10px}
.tgsw{position:relative;flex:none;width:34px;height:20px;border-radius:10px;background:var(--line);transition:background .15s}.tgsw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
.tgsw.on{background:var(--mag)}.tgsw.on::after{left:16px}
.btn.tgl small{padding-left:44px}
/* açık temada iOS ana ekran uygulamasının beyaz durum çubuğu yazısı okunsun */
html.pwa.lt body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:rgba(10,20,29,.55);z-index:70;pointer-events:none}
/* yeni gemi tipleri */
.card.ship.box,.srow.box,.mrow.box,.sline.box{border-left-color:#2f8f8a}
.card.ship.roro,.srow.roro,.mrow.roro,.sline.roro{border-left-color:#8e6cc4}
.card.ship.lng,.srow.lng,.mrow.lng,.sline.lng{border-left-color:#3fa0c9}
.fl{display:grid;gap:5px;margin-top:4px;font:600 12px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.fl input{height:40px;padding:0 10px;background:var(--bg);border:1px solid var(--ink);border-radius:3px;font:16px var(--body);color:var(--ink);text-transform:none;letter-spacing:0}
.card.lk{opacity:.72}
/* rehberli tur */
#tut{position:absolute;inset:0;z-index:25;pointer-events:none}
#tut.dim{background:rgba(5,11,17,.55)}
#tut .th{position:absolute;border-radius:6px;box-shadow:0 0 0 9999px rgba(5,11,17,.55);border:2px solid var(--mag);transition:left .25s,top .25s,width .25s,height .25s;animation:tutp 1.4s ease-in-out infinite}
#tut .tb{position:absolute;pointer-events:auto;background:var(--card);color:var(--ink);border:1px solid var(--ink);border-top:4px solid var(--mag);padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:6px}
#tut .tb b{font:700 19px/1.15 var(--disp)}#tut .tb p{font-size:14px;line-height:1.4}
#tut .tn{font:600 11px/1 var(--disp);letter-spacing:.12em;color:var(--mute)}
#tut .tbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}#tut .ta{flex:1;font-size:13px;font-weight:600;color:var(--mag)}
@keyframes tutp{50%{border-color:rgba(255,255,255,.15)}}
@media (prefers-reduced-motion:reduce){#tut .th{animation:none;transition:none}}
/* ipucu ve görevler */
#tip{position:absolute;left:8px;bottom:54px;right:8px;max-width:440px;z-index:3;background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--mag);padding:9px 11px 8px;box-shadow:0 4px 14px rgba(0,0,0,.18);font-size:13px;line-height:1.4}
#tip b{display:block;font-size:13px}#tip b small{font-weight:400;color:var(--mute)}#tip p{margin:4px 0 6px}#tip .btns{margin:0;display:flex;flex-wrap:wrap;gap:6px}#tip .btns .btn{flex:1 1 auto;min-width:0;padding-left:10px;padding-right:10px}
html.pwa #tip,html.rot #tip{bottom:calc(54px + var(--mb))}
.msn{padding:6px 0;border-top:1px solid var(--line)}.msn:first-of-type{border-top:0}.msn .mt{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.msn .mt .num{color:var(--ok);font-size:12px;white-space:nowrap}
.msn.ok b{color:var(--mute);font-weight:500}.msn .bar{margin:5px 0 2px}.msn small{color:var(--mute);font-size:11px}.msn .btns{margin:6px 0 0}.msn .note{margin:6px 0 0}
.msnc{border-left:3px solid var(--mag)}
.prow.emp.off{opacity:.75}

</style>
</head>

ab" data-t="co"><svg viewBox="0 0 20 20" width="22" height="22" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M3 17h14M5 17v-6M9 17V6M13 17v-9M17 17V4"/></g></svg><span class="lbl" data-i="co">Şirket</span></button><button type="button" data-a="tab" data-t="set"><svg viewBox="0 0 20 20" width="22" height="22" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 5h14M3 10h14M3 15h14"/></g><g fill="currentColor"><circle cx="7" cy="5" r="2"/><circle cx="13" cy="10" r="2"/><circle cx="8.5" cy="15" r="2"/></g></svg><span class="lbl" data-i="set">Ayarlar</span></button></nav>

function hav(a,b){const R=3440.065,r=Math.PI/180,dla=(b[1]-a[1])*r,dlo=(b[0]-a[0])*r,h=Math.sin(dla/2)**2+Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dlo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}

function dijk(src,ban){const dist={},prev={},done={};for(const k in NODE)dist[k]=Infinity;dist[src]=0;for(;;){let u=null,b=Infinity;for(const k in dist)if(!done[k]&&dist[k]<b){b=dist[k];u=k;}if(u===null)break;done[u]=1;for(const [v,w] of ADJ[u]||[]){if(ban&&ban[u+'-'+v])continue;if(dist[u]+w<dist[v]){dist[v]=dist[u]+w;prev[v]=u;}}}return {dist,prev};}

/* ---------- gemi hesapları ---------- */
function shipValue(s){const v=CLS[s.cls].base*(ECO.dfl+(1-ECO.dfl)*Math.pow(Math.max(0,1-s.age/30),1.4))*(0.7+0.3*s.cond/100)+upgVal(s);return S&&S.steel?Math.max(v,ldt(s)*S.steel*0.85):v;}
function maxCond(s){return clamp(100-s.age*0.9,60,97);}
function ppCost(s){return 14*Math.pow(s.dwt,0.55);}
function sk(s,k){const p=s.crew[k];return p?Math.max(1,p.skill-(s.morale<30?1:0)):0;}
function missingRoles(s){return ROLES.filter(r=>!s.crew[r.k]).map(r=>r.n);}
function seaSpeed(s){return (s.slow?0.85:1)*s.spd*(0.92+0.03*sk(s,'kap'))*(s.cond<50?0.92:1)*(up(s,'coat')?1.03:1);}
function consSea(s){return (s.slow?0.62:1)*(s.lngf?0.95:1)*s.cons*(1.10-0.03*sk(s,'cb'))*(s.cond<70?1+(70-s.cond)/150:1)*(up(s,'prop')?0.92:1)*(up(s,'coat')?0.96:1);}
function opsDays(s,tons){return (0.8+tons/12000)*(1.4-0.12*sk(s,'zab'))*(TOPS[s.type]||1)*opsMul(s)*(s.port&&hasTerm(s.port)?0.75:1);}
function wageDay(s){let t=0;for(const r of ROLES)if(s.crew[r.k])t+=s.crew[r.k].wage;return t/30;}
const ECO={fr:1.08,opx:1,szA:5.87,szE:0.25,dfl:0.22};
const szF=t=>clamp(ECO.szA*Math.pow(t,-ECO.szE),0.3,1);
function opexDay(s){return (CLS[s.cls].rat*55+150+s.dwt*0.02)*ECO.opx;}
function crewN(s){return CLS[s.cls].rat+ROLES.filter(r=>s.crew[r.k]).length;}
function fuelPrice(pid){return Math.round(620*PORT[pid].bf*S.fuelIdx);}
function fuelPx(s,pid){return Math.round(fuelPrice(pid)*(up(s,'scr')?0.9:1));}
function provRate(s){return crewN(s)*9*(0.85+PORT[s.port].st*0.06);}
function portFee(s,pid){return Math.round((1500+0.25*s.dwt)*[0.7,0.85,1,1.2,1.4][PORT[pid].st-1]*relFee(pid)*(hasTerm(pid)?0.4:1)/10)*10;}
function tollAmt(n,s){return Math.round((n==='Süveyş Kanalı'?8000+2.2*s.dwt:10000+2.6*s.dwt)/100)*100;}
function pscRisk(s,pid){const st=PORT[pid].st,pI=Math.min(0.92,(PSC_P[st-1]+(s.age>20?0.12:0))*relPsc(pid)),thr=PSC_T[st-1]+(TPSC[s.type]||0),base=s.cond+(sk(s,'kap')+sk(s,'cb')-6)*3+pscB(s);
 const pDet=pI*clamp((thr-10-base+7)/14,0,1),pFail=pI*clamp((thr-base+7)/14,0,1);return {pDet,pFail,lvl:pDet>=0.25?2:(pDet>=0.05||pFail>=0.3)?1:0};}
function estimate(s,to,o){const r=route(s.port,to),sea=r.nm/(seaSpeed(s)*24),wait=o?(hasTerm(s.port)?0:cong(s.port)*0.85)+(hasTerm(to)?0:cong(to)*0.85):0,ops=o?opsDays(s,o.tons)*2+wait:0,days=sea+ops,fuel=consSea(s)*sea+s.cons*0.08*ops;let toll=0;
 for(let i=1;i<r.path.length;i++){const tk=TOLL[r.path[i-1]+'-'+r.path[i]];if(tk)toll+=tollAmt(tk,s);}
 const fee=portFee(s,to),run=(wageDay(s)+opexDay(s)+provRate(s))*days,fuelCost=fuel*fuelPx(s,s.port),fr=o?Math.round(o.freight*frMul(s)):0,lt=o?layTime(o):0,dr=o?demRate(s.cls):0,dem=o?Math.round(layCalc({lt,dr,used:ops})/100)*100:0,ets=etsCalc(consSea(s)*sea,s.port,to),rz=rzEst(s,r.path),profit=fr-fuelCost-toll-fee-run+dem-ets-rz.cost;
 return {nm:r.nm,sea,ops,days,fuel,fuelCost,toll,fee,run,fr,profit,wait,lt,dr,dem,wx:routeWx(r.path),ets,rz,ppd:profit/Math.max(days,0.5),risk:pscRisk(s,to),path:r.path};}
function planTrip(s,to,o){const e=estimate(s,to,o);e.needFuel=e.fuel*1.12+2;e.range=e.needFuel<=s.fuelCap;e.needProv=Math.ceil(e.days+3);
 e.fuelShort=Math.max(0,Math.ceil(Math.min(s.fuelCap,e.needFuel)-s.fuel));e.provShort=Math.max(0,Math.ceil(e.needProv-s.prov));
 e.topCost=e.fuelShort*fuelPx(s,s.port)+e.provShort*provRate(s);e.miss=missingRoles(s);return e;}

/* ---------- para ---------- */
function fin(cat,x){S.fin.cur[cat]=(S.fin.cur[cat]||0)+x;}
function pay(x,cat,s){if(!(x>0))return;S.cash-=x;fin(cat,-x);if(s&&cat!=='bakım')s.vc=(s.vc||0)+x;}
function earn(x,cat){S.cash+=x;fin(cat,x);}
function fleetValue(){let t=0;for(const s of S.ships)t+=shipValue(s);return t;}
function creditLimit(){return 150000+0.25*Math.max(0,fleetValue()-debt())+400000*((S.hq||1)-1);}
function canPay(x){return S.cash-x>=-creditLimit();}
function netWorth(){return S.cash+fleetValue()-debt();}
function level(){const w=netWorth(),i=w<3e6?0:w<10e6?1:w<30e6?2:w<80e6?3:4;return [L('Tek gemili armatör','Single-ship owner','单船船东'),L('Küçük filo sahibi','Small fleet owner','小型船队船东'),L('Büyüyen şirket','Growing company','成长中的公司'),L('Büyük armatör','Major shipowner','大型船东'),L('Denizcilik devi','Shipping giant','航运巨头')][i];}
function addRep(x){S.rep=clamp(S.rep+x,((S.hq||1)-1)*4,100);}
/* kayıt defteri: metin ya da üç dilde metin üreten kapanış */
function logMsg(t){S.log.unshift({d:Math.floor(S.day),t:LX(t)});if(S.log.length>80)S.log.length=80;}

function newGame(name){
 S={v:1,name:(name||'').trim()||L('Yeni Denizcilik A.Ş.','New Shipping Co.','新航运公司'),cash:1.3e6,day:0,speed:0,rep:10,ships:[],market:[],mktDay:0,pool:[],poolDay:0,offers:{},fuelIdx:1,fuelDay:0,ev:[],log:[],fin:{m:0,cur:{},prev:{}},opt:{autoPause:true},nid:1,negDays:0,over:false,names:[],stat:{voy:0,cargo:0,tons:0}};
 initCorp();genMarket(true);refreshPool(true);PORTS.forEach(p=>{S.offers[p.id]=[];fillOffers(p.id);});logFounded();
}
function logFounded(){logMsg(()=>L(S.name+' kuruldu. Sermaye: '+USD(S.cash),S.name+' founded. Capital: '+USD(S.cash),S.name+'成立。资本：'+USD(S.cash)));}
function shipName(type){let n,i=0;do{n=pick(SHIPN);i++;}while(S.names.includes(n)&&i<80);S.names.push(n);return shipPre(type)+n;}
function mkListing(ck,ports,old){ports=ports.filter(p=>portUnl(p));if(!ports.length)ports=['IST'];const c=CLS[ck],age=old?ri(Math.max(c.age[0],c.age[1]-8),c.age[1]):ri(c.age[0],c.age[1]);
 const m={id:S.nid++,cls:ck,type:c.t,dwt:Math.round(rnd(c.dwt[0],c.dwt[1])/100)*100,age,spd:Math.round(rnd(c.spd[0],c.spd[1])*10)/10,cons:Math.round(rnd(c.cons[0],c.cons[1])*2)/2,at:pick(ports)};
 m.cond=Math.round(clamp(maxCond(m)-rnd(3,16),38,96));m.name=shipName(c.t);m.price=Math.round(shipValue(m)*rnd(0.97,1.12)/1000)*1000;return m;}
function mkStarter(){const m=mkListing('koster',['IST'],false);m.age=ri(21,24);m.cond=Math.round(clamp(maxCond(m)-rnd(4,9),50,90));m.price=Math.round(shipValue(m)*1.02/1000)*1000;return m;}
function genMarket(first){S.mktDay=Math.floor(S.day);S.names=S.ships.map(s=>s.name.slice(4));const A=[];
 A.push(first?mkStarter():mkListing('koster',HOME,true),mkListing('koster',HOME),mkListing('gcargo',HOME,true),mkListing('gcargo',HOME),mkListing('ctank',HOME,true),mkListing('handy',HUBS));
 const ks=['supra','pmax','mr','afra','handy','ctank'];for(let i=0;i<3;i++)A.push(mkListing(pick(ks),HUBS));
 A.push(mkListing(pick(['feeder','feeder','pctc','cbox','lng']),HUBS));
 A.sort((a,b)=>a.price-b.price);S.market=A;}
function buyBlock(m){if(!licOk(m.cls))return 'lic';if(S.ships.length>=shipCap())return 'cap';if(!canPay(m.price))return 'cash';return '';}
function buyWhy(m){const k=buyBlock(m);return k==='lic'?L('Ruhsat yok: '+licTxt(m.cls)+' gerekli','No licence: requires '+licTxt(m.cls),'没有执照：需要'+licTxt(m.cls)):k==='cap'?L('Ofisin en fazla '+shipCap()+' gemi yönetebilir. Daha büyük binaya taşın','Your office can manage at most '+shipCap()+' ships. Move to a bigger building','你的办公室最多只能管理'+shipCap()+'艘船。请搬到更大的办公楼'):k==='cash'?L('Nakit ve kredi limitin yetmiyor','Not enough cash and credit','现金和信用额度不足'):'';}
function buyShip(lid){const i=S.market.findIndex(m=>m.id===lid);if(i<0)return null;const m=S.market[i],k=buyBlock(m);if(k){toast(k==='cash'?L('Bu gemi için nakit yetmiyor','Not enough cash for this ship','现金不足，买不起这艘船'):buyWhy(m),'','bad');return null;}

function shipFrom(m){const cap=Math.round(m.cons*40/10)*10;
 const s={id:m.id,cls:m.cls,type:m.type,name:m.name,dwt:m.dwt,age:m.age,spd:m.spd,cons:m.cons,cond:m.cond,port:m.at,state:'idle',op:0,hold:0,fuel:Math.round(cap*0.15),fuelCap:cap,prov:7,crew:{},morale:70,cargo:null,voy:null,flags:{},up:{}};
 S.ships.push(s);svInit(s);return s;}
function sellShip(sid){const i=S.ships.findIndex(s=>s.id===sid);if(i<0)return;const s=S.ships[i];if(s.state!=='idle'||s.cargo)return;const v=Math.round(shipValue(s)*0.85/1000)*1000;earn(v,'gemi');S.ships.splice(i,1);payoffShip(s);
 const t=()=>L(s.name+' satıldı: '+USD(v),s.name+' sold: '+USD(v),s.name+'已售出：'+USD(v));logMsg(t);toast(t());save();}
function mkPerson(role,skill){const nat=wpick(NATS,NATW),[f,l]=NAMES[nat],fn=pick(f),ln=pick(l);
 return personInit({id:S.nid++,role,skill,nat,name:nat==='CN'?ln+' '+fn:fn+' '+ln,exp:Math.max(0,skill*4-3+ri(0,4)),wage:Math.round(ROLE[role].base*WMUL[skill]*rnd(0.92,1.08)/50)*50,xp:0});}
const rndSkill=()=>wpick([1,2,3,4,5],[22,28,25,17,8]);
function refreshPool(first){S.poolDay=Math.floor(S.day);for(const r of ROLES){if(first){for(let k=1;k<=5;k++)S.pool.push(mkPerson(r.k,k));continue;}
  const K=S.pool.filter(p=>p.role===r.k&&(p.own||p.ret));let A=S.pool.filter(p=>p.role===r.k&&!(p.own||p.ret)).slice(2);A=K.concat(A);const rest=S.pool.filter(p=>p.role!==r.k);while(A.length<5+K.length)A.push(mkPerson(r.k,rndSkill()));S.pool=rest.concat(A);}}
function fire(s,role){const p=s.crew[role];if(!p)return;pay(Math.round(p.wage/2),'personel');delete s.crew[role];}
function hire(s,role,pid){if(!s.port){toast(L('Personel değişimi limanda yapılır','Crew changes are made in port','只能在港口更换船员'),'','bad');return false;}const i=S.pool.findIndex(p=>p.id===pid);if(i<0)return false;
 if(s.crew[role]){const o=s.crew[role];if(ceLeft(o)<=7){delete s.crew[role];S.leave.push({p:o,back:Math.floor(S.day)+ri(45,90)});}else fire(s,role);}const p=S.pool.splice(i,1)[0];s.crew[role]=p;p.since=Math.floor(S.day);p.ce=Math.floor(S.day)+CONTR[role]+ri(-15,15);p.poolT=undefined;pay(1500+(crewAir(s.port)?0:2500),'personel',s);
 if(S.pool.filter(x=>x.role===role).length<3)S.pool.push(mkPerson(role,rndSkill()));return true;}
function autoCrew(s,mode){for(const r of ROLES){if(s.crew[r.k])continue;const c=S.pool.filter(p=>p.role===r.k);if(!c.length)continue;c.sort(mode==='best'?(a,b)=>b.skill-a.skill||a.wage-b.wage:(a,b)=>a.wage-b.wage);hire(s,r.k,c[0].id);}}

/* ---------- ikmal ve bakım ---------- */
function buyFuel(s,t){t=Math.min(t,s.fuelCap-s.fuel);if(t<0.5)return 0;const c=t*fuelPx(s,s.port);if(!canPay(c)){toast(L('Yakıt için nakit yetmiyor','Not enough cash for fuel','现金不足，无法加油'),'','bad');return 0;}pay(c,'yakıt',s);s.fuel+=t;return t;}
function buyProv(s,days){days=Math.min(days,120-s.prov);if(days<=0)return 0;const c=days*provRate(s);if(!canPay(c)){toast(L('Kumanya için nakit yetmiyor','Not enough cash for provisions','现金不足，无法购买伙食'),'','bad');return 0;}pay(c,'kumanya',s);s.prov+=days;return days;}
function repairInfo(s){const lim=Math.min(80,maxCond(s)),to=Math.min(lim,s.cond+10);return {to,cost:Math.max(0,to-s.cond)*ppCost(s)*inspCf(),days:2,ok:to-s.cond>=1};}

function doRepair(s,dock){if(s.state!=='idle')return;const inf=dock?dockInfo(s):repairInfo(s);if(!inf||!inf.ok)return;if(!canPay(inf.cost)){toast(L('Bakım için nakit yetmiyor','Not enough cash for maintenance','现金不足，无法维修'),'','bad');return;}

 logMsg(()=>dock?L(s.name+' havuza alındı: '+USD(inf.cost),s.name+' entered drydock: '+USD(inf.cost),s.name+'进坞：'+USD(inf.cost)):L(s.name+' bakıma alındı: '+USD(inf.cost),s.name+' under maintenance: '+USD(inf.cost),s.name+'开始维修：'+USD(inf.cost)));s.ack=false;resume();}

/* ---------- yük teklifleri ---------- */
function mkOffer(from,type,sz){const [a,b]=SZ[sz][type],tons=Math.round(rnd(a,b)/100)*100;let cands=PORTS.filter(p=>p.id!==from&&portOpen(p.id)&&portOk(type==='lng'&&TPORTS.lngx.includes(from)?'lng':type,p.id)&&!(type==='lng'&&TPORTS.lngx.includes(p.id))).map(p=>({p,d:RTc[from].dist[p.id]}));if(!cands.length)cands=PORTS.filter(p=>p.id!==from&&portOpen(p.id)).map(p=>({p,d:RTc[from].dist[p.id]}));
 if(sz==='X'||sz==='S'){const near=cands.filter(c=>c.d<=(sz==='X'?2600:5500));cands=near.length>=3?near:cands.sort((x,y)=>x.d-y.d).slice(0,4);}
 const w=cands.map(c=>sz==='X'||sz==='S'?1/Math.pow(c.d+(sz==='X'?250:400),1.2):(c.d<600?0.2:1)/Math.pow(c.d+1500,0.6)),pk=wpick(cands,w),to=pk.p.id,nm=pk.d;
 const per=ECO.fr*(8+0.013*Math.min(nm,1500)+0.008*Math.max(0,nm-1500))*szF(tons)*DESTF[PORT[to].st-1]*(TMUL[type+sz]||TMUL[type]||1)*rnd(0.85,1.2)*(0.95+S.rep/600)*(0.55+0.45*S.fuelIdx)*offerMul(from,to)*pwMul(from,to);
 const kd=pick(KINDS[type+sz]);

function applyEv(ev,i){const s=S.ships.find(x=>x.id===ev.sid),d=ev.d||{};
 switch(ev.k){
 case 'bd':if(i===0){pay(d.parts,'bakım',s);if(Math.random()<d.pOk){s.op=(2.4-0.3*d.avg)*(d.sev>1?1.6:1);toast(L(s.name+': mürettebat arızayı kendi giderdi, '+D1(s.op)+' gün',s.name+': the crew fixed the breakdown themselves, '+D1(s.op)+' days',s.name+'：船员自行排除了故障，用时'+D1(s.op)+'天'),s.id,'ok');}
   else{s.op=1.5+1.5*d.sev;const c=Math.round(d.svc*1.3),op=s.op;pay(c,'bakım',s);s.cond=Math.max(15,s.cond-2);

  else{pay(d.svc,'bakım',s);s.op=1.5*d.sev;}logMsg(()=>L(s.name+' seyirde arıza yaptı',s.name+' broke down at sea',s.name+'在航行中发生故障'));break;

 case 'bilge':if(i===0){pay(d.slop,'liman',s);}else if(i===1){if(Math.random()<d.pFix){toast(L(s.name+': 2. Çarkçı OWS’yi onardı',s.name+': the second engineer repaired the OWS',s.name+'：大管轮修好了油水分离器'),s.id,'ok');}
  else{pay(d.slop,'liman',s);s.hold=0.3;toast(L(s.name+': OWS onarılamadı, slop limana verilecek ('+USD(d.slop)+')',s.name+': the OWS could not be repaired, the slop goes ashore ('+USD(d.slop)+')',s.name+'：油水分离器没修好，污油将交给港口（'+USD(d.slop)+'）'),s.id,'warn');}}
  else{s.flags.dump=1;s.morale=Math.max(0,s.morale-5);}break;

   else{const r=Math.round(clamp(shipValue(s)*0.08,40000,400000)/1000)*1000;pay(r,'ceza',s);s.hold=6;s.morale=Math.max(0,s.morale-25);addRep(-1);

    logMsg(()=>L(s.name+' korsan saldırısına uğradı',s.name+' was attacked by pirates',s.name+'遭到海盗袭击'));}}
  else toast(L(s.name+' bölgeyi olaysız geçti',s.name+' crossed the area without incident',s.name+'平安通过该海域'),s.id);break;
 case 'nofuel':pay(d.cost,'yakıt',s);s.fuel+=d.q;s.hold=2;addRep(-2);logMsg(()=>L(s.name+' denizde yakıtsız kaldı',s.name+' ran out of fuel at sea',s.name+'在海上燃油耗尽'));break;

/* ---------- zaman ---------- */
function pBreak(s){return (0.0015+0.0007*Math.pow(Math.max(0,85-s.cond),1.15))*(1.6-0.22*sk(s,'cb'))*(inspector()?IBF[inspector().skill-1]:1)*(up(s,'eng')?0.65:1);}
function seaStep(s,d){const v=s.voy;
 if(s.fuel<=0){evNoFuel(s);return;}
 if(s.hold>0){s.hold-=d;const fh=consSea(s)*0.5*d;s.fuel=Math.max(0,s.fuel-fh);v.fu=(v.fu||0)+fh;s.cf=(s.cf||0)+fh;return;}
 {const dn=seaSpeed(s)*24*d*wxSea(s,d),fc=consSea(s)*d;v.done+=dn;s.fuel=Math.max(0,s.fuel-fc);v.fu=(v.fu||0)+fc;s.cf=(s.cf||0)+fc;s.cd=(s.cd||0)+dn*s.dwt;}
 const c0=s.cond;s.cond=Math.max(15,s.cond-0.08*(1+s.age/20)*(1.3-0.1*sk(s,'c2'))*(up(s,'eng')?0.8:1)*d);
 if(c0>=50&&s.cond<50&&!managed(s))toast(L(s.name+' yıpranıyor: durum %50 altına indi, ilk limanda bakım yaptır',s.name+' is wearing out: condition is below 50%, get maintenance at the next port',s.name+'磨损加剧：船况低于50%，请在下一个港口维修'),s.id,'warn');
 crewXp(s,d);
 for(const t of v.trig){if(t.x||v.done<t.at)continue;t.x=1;
  if(t.k==='toll'){pay(t.amt,'kanal',s);logMsg(()=>L(s.name+': '+tollN(t.n)+' geçişi '+USD(t.amt),s.name+': '+tollN(t.n)+' transit '+USD(t.amt),s.name+'：'+tollN(t.n)+'通行费'+USD(t.amt)));}
  else if(t.k==='war'){const a=Math.round((5000+0.6*s.dwt)/100)*100;pay(a,'kanal',s);logMsg(()=>L(s.name+': Hürmüz savaş riski primi '+USD(a),s.name+': Hormuz war-risk premium '+USD(a),s.name+'：霍尔木兹战争险附加费'+USD(a)));
   if(rel('IR')<30&&Math.random()<0.08){s.hold=4;toast(L(s.name+' Hürmüz’de denetim için durduruldu, 4 gün kayıp',s.name+' was stopped for inspection in Hormuz, 4 days lost',s.name+'在霍尔木兹被拦下检查，损失4天'),s.id,'bad');logMsg(()=>L(s.name+' Hürmüz’de durduruldu',s.name+' was stopped in Hormuz',s.name+'在霍尔木兹被拦截'));}}
  else if(t.k==='red'){if(t.mode===1){const a=Math.round((18000+0.2*s.dwt)/100)*100;pay(a,'kanal',s);logMsg(()=>L(s.name+': Kızıldeniz koruma ve sigorta '+USD(a),s.name+': Red Sea escort and insurance '+USD(a),s.name+'：红海护航和保险'+USD(a)));}
   else if(Math.random()<0.1*(up(s,'sec')?0.5:1)){const c=Math.round((30000+s.dwt*0.8)/1000)*1000;pay(c,'bakım',s);s.cond=Math.max(15,s.cond-12);s.hold=4;s.morale=Math.max(0,s.morale-20);
    pushInfo(()=>L('Saldırı: ','Attack: ','遇袭：')+s.name,()=>L('Gemi Kızıldeniz’in güneyinde saldırıya uğradı. Hasar onarımı '+USD(c)+', 4 gün kayıp. Mürettebat sarsıldı.','The ship was attacked in the southern Red Sea. Damage repairs '+USD(c)+', 4 days lost. The crew is shaken.','船舶在红海南部遭到袭击。损坏修理'+USD(c)+'，损失4天。船员受到惊吓。'));
    logMsg(()=>L(s.name+' Kızıldeniz’de saldırıya uğradı',s.name+' was attacked in the Red Sea',s.name+'在红海遭到袭击'));}}
  else{evPirate(s);return;}}
 if(v.done>=v.nm){arrive(s);return;}
 if(S.day-v.lastEv<1.5)return;
 if(Math.random()<pBreak(s)*d){evBreakdown(s);return;}
 if(S.day-(v.lastStorm||-99)>6&&Math.random()<0.012*d){evStorm(s);return;}
 if(!v.bilge&&Math.random()<0.004*(s.age>20?2:1)*d){v.bilge=1;evBilge(s);}
}
function tickShip(s,d){
 pay(wageDay(s)*d,'personel',s);pay(opexDay(s)*d,'işletme',s);s.age+=d/365;s.prov=Math.max(0,s.prov-d);
 const tgt=clamp(35+13*(s.crew.asc?s.crew.asc.skill:0)+(up(s,'hab')?12:0)-(s.prov<=0?45:0),5,100);s.morale+=clamp(tgt-s.morale,-6*d,4*d);
 switch(s.state){
  case 'idle':s.fuel=Math.max(0,s.fuel-s.cons*0.03*d);s.cond=Math.max(15,s.cond-0.015*d);break;
  case 'load':s.fuel=Math.max(0,s.fuel-s.cons*0.08*d);if(s.cargo)s.cargo.used=(s.cargo.used||0)+d;if(portWx(s.port)<0.6)s.op-=d;if(s.op<=0){s.state='sea';s.port=null;s.voy.lastEv=S.day;R();}break;
  case 'disch':s.fuel=Math.max(0,s.fuel-s.cons*0.08*d);if(s.cargo)s.cargo.used=(s.cargo.used||0)+d;if(portWx(s.port)<0.6)s.op-=d;if(s.op<=0)completeCargo(s);break;
  case 'maint':s.op-=d;if(s.op<=0){s.cond=Math.max(s.cond,s.maintTo);s.vc=0;const w=svDone(s)||finishWork(s);goIdle(s,w||L('bakım bitti','maintenance done','维修完成'));}break;
  case 'held':s.op-=d;if(s.op<=0){if(s.cargo){s.state='disch';s.op=opsDays(s,s.cargo.tons);toast(L(s.name+' serbest bırakıldı, tahliye başladı',s.name+' released, discharge started',s.name+'已获释放，开始卸货'),s.id);R();}else goIdle(s,L('serbest bırakıldı','released','已获释放'));}break;
  case 'broken':s.fuel=Math.max(0,s.fuel-s.cons*0.1*d);s.op-=d;if(s.op<=0){s.state='sea';s.voy.lastEv=S.day;if(!managed(s))toast(L(s.name+' tamir edildi, yola devam ediyor',s.name+' repaired, continuing the voyage',s.name+'已修好，继续航行'),s.id,'ok');R();}break;
  case 'sea':seaStep(s,d);break;
  case 'tc':tcStep(s,d);break;
 }}
function newDay(){const day=Math.floor(S.day);
 PORTS.forEach(p=>fillOffers(p.id));corpDay(day);deepDay(day);deep2Day(day);deep3Day(day);deep4Day(day);
 if(day-S.fuelDay>=10){S.fuelDay=day;S.fuelIdx=clamp(S.fuelIdx*rnd(0.93,1.08),0.75,1.35);}
 if(day-S.mktDay>=45){genMarket();toast(L('Gemi pazarına yeni ilanlar geldi','New listings in the ship market','船舶市场有新挂牌'));R();}
 if(day-S.poolDay>=30)refreshPool();
 const m=Math.floor(day/30);if(m!==S.fin.m){S.fin.prev=S.fin.cur;S.fin.cur={};S.fin.m=m;}
 if(S.cash<-creditLimit()){S.negDays++;if(S.negDays===1)toast(L('Kredi limiti aşıldı. 20 gün içinde toparlanamazsan şirket batar.','Credit limit exceeded. If you can’t recover within 20 days, the company goes bankrupt.','已超出信用额度。如果20天内无法扭转，公司将破产。'),'','bad');
  if(S.negDays>=20){S.over=true;S.speed=0;const nm=S.name,dy=S.day,cg=S.stat.cargo,tn=S.stat.tons;
   pushEv({k:'over',title:()=>L('Şirket battı','The company went bankrupt','公司破产'),body:()=>L(nm+' borçlarını ödeyemedi ve '+fmtDate(dy)+' tarihinde iflas etti. '+cg+' yük taşıdın, '+N(tn)+' ton.',nm+' could not pay its debts and went bankrupt on '+fmtDate(dy)+'. You carried '+cg+' cargoes, '+N(tn)+' tonnes.',nm+'无力偿还债务，于'+fmtDate(dy)+'破产。你共运输了'+cg+'批货物，'+N(tn)+'吨。'),opts:[{l:()=>L('Yeni şirket kur','Start a new company','创办新公司')}]});}}
 else S.negDays=0;
 if(day%5===0)save();
}
function tick(d){const d0=Math.floor(S.day);S.day+=d;for(const s of S.ships.slice())tickShip(s,d);if(!S.ev.length)autoRun();if(S.cash<0)S.cash+=S.cash*0.12/365*d;if(Math.floor(S.day)!==d0)newDay();}

function initCorp(){S.hq=S.hq||1;S.staff=S.staff||[];S.fleet=S.fleet||{};FLEETS.forEach(f=>{if(!S.fleet[f.k])S.fleet[f.k]={open:true,crew:'cheap'};});
 S.rel=S.rel||{};Object.keys(CNAME).forEach(c=>{if(S.rel[c]===undefined)S.rel[c]=c==='TR'?65:Math.round(rnd(44,58));});
 S.ban=S.ban||{};S.boy=S.boy||{};S.auto=S.auto||{};S.dipCd=S.dipCd||{};S.pol=S.pol||{next:S.day+rnd(25,45),cr:{},last:{},n:0};S.lastSpd=S.lastSpd||1;
 if(!S.spool)refreshStaff();initProg();PORTS.forEach(p=>{if(!S.offers[p.id]){S.offers[p.id]=[];fillOffers(p.id);}});setRouting();initDeep();initDeep2();initDeep3();initDeep4();}
function setRouting(){RTc=(S&&((S.pol&&S.pol.cr.redsea&&S.pol.cr.redsea.mode===0)||(S.rpol&&S.rpol.avoid)))?RT2:RT;}

/* ---------- çalışanlar ---------- */
function mkStaff(role){const skill=rndSkill(),nat=wpick(NATS,NATW),[f,l]=NAMES[nat],fn=pick(f),ln=pick(l),tier=Math.random()<0.65?(skill>=4?'hi':skill<=2?'lo':'mid'):pick(['hi','mid','lo']);
 return {id:S.nid++,role,skill,nat,name:nat==='CN'?ln+' '+fn:fn+' '+ln,exp:clamp(skill*4+ri(-5,5),0,32),cv:pick(CV[tier]),wage:Math.round(SROLE[role].base*(0.55+0.22*skill)*rnd(0.85,1.2)/50)*50,stat:{voy:0,profit:0,late:0,det:0,jobs:0,hist:[]}};}
function refreshStaff(){S.spool={mgr:[],insp:[],dip:[],law:[]};for(let i=0;i<5;i++)S.spool.mgr.push(mkStaff('mgr'));for(let i=0;i<3;i++){S.spool.insp.push(mkStaff('insp'));S.spool.dip.push(mkStaff('dip'));S.spool.law.push(mkStaff('law'));}S.spoolDay=Math.floor(S.day);}
const staffOf=(role,fleet)=>S.staff.find(x=>x.role===role&&(role!=='mgr'||x.fleet===fleet));
const inspector=()=>staffOf('insp'),diplomat=()=>staffOf('dip');
function mgrOf(s){return staffOf('mgr',FLEETOF[s.cls]);}
function managed(s){return !s.manual&&!!mgrOf(s);}
function fireStaff(id){const i=S.staff.findIndex(x=>x.id===id);if(i<0)return;const m=S.staff[i];pay(m.wage,'ofis');S.staff.splice(i,1);
 logMsg(()=>L(m.name+' ('+SROLE[m.role].n+') işten çıkarıldı',m.name+' ('+SROLE[m.role].n+') dismissed',m.name+'（'+SROLE[m.role].n+'）被解雇'));}
function hireStaff(role,pid,fleet){if(role==='mgr'&&!mgrUnl()){toast(L('Filo müdürü '+MGRN+' teslimattan sonra açılır','Fleet managers open after '+MGRN+' deliveries','完成'+MGRN+'次交货后可任命船队经理'),'','bad');return false;}const pool=S.spool[role],i=pool.findIndex(x=>x.id===pid);if(i<0)return false;const cur=staffOf(role,fleet);
 if(!cur&&S.staff.length>=HQ[S.hq].slots){toast(L('Kadro dolu. Daha büyük bir binaya taşınman gerekiyor.','No free positions. You need to move to a bigger building.','编制已满，需要搬到更大的办公楼。'),'','bad');return false;}
 const m=pool[i];if(!canPay(m.wage)){toast(L('İmza parası için nakit yetmiyor','Not enough cash for the signing bonus','现金不足以支付签约金'),'','bad');return false;}
 if(cur)fireStaff(cur.id);pool.splice(i,1);pool.push(mkStaff(role));pay(m.wage,'ofis');m.since=Math.floor(S.day);if(role==='mgr')m.fleet=fleet;S.staff.push(m);
 logMsg(()=>L(m.name+' işe alındı: '+SROLE[role].n+(role==='mgr'?' ('+FLEET[fleet].n+')':''),m.name+' hired: '+SROLE[role].n+(role==='mgr'?' ('+FLEET[fleet].n+')':''),'聘用'+m.name+'：'+SROLE[role].n+(role==='mgr'?'（'+FLEET[fleet].n+'）':'')));
 S.ships.forEach(s=>{if(s.state==='idle')s.idleAt=S.day;});return true;}

/* ---------- filo müdürü otomasyonu ---------- */
function hash01(a,b){let x=Math.imul(a|0,73856093)^Math.imul(b|0,19349663);x=Math.imul(x^(x>>>13),1274126177);x^=x>>>16;return ((x>>>0)%10000)/10000;}
function mgrPick(s,m){let best=null,bv=0;const sg=MSIG[m.skill-1];
 for(const o of S.offers[s.port]||[]){if(!fits(s,o)||avoid(o.to))continue;const e=planTrip(s,o.to,o);if(!e.range||!canPay(e.topCost))continue;
  if(m.skill>=3&&(e.risk.lvl===2||e.days>o.days||e.wx.sev>0.55))continue;
  const ppd=(e.profit+e.fr*(MNEG[m.skill-1]-1))/Math.max(e.days,0.5);let v=ppd*(1+(hash01(o.id,m.id)*2-1)*sg*2)+(hash01(o.id+7,m.id)*2-1)*sg*5000;
  if(m.skill>=4&&e.risk.lvl===1)v*=0.8;if(v>bv){bv=v;best=o;}}
 return best;}
function mgrBallast(s,m){let best=null,bv=0;const sg=MSIG[m.skill-1],sp=seaSpeed(s)*24;
 for(const p of PORTS){if(p.id===s.port||!portOpen(p.id)||avoid(p.id))continue;const n=(S.offers[p.id]||[]).filter(o=>fits(s,o)&&!avoid(o.to)).length;if(!n)continue;
  if(m.skill>=3&&pscRisk(s,p.id).lvl===2)continue;const nm=RTc[s.port].dist[p.id];if(consSea(s)*nm/sp*1.12+2>s.fuelCap)continue;
  const v=n/(1+nm/500)*(1+(hash01(p.lon*100|0,m.id+Math.floor(S.day/3))*2-1)*sg*2);if(v>bv){bv=v;best=p.id;}}
 return best;}
function manageShip(s,m){if(S.day-(s.idleAt||0)<MDLY[m.skill-1]||s.askMaint)return;
 if(missingRoles(s).length){autoCrew(s,S.fleet[m.fleet].crew||'cheap');if(missingRoles(s).length)return;}
 if(maintCheck(s))return;
 const o=mgrPick(s,m);if(o){depart(s,o.to,o.id,true,m);return;}
 if(S.day-(s.idleAt||0)>MDLY[m.skill-1]+1.2){const b=mgrBallast(s,m);if(b&&canPay(planTrip(s,b,null).topCost))depart(s,b,0,true,m);else s.idleAt=S.day-0.6;}}
function autoRun(){if(!S.staff.length)return;for(const s of S.ships){if(s.state!=='idle'||s.manual)continue;const m=mgrOf(s);if(m)manageShip(s,m);}}
function quickBest(s){let best=null,bv=0;for(const o of S.offers[s.port]||[]){if(!fits(s,o)||avoid(o.to))continue;const e=planTrip(s,o.to,o);if(!e.range||e.miss.length||!canPay(e.topCost)||e.risk.lvl===2||e.days>o.days)continue;if(e.ppd>bv){bv=e.ppd;best=o;}}return best;}

/* ---------- makine enspektörü ---------- */
function inspCf(){const m=inspector();return m?ICF[m.skill-1]:1;}
function maintCheck(s){const m=inspector();if(!m||s.state!=='idle'||s.askMaint||(s.maintSkip||0)>S.day)return false;
 const d=dockInfo(s),r=repairInfo(s);let dock=false;
 if(d&&d.ok&&m.skill>=3&&s.cond<maxCond(s)-16)dock=true;else if(!(r.ok&&s.cond<ITHR[m.skill-1]))return false;
 const inf=dock?d:r;if(!canPay(inf.cost))return false;m.stat.jobs++;s.askMaint=1;const c=Math.round(s.cond),to=Math.round(inf.to),pid=s.port,days=Math.round(inf.days);
 pushEv({k:'maint',sid:s.id,who:m.id,title:()=>L('Bakım önerisi: ','Maintenance proposal: ','维修建议：')+s.name,
  body:()=>L('Patron, '+s.name+' yıprandı, durumu %'+c+'. '+PORT[pid].n+' limanında '+(dock?'havuza alalım':'bakıma alalım')+' mı? Durum %'+to+' olur.','Boss, '+s.name+' is worn out, condition '+c+'%. Shall we '+(dock?'drydock her':'do maintenance')+' at '+PORT[pid].n+'? Condition would go up to '+to+'%.','老板，'+s.name+'磨损了，船况'+c+'%。要不要在'+PORT[pid].n+(dock?'进坞':'维修')+'？船况会恢复到'+to+'%。'),d:{dock},
  opts:[{l:()=>L('Evet, yaptır','Yes, do it','好，去做'),s:()=>USD(inf.cost)+' · '+days+L(' gün',' days','天')},{l:()=>L('Hayır, sefere devam','No, keep sailing','不，继续航行'),s:()=>L('25 gün tekrar sorulmaz','Won’t ask again for 25 days','25天内不再询问')}]});return true;}

/* ---------- ülkeler ve ilişkiler ---------- */
function rel(c){const v=S.rel[c];return v===undefined?50:v;}
function relName(v){return v<15?L('kapalı','closed','关闭'):v<35?L('soğuk','cold','冷淡'):v<65?L('normal','normal','一般'):v<85?L('iyi','good','良好'):L('çok iyi','very good','很好');}
function addRel(c,x){if(!x)return;if(x>0){const d=diplomat();x*=(1+0.1*(S.hq-1))*(d?DMUL[d.skill-1]:1);}const o=rel(c);S.rel[c]=clamp(o+x,0,100);
 if(o>=15&&S.rel[c]<15){pushInfo(()=>L(CNAME[c]+' limanlarını kapattı',CNAME[c]+' has closed its ports',CNAME[c]+'关闭了港口'),()=>L(CNAME[c]+' ile ilişkiler koptu. Bu ülkenin limanları gemilerine kapalı; ilişki 15’in üstüne çıkana kadar yük alınamaz, sefer yapılamaz. Ticaret heyeti göndererek ilişkiyi onarabilirsin.','Relations with '+CNAME[c]+' have broken down. Its ports are closed to your ships; until relations rise above 15 you can’t load there or sail there. You can repair relations by sending a trade delegation.','与'+CNAME[c]+'的关系破裂。该国港口对你的船舶关闭；在关系回升到15以上之前，无法在那里装货或前往。可以派遣贸易代表团来修复关系。'));
  logMsg(()=>L(CNAME[c]+' limanları şirkete kapandı',CNAME[c]+' ports closed to the company',CNAME[c]+'港口对公司关闭'));}
 else if(o<15&&S.rel[c]>=15){toast(L(CNAME[c]+' limanları yeniden açıldı',CNAME[c]+' ports have reopened',CNAME[c]+'港口重新开放'),'','ok');}}
function portOpen(pid){const c=PORT[pid].c;return portUnl(pid)&&rel(c)>=15&&!((S.ban[c]||0)>S.day);}
function portWhy(pid){if(!portUnl(pid))return L('şirket seviyesi '+portTier(pid)+' gerekli','company level '+portTier(pid)+' required','需要公司等级'+portTier(pid));const c=PORT[pid].c;
 if(rel(c)<15)return L(CNAME[c]+' ile ilişkiler kopuk','relations with '+CNAME[c]+' have broken down','与'+CNAME[c]+'关系破裂');if((S.ban[c]||0)>S.day)return L('geçici olarak kapalı','temporarily closed','暂时关闭');return '';}
function avoid(pid){return !!S.boy[PORT[pid].c];}
function relMul(pid){return 0.8+0.4*rel(PORT[pid].c)/100;}
function relFee(pid){return 1.15-0.3*rel(PORT[pid].c)/100;}
function relPsc(pid){return 1.3-0.6*rel(PORT[pid].c)/100;}
function offerMul(from,to){let m=(relMul(from)+relMul(to))/2;const cr=S.pol.cr,a=PORT[from].c,b=PORT[to].c;
 if(cr.hormuz&&(a==='IR'||b==='IR'))m*=cr.hormuz.pro?1.5:1.3;
 if(cr.uscn&&((a==='US'&&b==='CN')||(a==='CN'&&b==='US')))m*=0.85;return m;}
function heyetCost(){return Math.round(clamp(20000+netWorth()*0.004,20000,400000)*(diplomat()?0.75:1)/1000)*1000;}
function sendHeyet(c){const cost=heyetCost();if((S.dipCd[c]||0)>S.day){toast(L('Bu ülkeye yakın zamanda heyet gitti','A delegation went to this country recently','最近已向该国派过代表团'),'','bad');return;}if(!canPay(cost)){toast(L('Heyet için nakit yetmiyor','Not enough cash for a delegation','现金不足以派遣代表团'),'','bad');return;}
 pay(cost,'diplomasi');S.dipCd[c]=S.day+45;addRel(c,8);logMsg(()=>L(CNAME[c]+' ülkesine ticaret heyeti gönderildi: '+USD(cost),'Trade delegation sent to '+CNAME[c]+': '+USD(cost),'向'+CNAME[c]+'派出贸易代表团：'+USD(cost)));toast(L(CNAME[c]+' ile ilişkiler gelişti','Relations with '+CNAME[c]+' improved','与'+CNAME[c]+'的关系改善了'),'','ok');}

/* ---------- bina ---------- */
function hqNext(){return HQ[S.hq+1]||null;}
function upgradeHQ(){const n=hqNext();if(!n)return false;if(coLv()<n.lv){toast(L('Bu bina için şirket seviyesi '+n.lv+' gerekli','This building requires company level '+n.lv,'这栋楼需要公司等级'+n.lv),'','bad');return false;}
 if(netWorth()<n.nw){toast(L('Bu bina için şirket değeri yetmiyor','Your company value is too low for this building','公司价值不足以搬入这栋楼'),'','bad');return false;}if(!canPay(n.cost)){toast(L('Taşınmak için nakit yetmiyor','Not enough cash to move','现金不足以搬迁'),'','bad');return false;}
 pay(n.cost,'ofis');S.hq++;logMsg(()=>L('Şirket '+n.n+' binasına taşındı: '+USD(n.cost),'The company moved into the '+n.n+': '+USD(n.cost),'公司搬入'+n.n+'：'+USD(n.cost)));toast(L('Yeni bina: ','New building: ','新办公楼：')+n.n,'','ok');save();return true;}

  body:()=>{const c=etsCost();return L('Avrupa Birliği limanlarına uğrayan 15 yaşından büyük gemilerden her uğrakta emisyon bedeli alınacak. Filoya yakıt tasarruf donanımı takılırsa gemiler muaf sayılacak. Bugünkü filon için donanım bedeli '+USD(c)+'.','Ships over 15 years old will pay an emissions charge on every call at European Union ports. Ships fitted with fuel-saving equipment will be exempt. Fitting your current fleet would cost '+USD(c)+'.','停靠欧盟港口的船龄超过15年的船舶，每次停靠都要缴纳排放费。加装节油设备的船舶可以豁免。为你目前的船队加装设备需要'+USD(c)+'。');},
  opts:[{l:()=>L('Bedeli öde, böyle devam et','Pay the charge and carry on','缴费，维持现状'),s:()=>L('Yaşlı gemiler AB limanlarında ek ücret öder','Older ships pay extra at EU ports','老旧船舶在欧盟港口需额外付费')},
   {l:()=>L('Filoya tasarruf donanımı taktır','Fit fuel-saving equipment to the fleet','为船队加装节油设备'),s:()=>L('Mevcut gemilerde tüketim %6 azalır · AB ülkeleriyle ilişkiler artar','Consumption drops 6% on current ships · relations with EU countries rise','现有船舶油耗降低6% · 与欧盟国家关系上升')}],

function etsCost(){let c=0;S.ships.forEach(s=>c+=15000+s.dwt*0.8);return Math.round(c/1000)*1000;}
function firePol(){const day=S.day,ids=Object.keys(POL).filter(id=>!S.pol.cr[id]&&day-(S.pol.last[id]===undefined?-1e9:S.pol.last[id])>=POL[id].cool&&day>=(POL[id].min||0));if(!ids.length)return;
 const id=S.pol.n===0&&ids.includes('hormuz')?'hormuz':pick(ids),P=POL[id];let c=null;if(P.pickC){const cs=Object.keys(CNAME).filter(x=>x!=='TR'&&rel(x)>=15);c=pick(cs);}
 S.pol.n++;S.pol.last[id]=day;pushEv({k:'pol',id,c,title:P.title,body:()=>P.body(c),opts:typeof P.opts==='function'?P.opts(c):P.opts});}
const CRISIS_END={hormuz:()=>L('Körfez’de gerilim yatıştı, primler normale döndü','Tension in the Gulf has eased, premiums are back to normal','海湾局势缓和，保费恢复正常'),redsea:()=>L('Kızıldeniz’de durum sakinleşti, Süveyş yolu normale döndü','The Red Sea has calmed down, the Suez route is back to normal','红海局势平静下来，苏伊士航线恢复正常'),inpk:()=>L('Hindistan ve Pakistan liman kısıtlamalarını kaldırdı','India and Pakistan have lifted their port restrictions','印度和巴基斯坦解除了港口限制'),uscn:()=>L('ABD ile Çin arasındaki ticaret gerginliği yumuşadı','Trade tension between the US and China has eased','中美贸易紧张局势有所缓和')};
function corpDay(day){
 let w=HQ[S.hq].rent;for(const m of S.staff)w+=m.wage;pay(w/30,'ofis');
 for(const k of Object.keys(S.pol.cr)){if(S.pol.cr[k].until<=day){delete S.pol.cr[k];const t=CRISIS_END[k];if(t){toast(t(),'','ok');logMsg(t);}if(k==='redsea')setRouting();}}
 if(day-(S.spoolDay||0)>=30)refreshStaff();
 if(inspector())for(const x of S.ships){if(x.state==='idle'&&!managed(x)&&maintCheck(x))break;}
 if(day>=S.pol.next&&!S.ev.some(e=>e.k==='pol')){S.pol.next=day+rnd(55,95);firePol();}}

/* ================= İLERLEME: TECRÜBE, RUHSAT, LİMAN KİLİTLERİ, GELİŞTİRMELER ================= */
const LVXP=[0,250,800,2000,4500];
const CLV=[0,400,1500,4000,9000];
const CLVN=['','','','',''];
const CLVN3=[['Yeni armatör','New shipowner','新晋船东'],['Bölgesel taşıyıcı','Regional carrier','区域承运人'],['Uzak yol armatörü','Deep-sea shipowner','远洋船东'],['Uluslararası armatör','International shipowner','国际船东'],['Küresel armatör','Global shipowner','全球船东']];
const LIC={koster:null,gcargo:['koster',2],ctank:['koster',3],handy:['gcargo',3],supra:['bulk',2],pmax:['bulk',3],mr:['tank',3],afra:['tank',4],feeder:['gcargo',3],cbox:['box',3],pctc:['gcargo',4],lng:['tank',4]};
const LICREP={handy:15,supra:25,pmax:35,ctank:10,mr:35,afra:55,feeder:15,cbox:35,pctc:30,lng:60};
const PTIER={JED:2,BND:2,KHI:2,DKR:2,LOS:2,MBA:2,DXB:3,BOM:3,CGP:3,DUR:3,SSZ:3,BUE:3,HAM:3,RTM:4,SIN:4,SHA:4,PUS:4,NYC:4,HOU:4,YOK:5,SYD:5,LAX:5};
const SHIPCAP=[0,2,5,9,15,25];
const CLSORD=['koster','gcargo','handy','supra','pmax','ctank','mr','afra','feeder','cbox','pctc','lng'];

const xpOf=k=>(S.xp&&S.xp[k])||0;
function lvOf(x,T){let l=1;for(let i=1;i<T.length;i++)if(x>=T[i])l=i+1;return l;}
const catLv=k=>lvOf(xpOf(k),LVXP);
const catB=s=>catLv(FLEETOF[s.cls])-1;
function coXP(){let t=S.xpB||0;for(const f of FLEETS)t+=xpOf(f.k);return t;}
const coLv=()=>lvOf(coXP(),CLV);
const portTier=pid=>PTIER[pid]||1;
const portUnl=pid=>portTier(pid)<=coLv();
const shipCap=()=>SHIPCAP[S.hq||1];
function licOk(cls){const r=LIC[cls];return !(r&&catLv(r[0])<r[1])&&S.rep>=(LICREP[cls]||0);}
function licTxt(cls){const r=LIC[cls],a=[];if(r)a.push(L(FLEET[r[0]].sh+' tecrübesi seviye '+r[1],FLEET[r[0]].sh+' experience level '+r[1],FLEET[r[0]].sh+'经验等级'+r[1]));if(LICREP[cls])a.push(L('itibar ','reputation ','声誉')+LICREP[cls]);return a.join(L(' ve ',' and ','和'));}
function lvPct(x,T){const l=lvOf(x,T);if(l>=T.length)return 100;const a=T[l-1],b=T[l];return clamp((x-a)/(b-a)*100,0,100);}

/* seviye kazançları: her seviye navlunu %3 artırır, denetim puanına 1,5 ekler, liman işlerini %4 kısaltır */
const frMul=s=>(1+0.03*catB(s))*ciiMul(s);
const opsMul=s=>(1-0.04*catB(s))*(up(s,'gear')?0.75:1);
const pscB=s=>1.5*catB(s)+(up(s,'nav')?4:0);

/* tecrübe kazanımı: oyun uzun soluklu olsun diye düşük tutulur */
const XPM=0.4;
function voyXP(c,late){const d=clamp(S.day-(c.t0===undefined?S.day-10:c.t0),2,80);let x=4+1.2*d;if(late)x*=0.5;if(PORT[c.to].st>=4)x*=1.2;return Math.max(1,Math.round(x*XPM));}
function addXP(k,x){if(!(x>0))return;const l0=catLv(k),c0=coLv();S.xp[k]=xpOf(k)+x;const l1=catLv(k),c1=coLv();
 if(l1>l0){const lic=CLSORD.filter(c=>LIC[c]&&LIC[c][0]===k&&LIC[c][1]===l1),ups=UPGK.filter(u=>UPG[u].lv===l1),F=FLEET[k];
  const ls=()=>LJ(lic.map(c=>CLS[c].n)),us=()=>LJ(ups.map(u=>UPG[u].n));
  pushEv({k:'lvl',title:()=>L(F.sh+' tecrübesi seviye '+l1,F.sh+' experience level '+l1,F.sh+'经验升至'+l1+'级'),
   body:()=>L('Şirketin '+F.sh.toLocaleLowerCase('tr')+' işinde ustalaştı. Bu sınıftaki gemiler artık navlunda %'+3*(l1-1)+' fazla kazanır, limanda daha hızlı çalışır ve denetimde daha iyi puan alır.'+(lic.length?' Yeni ruhsat: '+ls()+'. Gemi pazarından alabilirsin.':'')+(ups.length?' Yeni geliştirme: '+us()+'.':''),
    'Your company has grown more skilled in '+F.sh.toLowerCase()+' shipping. Ships in this class now earn '+3*(l1-1)+'% more freight, work faster in port and score better in inspections.'+(lic.length?' New licence: '+ls()+'. You can buy them in the ship market.':'')+(ups.length?' New upgrade: '+us()+'.':''),
    '公司在'+F.sh+'业务上更加娴熟。该类船舶的运费收入提高'+3*(l1-1)+'%，在港作业更快，检查得分也更高。'+(lic.length?'新执照：'+ls()+'。可以在船舶市场购买。':'')+(ups.length?'新的改装项目：'+us()+'。':'')),opts:[{l:OK3}]});
  logMsg(()=>L(F.sh+' tecrübesi seviye '+l1+' oldu',F.sh+' experience reached level '+l1,F.sh+'经验升至'+l1+'级'));}
 if(c1>c0){const ps=PORTS.filter(p=>portTier(p.id)===c1);ps.forEach(p=>fillOffers(p.id));const nh=HQ[c1+1]&&HQ[c1+1].lv===c1?HQ[c1+1]:null,pn=()=>LJ(ps.map(p=>p.n));
  pushEv({k:'lvl',title:()=>L('Şirket seviyesi ','Company level ','公司等级')+c1+L(': ',': ','：')+CLVN[c1-1],
   body:()=>L('Tecrüben arttıkça daha büyük limanlar seninle çalışmak istiyor. Yeni açılan limanlar: '+pn()+'.'+(nh?' '+nh.n+' binasına taşınma şartlarından biri de sağlandı.':''),'As your experience grows, bigger ports want to work with you. Newly opened ports: '+pn()+'.'+(nh?' You also meet one of the requirements for moving into the '+nh.n+'.':''),'随着经验增长，更大的港口愿意与你合作。新开放的港口：'+pn()+'。'+(nh?'搬入'+nh.n+'的条件之一也已达成。':'')),opts:[{l:OK3}]});
  logMsg(()=>L('Şirket seviyesi '+c1+' oldu, yeni limanlar açıldı','The company reached level '+c1+', new ports opened','公司升至'+c1+'级，新港口开放'));}}

 if(s.state!=='idle')return L('gemi limanda boşta olmalı','the ship must be idle in port','船舶须在港空闲');if(u.yard&&!PORT[s.port].yard)return L('tersaneli limanda yapılır','done at a port with a shipyard','须在有船厂的港口进行');if(!canPay(upgCost(s,k)))return L('nakit yetmiyor','not enough cash','现金不足');return '';}

 const fee=5000;if(!canPay(fee)){toast(L('Sicil harcı için nakit yetmiyor','Not enough cash for the registry fee','现金不足以支付登记费'),'','bad');return false;}pay(fee,'geliştirme');const old=s.name;logMsg(()=>L(old+' adını değiştirdi: '+pre+nm,old+' renamed: '+pre+nm,old+'更名为'+pre+nm));s.name=pre+nm;save();return true;}

 if(!S.riv){S.riv=RIVS.map((r,i)=>({id:i+1,n:r.n,c:r.c,home:r.home,f:r.f,v:r.v*rnd(0.9,1.1),pk:0,rep:r.rep,tr:0,st:'ok',t:0}));S.riv.forEach(r=>{r.pk=r.v;r.sh=rivShips(r);});}
 if(S.rivNext===undefined)S.rivNext=Math.floor(S.day)+ri(70,110);if(S.crewNext===undefined)S.crewNext=Math.floor(S.day)+ri(40,70);

 ppl.concat(S.pool||[]).forEach(personInit);fillTC();}
