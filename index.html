<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="screen-orientation" content="landscape">
<title>Armatör · Denizcilik Şirketi Oyunu</title>
<meta name="description" content="Eski bir kosterle başla, dünya limanları arasında yük taşı, tecrübe kazan ve denizcilik şirketini büyüt. A browser shipping-company game in Turkish, English and Chinese · 土耳其语、英语、中文航运公司经营游戏。">
<meta name="theme-color" content="#0a141d">
<meta property="og:title" content="Armatör · Denizcilik Şirketi Oyunu">
<meta property="og:description" content="Eski bir kosterle başla, limanlar arasında yük taşı, filonu büyüt. Start with an old coaster and grow a shipping company. Türkçe · English · 中文">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Armatör">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Köprüüstü ekranı: ECDIS gündüz paleti. Düzen: gösterge şeridi, deniz haritası, altında defter paneli. */
  --bg:#dde5e4; --panel:#edf1ee; --card:#fbfcf9; --line:#b7c4c5; --ink:#12212a; --mute:#52646d;
  --sea:#dbeaef; --shal:#b6d6e3; --land:#dcc98f; --coast:#8c7a41; --grid:rgba(18,33,42,.07);
  --foam:#ffffff; --hull:#25343d; --deck:#93a1a8; --sup:#fbfcf9; --boot:#a23a28; --rust:#9a5a2c;
  --mag:#ad1279; --onmag:#ffffff; --ok:#15754c; --warn:#9c5700; --bad:#b83022;
  --dry:#1b4d7a; --tank:#a5401a;
  --disp:"Barlow Condensed","Arial Narrow","Roboto Condensed","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#050b11; --panel:#0a141d; --card:#0f1d29; --line:#21374a; --ink:#d7e1e7; --mute:#879cab;
  --sea:#06141d; --shal:#0e2c3c; --land:#3b3a21; --coast:#77713d; --grid:rgba(215,225,231,.05);
  --foam:#a9c4d2; --hull:#5d7385; --deck:#9db0bc; --sup:#d2dde3; --boot:#b5503f; --rust:#b0703c;
  --mag:#e45fbd; --onmag:#1c0617; --ok:#4fcba6; --warn:#f0b24a; --bad:#ff8072;
  --dry:#7fb9ea; --tank:#ff9c6e; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#050b11; --panel:#0a141d; --card:#0f1d29; --line:#21374a; --ink:#d7e1e7; --mute:#879cab;
  --sea:#06141d; --shal:#0e2c3c; --land:#3b3a21; --coast:#77713d; --grid:rgba(215,225,231,.05);
  --foam:#a9c4d2; --hull:#5d7385; --deck:#9db0bc; --sup:#d2dde3; --boot:#b5503f; --rust:#b0703c;
  --mag:#e45fbd; --onmag:#1c0617; --ok:#4fcba6; --warn:#f0b24a; --bad:#ff8072;
  --dry:#7fb9ea; --tank:#ff9c6e; color-scheme:dark;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
h1,h2,h3,p,ul,ol,dl,dd{margin:0;padding:0}
ul,ol{list-style:none}
:focus-visible{outline:2px solid var(--mag);outline-offset:2px}
[hidden]{display:none!important}
.num,.pr,td,.kv b,.kpi b{font-variant-numeric:tabular-nums}
.pos{color:var(--ok)}.neg{color:var(--bad)}.wrn{color:var(--warn)}

/* ===== yerleşim: sol ray · harita · sağ panel ===== */
:root{--rw:66px;--sw:clamp(300px,44vw,480px)}
#app{position:fixed;top:0;left:0;width:100%;height:100%;display:grid;grid-template-columns:var(--rw) minmax(0,1fr) var(--sw);grid-template-rows:100%;grid-template-areas:"rail map side";background:var(--bg)}
html.pc #app{grid-template-columns:var(--rw) minmax(0,1fr) 0}
html.pc #side{visibility:hidden}
html.rot #app{width:var(--vh);height:var(--vw);transform-origin:0 0;transform:translateX(var(--vw)) rotate(90deg)}

#rail{grid-area:rail;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);padding:4px 0 4px env(safe-area-inset-left);min-height:0;z-index:3}
#rail button{position:relative;flex:1 1 0;min-height:38px;max-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 2px;font:600 11.5px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);border-left:3px solid transparent}
#rail button.on{color:var(--ink);border-left-color:var(--mag);background:var(--card)}
#rail button svg{width:22px;height:22px}
.rb2{position:absolute;top:5px;right:6px;min-width:17px;padding:2px 4px;background:var(--warn);color:var(--card);font:700 11px/1 var(--disp);border-radius:8px;text-align:center}
.rb2.mag{background:var(--mag);color:var(--onmag)}
@media (max-height:350px){#rail button span.lbl{display:none}#rail button{gap:0}}

#mapWrap{grid-area:map;position:relative;touch-action:none;overflow:hidden;background:var(--sea);min-width:0}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#hud{position:absolute;left:8px;top:8px;right:58px;display:flex;align-items:stretch;gap:0;pointer-events:none}
#hud>*{pointer-events:auto}
.kpi{flex:none;display:flex;flex-direction:column;justify-content:center;padding:4px 10px 4px;background:var(--card);border:1px solid var(--line);border-left-width:0;min-width:0}
.kpi:first-child{border-left-width:1px;border-radius:3px 0 0 3px}.kpi:last-child{border-radius:0 3px 3px 0}
.kpi small{display:block;font:600 10px/1.1 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.kpi b{display:block;font:600 17px/1.1 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b i{font-style:normal;font-size:12px;color:var(--mute);margin-left:1px}
.kpi b.neg{color:var(--bad)}
.kpi.lv{text-align:left;cursor:pointer}.kpi.lv b{color:var(--mag)}
@container (max-width:470px){.kpi.rep{display:none}}
#mapWrap{container-type:inline-size}
@container (max-width:430px){.kpi.lv{display:none}}
@container (max-width:340px){.kpi b{font-size:15px}}
#toasts{position:absolute;left:8px;top:54px;right:58px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;pointer-events:none;z-index:2}
.toast{pointer-events:auto;max-width:min(100%,420px);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;background:var(--ink);color:var(--bg);padding:6px 10px;font-size:13px;line-height:1.3;border-left:4px solid var(--mute);text-align:left}
.toast.ok{border-left-color:var(--ok)}.toast.warn{border-left-color:var(--warn)}.toast.bad{border-left-color:var(--bad)}
#zoom{position:absolute;right:8px;top:8px;display:grid}
#zoom button,#speed button{width:42px;height:38px;display:grid;place-items:center;background:var(--card);border:1px solid var(--ink);font:600 18px/1 var(--disp)}
#zoom button+button{margin-top:-1px}
#speed{position:absolute;right:8px;bottom:8px;display:flex}
#speed button{width:44px;font-size:12px;letter-spacing:-1px}
#speed button+button{margin-left:-1px}
#speed button.on{background:var(--ink);color:var(--card)}
#idlePill{position:absolute;left:8px;bottom:8px;display:flex;align-items:center;gap:6px;height:38px;max-width:calc(100% - 200px);padding:0 12px 0 9px;background:var(--mag);color:var(--onmag);border:1px solid var(--mag);border-radius:3px;font:600 15px/1 var(--disp);letter-spacing:.03em}
#idlePill.dim{background:var(--card);color:var(--ink);border-color:var(--ink)}
#idlePill svg{flex:none}#idleTxt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#pTog{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:64px;display:none;place-items:center;background:var(--card);border:1px solid var(--ink);border-radius:3px 0 0 3px;margin-right:-8px}
html.pc #pTog{display:grid}
#legend{position:absolute;right:58px;top:8px;display:flex;gap:8px;align-items:center;font:600 11px/1 var(--disp);letter-spacing:.04em;background:var(--card);border:1px solid var(--line);padding:5px 7px;pointer-events:none}
@container (max-width:620px){#legend{display:none}}
.lg{color:var(--mute);text-transform:uppercase;letter-spacing:.09em;font-size:10px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;border:1px solid var(--ink);margin-right:4px;vertical-align:-1px}
.dot.sa{background:var(--ok)}.dot.sb{background:var(--warn)}.dot.sc{background:var(--bad)}.dot.sx{background:var(--line);border-style:dashed}

#side{grid-area:side;position:relative;display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0;background:var(--bg);border-left:1px solid var(--line);padding-right:env(safe-area-inset-right);z-index:2}
#ph,#sheetBar{display:flex;align-items:center;gap:8px;min-height:46px;padding:5px 6px 5px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
#phT,#sheetTitle{flex:1;min-width:0;font:700 19px/1.1 var(--disp);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#phT small{font:500 13px var(--body);color:var(--mute);letter-spacing:0;margin-left:6px}
#phA{display:flex;gap:6px}
.ib{flex:none;width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:3px;background:var(--card);color:var(--ink)}
#panel,#sheetBody{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:10px 12px 24px;display:flex;flex-direction:column;gap:9px;min-height:0}
#sheet{position:absolute;inset:0;background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr);z-index:5;padding-right:env(safe-area-inset-right)}
#sheetBar{padding-left:6px}
#sheetBar .btn{min-height:36px}

/* dikey yedek düzen */
html.port #app{grid-template-columns:100%;grid-template-rows:minmax(150px,36%) minmax(0,1fr) auto;grid-template-areas:"map" "side" "rail"}
html.port #rail{flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
html.port #rail button{border-left:0;border-top:3px solid transparent;max-height:none;padding:6px 0 7px;font-size:11px}
html.port #rail button.on{border-top-color:var(--mag)}
html.port #side{border-left:0;border-top:1px solid var(--line)}
html.port .pcb,html.port #pTog{display:none!important}
html.port.pc #side{visibility:visible}

/* ===== ortak parçalar ===== */
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:42px;padding:7px 12px;border:1px solid var(--ink);border-radius:3px;background:var(--card);font:600 16px/1.15 var(--disp);letter-spacing:.03em;text-align:center}
.btn.pri{background:var(--mag);border-color:var(--mag);color:var(--onmag)}
.btn.sm{min-height:36px;padding:5px 10px;font-size:15px}
.btn.xs{min-height:32px;padding:4px 9px;font-size:14px}
.btn small{display:block;margin-top:2px;font:400 12px/1.25 var(--body);letter-spacing:0;opacity:.88}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:default}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:7px}
.card{display:flex;flex-direction:column;gap:6px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:3px;padding:10px 12px}
button.card:active{border-color:var(--ink)}
.card.ship{border-left:5px solid var(--dry)}.card.ship.tank{border-left-color:var(--tank)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.nm{font:700 18px/1.15 var(--disp);letter-spacing:.01em}.nm.big{font-size:22px}
.pr{font:700 18px/1.15 var(--disp);white-space:nowrap}.pr.no{color:var(--mute)}
.sub{font-size:13px;color:var(--mute)}
.st{font-weight:500}
.note{font-size:13px;color:var(--mute);max-width:65ch}
.h{font:600 12px/1.2 var(--disp);letter-spacing:.11em;text-transform:uppercase;color:var(--mute);padding-bottom:4px;border-bottom:1px solid var(--line)}
.gs{display:grid;gap:3px;margin-top:2px}
.g{display:grid;grid-template-columns:70px minmax(0,1fr) 92px;gap:8px;align-items:center;font-size:12px}
.g label{font:600 12px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.g i{display:block;height:6px;background:var(--line)}
.g i b{display:block;height:100%;background:var(--ink)}.g i b.low{background:var(--bad)}
.g span{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.chip{font:600 12px/1 var(--disp);letter-spacing:.07em;text-transform:uppercase;padding:3px 6px;border:1px solid currentColor;border-radius:2px}
.chip.warn{color:var(--warn)}.chip.bad{color:var(--bad)}.chip.ok{color:var(--ok)}.chip.mag{color:var(--mag)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px dotted var(--line)}
.kv:last-child{border-bottom:0}.kv span{color:var(--mute)}.kv b{font-weight:500;text-align:right}
.kv.tot{border-top:1px solid var(--ink);border-bottom:0;margin-top:2px;padding-top:5px}.kv.tot span{color:var(--ink);font-weight:600}.kv.tot b{font-weight:600}
.kv.pos b{color:var(--ok)}.kv.neg b{color:var(--bad)}.kv.wrn b{color:var(--warn)}
.crew{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;padding:6px 0;border-bottom:1px dotted var(--line)}
.cr1{display:flex;flex-direction:column;min-width:0}.cr1 b{font:600 16px/1.15 var(--disp)}.cr1 span{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr2{display:flex;flex-direction:column;align-items:flex-end;font-size:12px}
.stars{letter-spacing:1px;color:var(--mag);font-size:13px}
.ck{display:grid;gap:4px;font-size:13px}
.steps{display:grid;gap:7px;counter-reset:s;margin:2px 0 4px}
.steps li{counter-increment:s;display:grid;grid-template-columns:20px 1fr;gap:6px;font-size:13.5px}
.steps li::before{content:counter(s);font:700 17px/1.2 var(--disp);color:var(--mag)}
.empty h2{font:700 22px/1.1 var(--disp)}
.tbl{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;width:100%;padding:7px 2px;border-bottom:1px dotted var(--line)}
.prow:last-child{border-bottom:0}
.prow.off{opacity:.55}
.pn{font-weight:500;min-width:0}.pn small{display:block;font-weight:400;font-size:12px;color:var(--mute)}
.pm{font-size:13px;color:var(--mute);text-align:right}
table.fin{width:100%;border-collapse:collapse;font-size:13px}
.fin th{text-align:left;font-weight:400;color:var(--mute);padding:3px 0}.fin thead th{font:600 11px var(--disp);letter-spacing:.08em;text-transform:uppercase;text-align:right}
.fin td{text-align:right;padding:3px 0 3px 8px;white-space:nowrap}
.fin tr.tot th,.fin tr.tot td{border-top:1px solid var(--ink);font-weight:600;color:var(--ink)}.fin tr.tot td.neg{color:var(--bad)}.fin tr.tot td.pos{color:var(--ok)}
.log{display:grid;gap:5px;font-size:13px}.log time{display:inline-block;min-width:86px;color:var(--mute);font-variant-numeric:tabular-nums}
.help{gap:8px}.help p{max-width:65ch}
.fig{display:block;width:100%;max-width:210px;height:auto;min-width:0}
.fig.big{max-width:300px;align-self:center}
.mgs{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-top:2px}
.mg{display:grid;grid-template-columns:58px minmax(0,1fr);gap:6px;align-items:center}
.mg label{font:600 11px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.mg i{display:block;height:5px;background:var(--line)}.mg i b{display:block;height:100%;background:var(--ink)}.mg i b.low{background:var(--bad)}
.vp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font:600 12px/1 var(--disp);letter-spacing:.04em;color:var(--mute)}
.vp i{display:block;height:4px;background:var(--line);position:relative}.vp i b{display:block;height:100%;background:var(--mag);position:relative}
.vp i b::after{content:"";position:absolute;right:-4px;top:-3px;width:10px;height:10px;border-radius:50%;background:var(--mag);border:2px solid var(--card)}
.segs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--ink);border-radius:3px;overflow:hidden;flex:none}
.segs button{position:relative;padding:8px 2px;text-align:center;white-space:nowrap;overflow:hidden;font:600 14px/1.1 var(--disp);letter-spacing:.03em;background:var(--card);border-left:1px solid var(--ink)}
.segs button:first-child{border-left:0}.segs button.on{background:var(--ink);color:var(--card)}
.bdg{display:inline-block;font-style:normal;margin-left:4px;min-width:15px;padding:1px 3px;background:var(--bad);color:var(--card);border-radius:2px;font-size:12px}
.lock{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--bad)}
.lock svg{flex:none}

/* filo */
.fsec{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:3px;background:var(--card);flex:none}
.fhead{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:1px 10px;padding:8px 10px 8px 12px;background:var(--panel);border-bottom:1px solid var(--line);align-items:center}
.fhead b{font:700 17px/1.15 var(--disp)}.fhead span{grid-column:1;font-size:12.5px;color:var(--mute)}.fhead em{font-style:normal}
.fhead .lvt{grid-row:1/3;grid-column:2;font:700 13px/1 var(--disp);letter-spacing:.06em;color:var(--mag);text-transform:uppercase}
.fhead i{grid-row:1/3;grid-column:3;font:700 22px/1 var(--disp);font-style:normal;width:20px;text-align:center}
.fmgr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line)}
.fmgr.none{grid-template-columns:minmax(0,1fr) auto}
.fmgr b{display:block;font:600 15px/1.15 var(--disp)}.fmgr small{display:block;font-size:12px;color:var(--mute)}.fmgr i{font-style:normal;font-size:20px;color:var(--mute)}
.av{border-radius:50%;flex:none;border:1px solid var(--line);display:block}
.srow{display:flex;align-items:center;gap:6px;padding-right:8px;border-bottom:1px dotted var(--line);border-left:4px solid var(--dry)}
.srow.tank{border-left-color:var(--tank)}.srow:last-child{border-bottom:0}
.srow.need{box-shadow:inset 0 0 0 999px rgba(200,120,0,.09)}
.srow.sel{box-shadow:inset 3px 0 0 var(--mag)}
.srm{flex:1;min-width:0;display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0 6px 6px}
.srm .fig{width:92px;max-width:92px}
.sn{min-width:0;display:flex;flex-direction:column}.sn b{font:600 15.5px/1.15 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sn small{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc{font:600 13px/1 var(--disp);color:var(--mute);font-variant-numeric:tabular-nums}.sc.neg{color:var(--bad)}
.qk{flex:none}
.sum{display:flex;flex-wrap:wrap;gap:4px 14px;font:500 13.5px/1.2 var(--disp);letter-spacing:.04em;color:var(--mute);text-transform:uppercase}
.sum b{color:var(--ink);font-weight:700;font-size:16px}.sum .wrn,.sum .wrn b{color:var(--warn)}

/* pazar */

/* ===== çentik / Dynamic Island / ana ekran çubuğu güvenli alanları =====
   Ana ekrana eklenen iOS uygulamasında içerik durum çubuğunun altına uzanır.

:root{--st:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--mt:var(--st);--mr:0px;--mb:var(--sb)}

html.port #app{grid-template-columns:100%}

/* iOS ana ekran uygulaması: tam ekran yüksekliği */

<script>
'use strict';
/* ================= DİL / LANGUAGE / 语言 ================= */
const LANGS=['tr','en','zh'],LANGN=['Türkçe','English','中文'];
let LI=0;
const LANG=()=>LANGS[LI];
/* anında metin: L(türkçe, english, 中文) */
const L=(tr,en,zh)=>LI===1?en:LI===2?zh:tr;
/* kaydedilecek metin: kapanışı üç dilde çalıştırır, [tr,en,zh] döndürür */
function LX(f){if(typeof f!=='function')return f;const o=LI,r=[];try{for(let i=0;i<3;i++){LI=i;r.push(f());}}finally{LI=o;}return r;}
const tx=v=>Array.isArray(v)?(v[LI]!==undefined?v[LI]:v[0]):(v==null?'':v);
function detectLang(){try{const s=localStorage.getItem('armator_lang');if(LANGS.includes(s))return s;}catch(e){}
 try{const ls=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'']).map(x=>String(x).toLowerCase());for(const l of ls){if(l.startsWith('tr'))return 'tr';if(l.startsWith('zh'))return 'zh';if(l.startsWith('en'))return 'en';}}catch(e){}return 'en';}
function setLangIdx(i){LI=clamp0(i);}
const clamp0=i=>i===1||i===2?i:0;
const pl=(n,one,many)=>n===1?one:many;

function dijk(src,ban){const dist={},prev={},done={};for(const k in NODE)dist[k]=Infinity;dist[src]=0;for(;;){let u=null,b=Infinity;for(const k in dist)if(!done[k]&&dist[k]<b){b=dist[k];u=k;}if(u===null)break;done[u]=1;for(const [v,w] of ADJ[u]||[]){if(ban&&ban[u+'-'+v])continue;if(dist[u]+w<dist[v]){dist[v]=dist[u]+w;prev[v]=u;}}}return {dist,prev};}

/* ---------- zaman ---------- */
function pBreak(s){return (0.0015+0.0007*Math.pow(Math.max(0,85-s.cond),1.15))*(1.6-0.22*sk(s,'cb'))*(inspector()?IBF[inspector().skill-1]:1)*(up(s,'eng')?0.65:1);}
function seaStep(s,d){const v=s.voy;
 if(s.fuel<=0){evNoFuel(s);return;}
 if(s.hold>0){s.hold-=d;s.fuel=Math.max(0,s.fuel-consSea(s)*0.5*d);return;}
 v.done+=seaSpeed(s)*24*d;s.fuel=Math.max(0,s.fuel-consSea(s)*d);
 const c0=s.cond;s.cond=Math.max(15,s.cond-0.08*(1+s.age/20)*(1.3-0.1*sk(s,'c2'))*(up(s,'eng')?0.8:1)*d);
 if(c0>=50&&s.cond<50&&!managed(s))toast(L(s.name+' yıpranıyor: durum %50 altına indi, ilk limanda bakım yaptır',s.name+' is wearing out: condition is below 50%, get maintenance at the next port',s.name+'磨损加剧：船况低于50%，请在下一个港口维修'),s.id,'warn');
 crewXp(s,d);
 for(const t of v.trig){if(t.x||v.done<t.at)continue;t.x=1;

function mgrPick(s,m){let best=null,bv=0;const sg=MSIG[m.skill-1];

  const ppd=(e.profit+e.fr*(MNEG[m.skill-1]-1))/Math.max(e.days,0.5);let v=ppd*(1+(hash01(o.id,m.id)*2-1)*sg*2)+(hash01(o.id+7,m.id)*2-1)*sg*5000;

 for(const p of PORTS){if(p.id===s.port||!portOpen(p.id)||avoid(p.id))continue;const n=(S.offers[p.id]||[]).filter(o=>fits(s,o)&&!avoid(o.to)).length;if(!n)continue;

 if(cr.uscn&&((a==='US'&&b==='CN')||(a==='CN'&&b==='US')))m*=0.85;return m;}
function heyetCost(){return Math.round(clamp(20000+netWorth()*0.004,20000,400000)*(diplomat()?0.75:1)/1000)*1000;}

 pay(cost,'diplomasi');S.dipCd[c]=S.day+45;addRel(c,8);logMsg(()=>L(CNAME[c]+' ülkesine ticaret heyeti gönderildi: '+USD(cost),'Trade delegation sent to '+CNAME[c]+': '+USD(cost),'向'+CNAME[c]+'派出贸易代表团：'+USD(cost)));toast(L(CNAME[c]+' ile ilişkiler gelişti','Relations with '+CNAME[c]+' improved','与'+CNAME[c]+'的关系改善了'),'','ok');}

 if(s.state!=='idle')return L('gemi limanda boşta olmalı','the ship must be idle in port','船舶须在港空闲');if(u.yard&&!PORT[s.port].yard)return L('tersaneli limanda yapılır','done at a port with a shipyard','须在有船厂的港口进行');if(!canPay(upgCost(s,k)))return L('nakit yetmiyor','not enough cash','现金不足');return '';}

 const fee=5000;if(!canPay(fee)){toast(L('Sicil harcı için nakit yetmiyor','Not enough cash for the registry fee','现金不足以支付登记费'),'','bad');return false;}pay(fee,'geliştirme');const old=s.name;logMsg(()=>L(old+' adını değiştirdi: '+pre+nm,old+' renamed: '+pre+nm,old+'更名为'+pre+nm));s.name=pre+nm;save();return true;}

 if(!S.ships.length&&!(S.stat&&S.stat.cargo))return;
 const n={};S.ships.forEach(s=>{const k=FLEETOF[s.cls];n[k]=(n[k]||0)+1;});const tot=S.ships.length||1;

 for(const s of S.ships){const r=LIC[s.cls];if(r)S.xp[r[0]]=Math.max(S.xp[r[0]],LVXP[r[1]-1]);}
 let mt=1;for(const s of S.ships){for(const p of [s.port,s.voy&&s.voy.to,s.cargo&&s.cargo.to])if(p)mt=Math.max(mt,portTier(p));}

 if(S.rivNext===undefined)S.rivNext=Math.floor(S.day)+ri(70,110);if(S.crewNext===undefined)S.crewNext=Math.floor(S.day)+ri(40,70);

 ppl.concat(S.pool||[]).forEach(personInit);fillTC();}

/* ---------- banka ---------- */
function debt(){let t=0;for(const l of S.loans||[])t+=l.bal;return t;}
function debtPay(){let t=0;for(const l of S.loans||[])t+=l.pay;return t;}
function loanRate(kind){return Math.round((0.05+(100-S.rep)*0.0006+(kind==='biz'?0.015:0))*1000)/1000;}
function bankLimit(){return Math.max(0,Math.floor((0.5*fleetValue()+250000*(S.hq||1)+15000*S.rep-debt())/50000)*50000);}
function annuity(P,rate,n){const r=rate/12;return r>0?P*r/(1-Math.pow(1+r,-n)):P/n;}
const PCT1=r=>PC(D1(r*100));
function takeLoan(amt,months,kind,sid){amt=Math.round(amt/1000)*1000;if(amt<=0)return null;const rate=loanRate(kind),l={id:S.nid++,kind,amt,bal:amt,rate,n:months,pay:Math.round(annuity(amt,rate,months)),next:Math.floor(S.day)+30,sid:sid||0,t0:Math.floor(S.day)};S.loans.push(l);earn(amt,'kredi');return l;}
function borrow(frac){const lim=bankLimit(),amt=Math.max(50000,Math.floor(lim*frac/50000)*50000);if(amt>lim||lim<50000){toast(L('Banka bu tutarı vermiyor','The bank won’t lend that much','银行不肯贷这么多'),'','bad');return;}
 const l=takeLoan(amt,24,'biz');logMsg(()=>L('İşletme kredisi çekildi: '+USD(l.amt)+', 24 ay, faiz '+PCT1(l.rate)+', aylık taksit '+USD(l.pay),'Business loan taken: '+USD(l.amt)+', 24 months, interest '+PCT1(l.rate)+', monthly instalment '+USD(l.pay),'借入经营贷款：'+USD(l.amt)+'，24个月，利率'+PCT1(l.rate)+'，每月还款'+USD(l.pay)));
 toast(L('Kredi hesabına geçti: ','Loan paid out: ','贷款已到账：')+USD(l.amt),'','ok');save();}
function repayLoan(id){const i=S.loans.findIndex(l=>l.id===id);if(i<0)return;const l=S.loans[i],fee=Math.round(l.bal*0.01);if(!canPay(l.bal+fee)){toast(L('Krediyi kapatmaya nakit yetmiyor','Not enough cash to repay the loan','现金不足，无法还清贷款'),'','bad');return;}
 pay(l.bal,'kredi');pay(fee,'faiz');S.loans.splice(i,1);const b=l.bal;logMsg(()=>L('Kredi erken kapatıldı: '+USD(b)+' (erken ödeme ücreti '+USD(fee)+')','Loan repaid early: '+USD(b)+' (early repayment fee '+USD(fee)+')','提前还清贷款：'+USD(b)+'（提前还款费'+USD(fee)+'）'));toast(L('Kredi kapandı','Loan repaid','贷款已还清'),'','ok');save();}
function shipLoan(m){return Math.round(m.price*0.5/1000)*1000;}
function shipLoanOk(m){return shipLoan(m)<=bankLimit()+0.5*shipValue(m)&&canPay(m.price-shipLoan(m));}
function buyShipLoan(lid){const m=S.market.find(x=>x.id===lid);if(!m)return null;const k=buyBlock(m);if(k&&k!=='cash'){toast(buyWhy(m),'','bad');return null;}
 const amt=shipLoan(m);if(amt>bankLimit()+0.5*shipValue(m)){toast(L('Banka bu gemi için kredi vermiyor','The bank won’t finance this ship','银行不为这艘船提供贷款'),'','bad');return null;}
 if(!canPay(m.price-amt)){toast(L('Peşinat için nakit yetmiyor','Not enough cash for the down payment','现金不足以支付首付'),'','bad');return null;}
 const l=takeLoan(amt,60,'ship'),s=buyShip(lid);if(!s){S.loans.pop();S.cash-=amt;fin('kredi',-amt);return null;}l.sid=s.id;
 logMsg(()=>L(s.name+' için gemi kredisi: '+USD(l.amt)+', 60 ay, faiz '+PCT1(l.rate)+', aylık taksit '+USD(l.pay),'Ship mortgage for '+s.name+': '+USD(l.amt)+', 60 months, interest '+PCT1(l.rate)+', monthly instalment '+USD(l.pay),s.name+'的船舶抵押贷款：'+USD(l.amt)+'，60个月，利率'+PCT1(l.rate)+'，每月还款'+USD(l.pay)));return s;}
function payoffShip(s){const i=S.loans.findIndex(l=>l.sid===s.id);if(i<0)return;const l=S.loans[i];pay(l.bal,'kredi');S.loans.splice(i,1);const b=l.bal;
 logMsg(()=>L(s.name+' satışından gemi kredisi kapatıldı: '+USD(b),'Ship mortgage repaid from the sale of '+s.name+': '+USD(b),'用'+s.name+'的售船款还清抵押贷款：'+USD(b)));}
function loanDay(day){for(const l of S.loans.slice()){if(day<l.next)continue;l.next+=30;const it=l.bal*l.rate/12,pr=Math.min(l.bal,Math.max(0,l.pay-it));pay(it,'faiz');pay(pr,'kredi');l.bal-=pr;
 if(l.bal<1){S.loans.splice(S.loans.indexOf(l),1);const a=l.amt;logMsg(()=>L('Kredi borcu bitti ('+USD(a)+')','Loan fully repaid ('+USD(a)+')','贷款已全部还清（'+USD(a)+'）'));toast(L('Bir kredinin son taksiti ödendi','The last instalment of a loan has been paid','一笔贷款的最后一期已还清'),'','ok');}}}

const TCH={koster:2900,gcargo:5400,ctank:6400,handy:9000,supra:13800,pmax:18000,mr:22500,afra:33300};
const TCREP={koster:0,gcargo:5,ctank:10,handy:15,supra:25,pmax:30,mr:35,afra:45};
const CHRS=['Anatolian Grain Trading','Nordhavn Bulk','Gulfstar Energy Trading','Pacific Ore Logistics','Levant Cement Co.','Baltic Timber Lines','Orient Steel Trading','Atlas Commodities','Meridian Chartering','Bosphorus Agro'];
function fillTC(){S.tco=(S.tco||[]).filter(o=>o.exp>S.day);for(const c of CLSORD){while(S.tco.filter(o=>o.cls===c).length<2){const mo=wpick([3,6,12],[4,4,2]),used=S.tco.filter(o=>o.cls===c).map(o=>o.who);S.tco.push({id:S.nid++,cls:c,who:pick(CHRS.filter(n=>!used.includes(n))),mo,mul:Math.round(rnd(0.8,1.0)*S.tcIdx*(mo===12?0.97:1)*1000)/1000,exp:S.day+rnd(15,40)});}}}
function tcRate(s,o){const c=CLS[s.cls],sp=(c.spd[0]+c.spd[1])/2;return Math.round(TCH[s.cls]*o.mul*(0.85+0.15*clamp((s.cond-50)/40,0,1))*(s.spd/sp)*(1+0.05*(catLv(FLEETOF[s.cls])-1))/50)*50;}
function tcWhy(s,o){if(s.state!=='idle')return L('gemi limanda emir bekliyor olmalı','the ship must be idle in port','船舶须在港待命');if(missingRoles(s).length)return L('personel eksik','crew missing','缺少船员');

function quickSend(s,say){if(svOver(s)){if(say){toast(L(s.name+': klas askıda, önce sörvey',s.name+': class suspended, survey first',s.name+'：船级暂停，请先检验'),s.id,'bad');openShip(s.id,'ikmal');}return false;}if(missingRoles(s).length){if(say){toast(L(s.name+': önce personel ata',s.name+': hire a crew first',s.name+'：请先招募船员'),s.id,'bad');openShip(s.id,'personel');}return false;}const o=quickBest(s);
 if(!o){if(say){if(s.cond<45){toast(L(s.name+': durumu %'+Math.round(s.cond)+', denetim riski yüksek. Önce bakım yaptır.',s.name+': condition '+Math.round(s.cond)+'%, high inspection risk. Get maintenance first.',s.name+'：船况'+Math.round(s.cond)+'%，检查风险高。请先维修。'),s.id,'warn');openShip(s.id,'ikmal');}
  else{toast(L(s.name+': güvenli ve kârlı yük yok. Yük listesine bak ya da boş sefer seç.',s.name+': no safe, profitable cargo. Check the cargo list or choose a ballast voyage.',s.name+'：没有安全又赚钱的货物。请查看货物列表或选择空载航行。'),s.id,'warn');openShip(s.id);}}return false;}return depart(s,o.to,o.id,true);}

 return A.length?' '+L('Seviye '+(l+1)+': ','Level '+(l+1)+': ',(l+1)+'级：')+LJ(A)+L('.','.','。'):'';}

 h+=`<div class="card"><h3 class="h">${L('Gemi ruhsatları','Ship licences','船舶执照')}</h3>${CLSORD.map(c=>{const ok=licOk(c);return `<div class="lic"><span>${CLS[c].n}<small>${LIC[c]||LICREP[c]?licTxt(c):L('şartsız','no requirement','无要求')}</small></span><span class="chip ${ok?'ok':'bad'}">${ok?L('açık','open','已解锁'):L('kilitli','locked','未解锁')}</span></div>`;}).join('')}</div>`;
 return h+`<p class="note">${L('Tecrübe her teslimatta kazanılır: seferin gün sayısı kadar puan, sıkı denetimli limanlara teslimde %20 fazlası, geç teslimde yarısı. Boş sefer tecrübe kazandırmaz.','Experience is earned with every delivery: points based on the voyage’s length in days, 20% more for deliveries to strictly inspected ports, half for late deliveries. Ballast voyages earn nothing.','每次交货都能获得经验：按航次天数计分，交付到检查严格的港口多得20%，延误交货只得一半。空载航行不计经验。')}</p>`;}

 if(!loaded)g+=`<rect x="${f(x0)}" y="${f(wl-c.H*0.36)}" width="${c.L}" height="20" fill="var(--boot)"/>`;
 const nr=Math.round(clamp((92-s.cond)/5,0,14));for(let i=0;i<nr;i++)g+=`<rect x="${f(x0+5+rr()*(c.L-18))}" y="${f(dy+0.5)}" width="${f(1.2+rr()*1.4)}" height="${f(2+rr()*(fb-2))}" fill="var(--rust)" opacity=".85"/>`;
 g+=`</g><rect x="${f(x0+1)}" y="${f(dy-0.4)}" width="${f(fc-x0-1)}" height="1.7" fill="var(--${tank?'tank':'dry'})"/>`;
 const sx0=x0+7,hS=13+(c.H-11)*1.2,st=`fill="var(--sup)" stroke="var(--hull)" stroke-width=".8"`;
 g+=`<rect x="${f(sx0+c.sup*0.26)}" y="${f(dy-hS-11)}" width="${f(c.sup*0.38)}" height="9" fill="var(--hull)"/><rect x="${f(sx0+c.sup*0.26)}" y="${f(dy-hS-8.6)}" width="${f(c.sup*0.38)}" height="2.8" fill="var(--mag)"/>`;
 g+=`<rect x="${f(sx0)}" y="${f(dy-hS)}" width="${c.sup}" height="${f(hS)}" ${st}/><rect x="${f(sx0-1.5)}" y="${f(dy-hS-3)}" width="${c.sup+3}" height="3" ${st}/><path d="M${f(sx0+c.sup*0.82)} ${f(dy-hS-3)}v-7" stroke="var(--hull)" stroke-width="1"/>`;

const HELP=[
 [['Ekran','Screen','界面'],['İki düzen var: dikeyde harita üstte, listeler ve gemi resimleri altta; yatayda solda bölümler, ortada harita, sağda panel. Haritanın sağ üstündeki döndürme düğmesiyle ya da Şirket › Ayarlar’dan geçiş yapabilirsin. Yatayda paneli sağ üstteki okla kapatıp haritayı büyütebilirsin. Haritada gemiye ya da limana dokununca ayrıntısı panelde açılır.','There are two layouts: in portrait the map is on top with lists and ship pictures below; in landscape the sections are on the left, the map in the middle and the panel on the right. Switch with the rotate button at the top right of the map or under Company › Settings. In landscape you can close the panel with the arrow at its top right to enlarge the map. Tap a ship or port on the map to open its details in the panel.','有两种布局：竖屏时地图在上，列表和船舶图片在下；横屏时栏目在左，地图居中，面板在右。可以用地图右上角的旋转按钮或在“公司 › 设置”中切换。横屏时，可以用面板右上角的箭头关闭面板以放大地图。在地图上点击船舶或港口，会在面板中打开详情。']],
 [['Döngü','The loop','基本玩法'],['Gemi al, personel ata, yük seç, sefere çık. Navlun yük teslim edilince ödenir. Maaşlar ve işletme giderleri her gün işler; gemi boş beklerse para kaybedersin. “Sevk et” geminin limanındaki en kârlı güvenli yükü seçip yola çıkarır.','Buy a ship, hire a crew, pick a cargo, set sail. Freight is paid on delivery. Wages and running costs accrue every day, so an idle ship loses money. “Dispatch” picks the most profitable safe cargo in the ship’s port and sails.','买船、招船员、选货、开航。运费在交货时支付。工资和运营费用每天都在产生，船闲着就会亏钱。“派船”会在船所在港口挑选最赚钱的安全货物并开航。']],
 [['Tecrübe','Experience','经验'],['Her teslimat, geminin sınıfında tecrübe kazandırır. Sınıf seviyesi arttıkça o sınıfta navlun artar, liman işleri hızlanır ve yeni gemi ruhsatları açılır. Şirket seviyesi bütün sınıfların toplamıdır; büyük limanlar ve büyük binalar şirket seviyesiyle açılır.','Every delivery earns experience in the ship’s class. As a class levels up, freight in that class rises, port work speeds up and new ship licences open. The company level is the sum of all classes; big ports and big buildings open with the company level.','每次交货都会为该船型积累经验。船型等级越高，该船型的运费越高，港口作业越快，并会解锁新的船舶执照。公司等级是所有船型的总和；大港口和大办公楼随公司等级开放。']],
 [['Büyümek','Growing','发展'],['Gemi almak için para yetmez: o sınıfın ruhsatı ve ofiste yer gerekir. Ofisin yönetebileceği gemi sayısı binaya bağlıdır.','Money alone won’t buy a ship: you need the licence for that class and room in your office. The number of ships your office can manage depends on the building.','光有钱买不了船：还需要该船型的执照和办公室的管理容量。办公室能管理的船舶数量取决于办公楼。']],
 [['Personel','Crew','船员'],['Yıldız sayısı beceriyi gösterir. Kaptan hızı ve denetimleri, çarkçıbaşı arızaları ve yakıtı, 2. kaptan yükleme süresini ve yük hasarını, 2. çarkçı gemide tamiri, aşçı morali etkiler. Personel denizde geçen günlerle tecrübe kazanır.','Stars show skill. The captain affects speed and inspections, the chief engineer breakdowns and fuel, the chief officer loading time and cargo damage, the second engineer repairs on board, and the cook morale. Crew gain experience with days at sea.','星级代表能力。船长影响航速和检查，轮机长影响故障和油耗，大副影响装卸时间和货损，大管轮影响船上修理，厨师影响士气。船员会随着海上天数积累经验。']],
 [['Denetim','Inspections','检查'],['Limanların denetim sıkılığı farklıdır. Durumu kötü gemi sıkı limanda tutulur ve ceza öder. Haritadaki liman rengi denetimi gösterir: yeşil gevşek, turuncu orta, kırmızı sıkı.','Ports differ in how strictly they inspect. A ship in poor condition gets detained and fined in a strict port. The port colour on the map shows the inspection level: green lax, orange moderate, red strict.','各港口的检查严格程度不同。船况差的船在严格的港口会被滞留并罚款。地图上港口的颜色表示检查力度：绿色宽松，橙色中等，红色严格。']],
 [['Geliştirmeler','Upgrades','改装'],['Gemi ekranının Geliştir bölümünden pervane, makine revizyonu, scrubber, yük donanımı gibi parçalar taktırabilir, gövdeyi boyatabilir, gemiye yeni ad verebilirsin. Çoğu tersaneli limanda yapılır ve gemi o süre çalışmaz.','In the Upgrade section of the ship screen you can fit parts such as a propeller, engine overhaul, scrubber or cargo gear, repaint the hull and rename the ship. Most of this is done at a port with a shipyard, and the ship doesn’t work in the meantime.','在船舶页面的“改装”中，可以加装螺旋桨、主机大修、脱硫塔、装卸设备等，也可以重新涂装船体、给船改名。大多需在有船厂的港口进行，期间船舶不能营运。']],
 [['Personel hikâyeleri','Crew stories','船员故事'],['Her denizcinin yaşı ve sadakati var. Sadakat denizde geçen zamanla ve iyi davranışla artar, moral düşükse azalır. Tecrübeli 2. kaptan ve 2. çarkçılar terfi ister; yaşlananlar emekli olmak ister; yıl sonunda ikramiye beklenir. Sadakati çok düşen personel limanda istifa edebilir.','Every seafarer has an age and a loyalty level. Loyalty grows with time at sea and good treatment, and falls when morale is low. Experienced chief officers and second engineers ask for promotion; older crew want to retire; a bonus is expected at the end of the year. Crew with very low loyalty may quit in port.','每名船员都有年龄和忠诚度。忠诚度随着海上时间和善待而提高，士气低落时则下降。有经验的大副和大管轮会要求晋升；年长的船员会想退休；年底大家期待年终奖。忠诚度很低的船员可能在港口辞职。']],
 [['Banka','Bank','银行'],['Şirket › Banka bölümünden işletme kredisi çekebilir, gemi pazarında gemiyi yarı peşin, yarı krediyle alabilirsin. Faiz itibarına bağlıdır. Taksitler her 30 günde bir ödenir; krediyle hızlı büyürsün ama piyasa kötüleşirse taksitler seni batırabilir.','Under Company › Bank you can take a business loan, and in the ship market you can buy a ship half cash, half mortgage. Interest depends on your reputation. Instalments are paid every 30 days; loans let you grow faster, but if the market turns, the instalments can sink you.','在“公司 › 银行”中可以借经营贷款，在船舶市场中可以一半首付、一半贷款买船。利率取决于你的声誉。每30天还款一次；贷款能让你更快扩张，但市场转坏时，还款压力可能让你破产。']],
 [['Kiralama','Chartering','租船'],['Limanda bekleyen gemiyi “Kirala” düğmesiyle 3, 6 ya da 12 aylığına bir kiracıya verebilirsin. Kiracı yakıtı ve liman masraflarını öder, sen günlük sabit kira alırsın. Kira gemi durumuna, hızına ve tecrübene göre değişir. Kiracılar bakımlı gemi ister.','Use the “Charter” button to hand an idle ship to a charterer for 3, 6 or 12 months. The charterer pays fuel and port costs, and you receive a fixed daily hire. The hire depends on the ship’s condition, speed and your experience. Charterers want well-maintained ships.','用“出租”按钮可以把在港待命的船租给租家3、6或12个月。租家承担燃油和港口费用，你收取固定日租金。租金取决于船况、航速和你的经验。租家要求船舶保养良好。']],
 [['Klas sörveyleri','Class surveys','船级检验'],['Her gemi 2,5 yılda bir ara sörvey, 5 yılda bir özel sörvey yaptırmak zorunda. Zamanı yaklaşınca uyarı gelir; sörvey tersaneli limanda yapılır. Kaçırılırsa klas askıya alınır: gemi yük alamaz, kiralanamaz ve denetimlerde tutulma riski artar. Özel sörvey havuzlamayı da kapsar.','Every ship must pass an intermediate survey every 2.5 years and a special survey every 5 years. You are warned as the date approaches; surveys are done at shipyard ports. If missed, class is suspended: the ship can’t load cargo or go on charter, and detentions become more likely. The special survey includes drydocking.','每艘船每2.5年须做一次中间检验，每5年做一次特别检验。临近到期时会有提醒；检验在有船厂的港口进行。如果错过，船级将被暂停：船舶不能装货、不能出租，被滞留的风险增加。特别检验包括进坞。']],
 [['Rakipler','Rivals','竞争对手'],['Dört rakip şirket seninle aynı denizlerde çalışır. Dünya › Rakipler bölümünde sıralamayı ve sektör haberlerini görürsün. Rakipler personelini ayartmaya çalışabilir, bir ülkede navlun savaşı açabilir, gemilerini ucuza satabilir; zor duruma düşen bir rakip şirketini sana satmayı teklif edebilir.','Four rival companies work the same seas. Under World › Rivals you see the ranking and industry news. Rivals may try to poach your crew, start a freight war in a country or sell ships cheaply; a rival in trouble may offer to sell you its company.','四家竞争对手在同一片海域经营。在“世界 › 对手”中可以看到排名和行业新闻。对手可能挖你的船员、在某国发动运费战或低价卖船；陷入困境的对手可能提出把公司卖给你。']],
 [['Zaman','Time','时间'],['Sen yönettiğin bir gemi emir bekliyorsa oyun durur ve uyarır. Haritanın sol altındaki düğme bekleyen gemiye götürür.','When a ship you manage awaits orders, the game pauses and warns you. The button at the bottom left of the map takes you to the waiting ship.','你管理的船等待指令时，游戏会暂停并提醒你。地图左下角的按钮会带你到等待中的船。']],
 [['Otomasyon','Automation','自动化'],['Bir filoya müdür atarsan o filonun gemilerine yükü o bulur. İyi müdür kârlı iş bağlar, kötüsü zarar ettirir. Makine enspektörü bakım zamanı gelince sorar.','Appoint a manager to a fleet and they find cargo for its ships. A good manager makes profitable deals, a bad one loses money. The technical superintendent asks you when maintenance is due.','为船队任命经理后，经理会为船队的船寻找货源。好的经理能谈成赚钱的生意，差的会让你亏钱。机务主管会在需要维修时征求你的意见。']],
 [['Ülkeler','Countries','国家'],['İlişki iyiyse o ülkenin limanlarında navlun artar, masraf ve denetim azalır; çok kötüyse limanlar kapanır. Gündem olayları kurgusaldır.','Good relations mean higher freight, lower costs and fewer inspections in that country’s ports; very bad relations close them. Agenda events are fictional.','关系好时，该国港口运费更高、费用和检查更少；关系很差时港口会关闭。时事事件均为虚构。']]];
function vHelp(){return `<div class="card help">${HELP.map(x=>`<h3 class="h">${tx(x[0])}</h3><p>${tx(x[1])}</p>`).join('')}</div>`;}
const SHEET={tc:vTC,ship:vShip,crew:vCrew,offers:vOffers,ballast:vBallast,trip:vTrip,port:vPort,buy:vBuy,sell:vSell,asknew:vAskNew,help:vHelp,staff:vStaff,emp:vEmp,country:vCountry};
function sheetTitle(sh){switch(sh.t){case 'ship':case 'sell':return ship(sh.id).name;case 'crew':return ROLE[sh.r].n+L(' seç',' — choose','选择');case 'offers':return L('Yükler','Cargoes','货物')+' · '+ship(sh.id).name.slice(4);case 'ballast':return L('Boş sefer','Ballast voyage','空载航行');case 'tc':return L('Kiralama teklifleri','Charter offers','租船报价')+' · '+ship(sh.id).name.slice(4);case 'trip':return L('Sefer planı','Voyage plan','航次计划');case 'port':return PORT[sh.p].n;case 'buy':return L('Gemi ilanı','Ship listing','船舶挂牌');case 'asknew':return L('Yeni oyun','New game','新游戏');case 'help':return L('Nasıl oynanır','How to play','玩法说明');case 'staff':return SROLE[sh.r].n+L(' seç',' — choose','选择');case 'emp':{const m=S.staff.find(x=>x.id===sh.id);return m?SROLE[m.role].n:'';}case 'country':return CNAME[sh.c];}return '';}
function validSheet(sh){if(['ship','crew','offers','ballast','trip','sell','tc'].includes(sh.t)){const s=ship(sh.id);if(!s)return false;if(['offers','ballast','trip','sell','tc'].includes(sh.t)&&s.state!=='idle')return false;if(sh.t==='crew'&&!s.port)return false;}if(sh.t==='emp'&&!S.staff.some(x=>x.id===sh.id))return false;return true;}

 const idle=S.ships.filter(s=>s.state==='idle'&&!managed(s)).length,bd=$('#bdFleet');bd.textContent=idle||'';bd.hidden=!idle;
 const bx=$('#bdXp'),nw=CLSORD.filter(c=>licOk(c)).length+coLv()*10;if(ui.tab==='xp')S.seenLic=nw;bx.textContent=L('yeni','new','新');bx.hidden=!(S.seenLic!==undefined&&nw>S.seenLic);if(S.seenLic===undefined)S.seenLic=nw;
 $('#phT').innerHTML=tx(TABT[ui.tab])+'<small>'+headSub()+'</small>';$('#phA').innerHTML=headAct();
 const pn=$('#panel'),st=pn.scrollTop;pn.innerHTML=VIEW[ui.tab]();if(ui.tabKey===ui.tab)pn.scrollTop=st;ui.tabKey=ui.tab;

 updateLive();}
function openShip(id,tab){const s=ship(id);if(!s)return;ui.sel=id;ui.tab='fleet';ui.pc=false;ui.sheet=[{t:'ship',id,tab:tab||'durum'}];R();requestAnimationFrame(()=>{resizeMap();const p=shipPos(s);focusOn(p.lon,p.lat,7);});}

function showIntro(){ui.intro=true;ui.ask=null;if(!S)newGame('');const el=$('#intro'),prev=$('#coInp')?$('#coInp').value:'';el.hidden=false;
 el.innerHTML=`<div class="dlg two intro" role="dialog" aria-modal="true" aria-labelledby="inT"><div class="dl"><div class="logo" id="inT">Armatör</div><p class="tag sub2">${L('Denizcilik şirketi oyunu','A shipping company game','航运公司经营游戏')}</p>${shipSVG({id:3,cls:'gcargo',type:'dry',cond:62},1)}<p class="tag">${L('Tek bir eski kosterle başla. Limanlar arasında yük taşı, tecrübe kazan, ruhsat al, şirketini büyüt.','Start with one old coaster. Carry cargo between ports, gain experience, earn licences and grow your company.','从一艘旧沿海货船起步。在港口之间运货，积累经验，获得执照，发展你的公司。')}</p>${langBtns()}</div><div class="dr"><ol class="steps"><li>${L('Pazardan koster al, personel ata.','Buy a coaster in the market and hire a crew.','在市场上买一艘沿海货船，招募船员。')}</li><li>${L('Gemiyi sevk et; her teslimat para ve tecrübe getirir.','Dispatch the ship; every delivery brings money and experience.','派船出航；每次交货都会带来收入和经验。')}</li><li>${L('Tecrübe arttıkça yeni gemi sınıfları ve büyük limanlar açılır.','As experience grows, new ship classes and bigger ports open up.','经验越多，就能解锁新的船型和更大的港口。')}</li><li>${L('Ofisini büyüt, filo müdürleriyle işi otomatiğe bağla.','Grow your office and let fleet managers run things for you.','扩大办公室，让船队经理帮你打理生意。')}</li></ol><form id="fNew"><label for="coInp">${L('Şirketinin adı','Your company’s name','公司名称')}</label><input id="coInp" name="co" maxlength="28" placeholder="${L('Karadeniz Denizcilik','Black Sea Shipping','黑海航运')}" autocomplete="off"><button class="btn pri" type="submit">${L('Şirketi kur','Found the company','创办公司')}<small>${L('başlangıç sermayesi ','starting capital ','启动资金')}${USD(S.cash)}</small></button></form>${REL?`<label class="btn sm">${L('Kayıt dosyası yükle','Load a save file','载入存档文件')}<input type="file" accept=".json,application/json" data-f="imp" hidden></label>`:''}</div></div>`;
 if(prev)$('#coInp').value=prev;

 cash:['Nakit','Cash','现金'],date:['Tarih','Date','日期'],rep:['İtibar','Reputation','声誉'],lv:['Şirket','Company','公司'],insp:['Denetim','Inspection','检查'],lax:['gevşek','lax','宽松'],mid:['orta','moderate','中等'],strict:['sıkı','strict','严格'],locked:['kilitli','locked','锁定'],

const VER='1.4',REL=!!document.querySelector('link[rel=manifest]');
function fsOn(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
function fsCan(){return !!(document.fullscreenEnabled||document.webkitFullscreenEnabled);}
async function goLand(){if(!fsCan())return false;try{const el=document.documentElement;if(!fsOn())await (el.requestFullscreen?el.requestFullscreen({navigationUI:'hide'}):el.webkitRequestFullscreen());if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape');return true;}catch(e){return false;}}
async function fsToggle(){try{if(fsOn()){if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock();await (document.exitFullscreen?document.exitFullscreen():document.webkitExitFullscreen());}else{const el=document.documentElement;await (el.requestFullscreen?el.requestFullscreen({navigationUI:'hide'}):el.webkitRequestFullscreen());if(oriGet()==='rot'&&screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});}}catch(e){toast(L('Tarayıcın tam ekrana izin vermedi','Your browser didn’t allow full screen','浏览器不允许全屏'),'','warn');}setTimeout(applyOri,250);}
function exportSave(){if(!S)return;try{const blob=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a'),nm=(S.name||'kayit').toLocaleLowerCase('tr').replace(/[^a-z0-9çğıöşü]+/g,'-').replace(/^-|-$/g,'');a.href=URL.createObjectURL(blob);a.download='armator-'+(nm||'save')+'-'+Math.floor(S.day)+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);toast(L('Kayıt dosyası indirildi','Save file downloaded','存档文件已下载'),'','ok');}catch(e){toast(L('Kayıt indirilemedi','Couldn’t download the save','无法下载存档'),'','bad');}}
function importSave(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||o.v!==1||!Array.isArray(o.ships))throw 0;S=o;initCorp();S.speed=0;S.ev=S.ev||[];S.over=!!S.over;save();ui.intro=false;$('#intro').hidden=true;ui.sheet=[];ui.tab='fleet';ui.ask=null;if(S.ships.length){const p=shipPos(S.ships[0]);focusOn(p.lon,p.lat,7,true);}toast(L('Kayıt yüklendi: ','Save loaded: ','已载入存档：')+S.name,'','ok');R();}catch(e){toast(L('Bu dosya bir Armatör kaydı değil','This file is not an Armatör save','该文件不是Armatör存档'),'','bad');}};r.readAsText(file);}
document.addEventListener('change',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.f==='imp'&&t.files&&t.files[0]){importSave(t.files[0]);t.value='';}});

function oriSet(v){try{if(v)localStorage.setItem(ORI,v);else localStorage.removeItem(ORI);}catch(e){}applyOri();}
const PH_P='<svg viewBox="0 0 60 92" width="60" height="92" aria-hidden="true"><rect x="2" y="2" width="56" height="88" rx="7" fill="var(--card)" stroke="currentColor" stroke-width="2.5"/><rect x="7" y="9" width="46" height="30" fill="var(--shal)"/><rect x="7" y="43" width="46" height="13" rx="1.5" fill="var(--line)"/><rect x="10" y="46" width="15" height="7" fill="var(--hull)"/><rect x="7" y="59" width="46" height="13" rx="1.5" fill="var(--line)"/><rect x="10" y="62" width="15" height="7" fill="var(--hull)"/><rect x="7" y="76" width="46" height="8" fill="var(--panel)"/></svg>';
const PH_L='<svg viewBox="0 0 92 60" width="92" height="60" aria-hidden="true"><rect x="2" y="2" width="88" height="56" rx="7" fill="var(--card)" stroke="currentColor" stroke-width="2.5"/><rect x="9" y="7" width="9" height="46" fill="var(--panel)"/><rect x="20" y="7" width="38" height="46" fill="var(--shal)"/><rect x="60" y="7" width="24" height="46" fill="var(--line)"/><rect x="63" y="11" width="18" height="6" fill="var(--hull)"/><rect x="63" y="21" width="18" height="6" fill="var(--hull)"/></svg>';
function renderRot(){const el=$('#rot');if(!el)return;el.innerHTML=`<div><h2>${L('Nasıl oynamak istersin?','How do you want to play?','你想怎么玩？')}</h2><div class="oc"><button type="button" class="oo" data-a="ori" data-v="port">${PH_P}<b>${L('Dikey','Portrait','竖屏')}</b><small>${L('Harita üstte, listeler ve büyük gemi resimleri altta','Map on top, lists and large ship pictures below','地图在上，列表和大幅船舶图片在下')}</small></button><button type="button" class="oo" data-a="ori" data-v="rot">${PH_L}<b>${L('Yatay','Landscape','横屏')}</b><small>${L('Menü solda, harita ortada, panel sağda. Telefonu sola yatırarak tut','Menu on the left, map in the middle, panel on the right. Hold the phone turned to the left','菜单在左，地图居中，面板在右。将手机向左横置')}</small></button></div><p>${L('İstediğin zaman haritadaki döndürme düğmesiyle değiştirebilirsin.','You can switch any time with the rotate button on the map.','随时可以用地图上的旋转按钮切换。')}</p>${langBtns()}</div>`;}
const PWA=(()=>{try{return navigator.standalone===true||matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches;}catch(e){return false;}})();
/* iOS ana ekran uygulamasında innerHeight durum çubuğu kadar kısa gelebiliyor; ekranın gerçek boyunu kullan */
function appH(W,H){if(!PWA||!window.screen)return H;const sw=Math.min(screen.width,screen.height),sh=Math.max(screen.width,screen.height);if(Math.abs(W-sw)<=2&&H<sh)return sh;if(Math.abs(W-sh)<=2&&H<sw)return sw;return H;}
function applyOri(){const W=window.innerWidth,H=appH(W,window.innerHeight),por=H>W,p=oriGet(),h=document.documentElement;h.classList.toggle('pwa',PWA);
 h.style.setProperty('--vw',W+'px');h.style.setProperty('--vh',H+'px');
 ROT=por&&p==='rot';ui.port=por&&p==='port';h.classList.toggle('rot',ROT);h.classList.toggle('port',ui.port);$('#rot').hidden=!(por&&!p);
 resizeMap();R();}
/* döndürülmüş ekranda kaydırma: tarayıcı döndürülmüş kutuyu yanlış yönde kaydırır, kaydırmayı biz yaparız */
let TS=null,INR=0,SUP=0;
document.addEventListener('touchstart',e=>{if(!ROT||e.touches.length!==1){TS=null;return;}const el=e.target.closest&&e.target.closest('.scr');if(!el){TS=null;return;}cancelAnimationFrame(INR);const t=e.touches[0];TS={el,x:t.clientX,y:t.clientY,st:el.scrollTop,moved:0,v:0,lx:t.clientX,lt:performance.now()};},{passive:true});
document.addEventListener('touchmove',e=>{if(!ROT||!TS)return;const t=e.touches[0],now=performance.now();if(e.cancelable)e.preventDefault();TS.moved=Math.max(TS.moved,Math.hypot(t.clientX-TS.x,t.clientY-TS.y));
 if(TS.moved>6){TS.el.scrollTop=TS.st-(TS.x-t.clientX);const dt=Math.max(1,now-TS.lt);TS.v=0.7*TS.v+0.3*((TS.lx-t.clientX)/dt);TS.lx=t.clientX;TS.lt=now;}},{passive:false});
document.addEventListener('touchend',()=>{if(!ROT||!TS)return;const T=TS;TS=null;if(T.moved<=6)return;SUP=performance.now();if(performance.now()-T.lt>80)return;let v=T.v,last=performance.now();
 const step=now=>{const dt=now-last;last=now;v*=Math.pow(0.996,dt);if(Math.abs(v)<0.03)return;T.el.scrollTop-=v*dt;INR=requestAnimationFrame(step);};if(Math.abs(v)>0.08)INR=requestAnimationFrame(step);},{passive:true});
document.addEventListener('click',e=>{if(ROT&&performance.now()-SUP<350){e.stopPropagation();e.preventDefault();}},true);

/* ---------- eylemler ---------- */
const ACT={
 tab(d){if(ui.tab===d.t&&!ui.sheet.length&&!ui.port){ui.pc=!ui.pc;}else{ui.tab=d.t;ui.pc=false;}ui.sheet=[];ui.sel=null;$('#panel').scrollTop=0;R();requestAnimationFrame(resizeMap);},
 ptog(){ui.pc=!ui.pc;if(ui.pc)ui.sheet=[];R();requestAnimationFrame(()=>{renderAll();resizeMap();});},
 ori(d){oriSet(d.v);if(d.v==='rot')goLand().then(()=>setTimeout(applyOri,300));},
 lang(d){setLang(+d.i);},
 oriTog(){const por=window.innerHeight>window.innerWidth;if(!por){if(fsOn()){if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock();(document.exitFullscreen?document.exitFullscreen():document.webkitExitFullscreen()).catch(()=>{});oriSet('port');setTimeout(applyOri,300);return;}toast(L('Dikey düzen için telefonu dik tut','Hold the phone upright for portrait','竖屏请竖持手机'));return;}
  const to=oriGet()==='port'?'rot':'port';oriSet(to);if(to==='rot')goLand().then(ok=>{setTimeout(applyOri,300);if(!ok)toast(L('Yatay düzen: telefonu sola yatırarak tut','Landscape: hold the phone turned to the left','横屏：将手机向左横置'));});else toast(L('Dikey düzen','Portrait layout','竖屏布局'));},
 fs(){fsToggle();},exp(){exportSave();},
 fopen(d){const f=S.fleet[d.k];f.open=!f.open;R();},
 quick(d){const s=ship(+d.id),inSheet=ui.sheet.length>0;if(quickSend(s,true)){ui.sel=s.id;const t=ui.sheet[ui.sheet.length-1];if(t&&t.t!=='ship')ui.sheet=[{t:'ship',id:s.id}];if(inSheet)afterOrder();}R();},
 quickAll(){let n=0;idleList().forEach(s=>{if(quickSend(s,false))n++;});const k=idleList().length;toast(L(n+' gemi sefere çıktı',n+' '+pl(n,'ship','ships')+' sailed',n+'艘船已出航')+(k?L(' · '+k+' gemi için uygun yük ya da personel yok',' · no suitable cargo or crew for '+k,' · '+k+'艘船没有合适的货物或船员'):''),'',n&&!k?'ok':'warn');R();},
 send(d){const s=ship(+d.id);if(depart(s,d.to,+d.o,true)){ui.sheet=[{t:'ship',id:s.id}];ui.sel=s.id;afterOrder();}R();},
 manual(d){const s=ship(+d.id);s.manual=!s.manual;s.idleAt=S.day;save();R();},
 staffPick(d){ui.pc=false;ui.sheet.push({t:'staff',r:d.r,k:d.k||''});R();},
 hireStaff(d){if(hireStaff(d.r,+d.p,d.k||undefined)){ui.sheet=ui.sheet.filter(x=>x.t!=='staff'&&x.t!=='emp');save();}R();},
 emp(d){ui.sheet.push({t:'emp',id:+d.id});R();},
 fireStaff(d){fireStaff(+d.id);ui.sheet=ui.sheet.filter(x=>x.t!=='emp');save();R();},
 crewPol(d){const f=S.fleet[d.k];f.crew=f.crew==='best'?'cheap':'best';save();R();},
 hqUp(){upgradeHQ();R();},
 wtab(d){ui.wtab=d.v;$('#panel').scrollTop=0;R();},
 country(d){ui.pc=false;ui.sheet.push({t:'country',c:d.c});R();},
 heyet(d){sendHeyet(d.c);save();R();},
 boy(d){S.boy[d.c]=S.boy[d.c]?0:1;save();R();},
 evAuto(){ui.evAuto=!ui.evAuto;R();},
 autoReset(d){delete S.auto[d.k];save();R();},
 speed(d){setSpeed(+d.v);},zin(){zoomAt(CW/2,CH/2,view.z*1.6);},zout(){zoomAt(CW/2,CH/2,view.z/1.6);},
 ship(d){openShip(+d.id);},port(d){openPort(d.p);const P=PORT[d.p];requestAnimationFrame(()=>{resizeMap();focusOn(P.lon,P.lat,7);});},
 back(){ui.sheet.pop();R();},close(){ui.sheet=[];ui.sel=null;R();},
 stab(d){const t=ui.sheet[ui.sheet.length-1];if(t&&t.t==='ship'){t.tab=d.v;R();}},
 crew(d){ui.sheet.push({t:'crew',id:+d.id,r:d.r});R();},
 hire(d){if(hire(ship(+d.id),d.r,+d.p))ui.sheet.pop();R();},
 fire(d){fire(ship(+d.id),d.r);R();},
 auto(d){autoCrew(ship(+d.id),d.m);R();},
 fuel(d){const s=ship(+d.id);buyFuel(s,d.q==='full'?s.fuelCap:s.fuelCap*0.25);R();},
 prov(d){buyProv(ship(+d.id),+d.q);R();},
 repair(d){const s=ship(+d.id);doRepair(s,d.k==='dock');if(s.state==='maint'){ui.sheet=[{t:'ship',id:s.id}];afterOrder();}R();},
 upg(d){const s=ship(+d.id);if(doUpg(s,d.k)){toast(L(s.name+': '+UPG[d.k].n+' işi başladı',s.name+': '+UPG[d.k].n+' work started',s.name+'：'+UPG[d.k].n+'工程开始'),s.id,'ok');afterOrder();}R();},
 paint(d){const s=ship(+d.id);if(doPaint(s,+d.c)){toast(L(s.name+' boyaya girdi',s.name+' is being painted',s.name+'开始涂装'),s.id,'ok');afterOrder();}R();},
 ack(d){const s=ship(+d.id);s.ack=!s.ack;save();R();},
 offers(d){ui.sheet.push({t:'offers',id:+d.id});R();},
 ballast(d){ui.sheet.push({t:'ballast',id:+d.id});R();},
 trip(d){ui.sheet.push({t:'trip',id:+d.id,to:d.to,o:d.o?+d.o:0});R();},
 toCrew(d){ui.sheet=[{t:'ship',id:+d.id,tab:'personel'}];R();},
 go(d){const s=ship(+d.id);if(depart(s,d.to,d.o?+d.o:0,d.top==='1')){ui.sheet=[{t:'ship',id:s.id}];ui.sel=s.id;afterOrder();}R();},
 buy(d){ui.pc=false;ui.sheet.push({t:'buy',id:+d.id});R();},
 tcList(d){ui.sheet.push({t:'tc',id:+d.id});R();},
 tcFix(d){if(tcFix(+d.id,+d.o)){ui.sheet=[{t:'ship',id:+d.id}];afterOrder();}R();},
 borrow(d){borrow(+d.f);R();},repay(d){repayLoan(+d.id);R();},
 svy(d){const s=ship(+d.id);if(doSurvey(s)){ui.sheet=[{t:'ship',id:s.id}];afterOrder();}R();},
 buyLoan(d){const s=buyShipLoan(+d.id);if(s){ui.tab='fleet';ui.sheet=[{t:'ship',id:s.id,tab:'personel'}];ui.sel=s.id;const P=PORT[s.port];focusOn(P.lon,P.lat,9,true);}R();},
 buyok(d){const s=buyShip(+d.id);if(s){ui.tab='fleet';ui.sheet=[{t:'ship',id:s.id,tab:'personel'}];ui.sel=s.id;const P=PORT[s.port];focusOn(P.lon,P.lat,9,true);}R();},
 sell(d){ui.sheet.push({t:'sell',id:+d.id});R();},sellok(d){sellShip(+d.id);ui.sheet=[];ui.sel=null;R();},
 ev(d){const ev=S.ev[0];if(ev&&ui.evAuto&&ev.k!=='pol'&&ev.k!=='over')S.auto[ev.k]=+d.i;ui.evAuto=false;resolveEv(+d.i);R();},
 askShip(d){ui.ask=null;openShip(+d.id);},askGo(){const v=ui.ask?ui.ask.v:1;idleList().forEach(s=>s.ack=true);ui.ask=null;S.lastSpd=v;S.speed=v;save();R();},askClose(){ui.ask=null;R();},
 askQuick(){const v=ui.ask?ui.ask.v:1;ACT.quickAll();if(!idleList().length){ui.ask=null;S.lastSpd=v;S.speed=v;}R();},
 nextIdle(){const A=S.ships.filter(s=>s.state==='idle'&&!managed(s));if(!A.length)return;const i=A.findIndex(s=>s.id===ui.sel);openShip(A[(i+1)%A.length].id);},
 opt(){S.opt.autoPause=!S.opt.autoPause;save();R();},
 help(){ui.pc=false;ui.sheet.push({t:'help'});R();},askNew(){ui.sheet.push({t:'asknew'});R();},
 newgame(){clearSave();S=null;ui.sheet=[];ui.sel=null;showIntro();}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;if(!S&&a!=='ori'&&a!=='lang')return;const f=ACT[a];if(f)f(el.dataset,el);});
document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset||f.dataset.f!=='rename')return;e.preventDefault();const s=ship(+f.dataset.id);if(s&&renameShip(s,f.elements.nm.value)){toast(L('Yeni ad: ','New name: ','新船名：')+s.name,s.id,'ok');}R();});
document.addEventListener('pointerdown',()=>{ui.ptr=performance.now();},true);
const ptrOff=()=>{ui.ptr=0;};document.addEventListener('pointerup',ptrOff,true);document.addEventListener('pointercancel',ptrOff,true);
document.addEventListener('keydown',e=>{if(!S||ui.intro||/INPUT|TEXTAREA/.test(e.target.tagName))return;
 if(e.code==='Space'&&!S.ev.length&&e.target.tagName!=='BUTTON'){e.preventDefault();setSpeed(S.speed?0:(S.lastSpd||1));}
 else if(/^Digit[1-6]$/.test(e.code)&&!S.ev.length){ACT.tab({t:['fleet','market','xp','office','world','co'][+e.code.slice(5)-1]});}
 else if(e.code==='Escape'){if(ui.sheet.length){ui.sheet.pop();R();}}});

/* ---------- döngü ---------- */
let lastT=performance.now(),liveT=0,thT=9;
function frame(now){const dt=Math.min(0.1,(now-lastT)/1000);lastT=now;
 if(S&&!S.over&&S.speed>0&&!S.ev.length&&!ui.intro){let d=dt*SPD[S.speed];while(d>1e-6&&S&&S.speed>0&&!S.ev.length){const st=Math.min(d,0.2);tick(st);d-=st;}}
 thT+=dt;if(thT>1.5){thT=0;readTheme();const top=ui.sheet[ui.sheet.length-1];if(S&&top&&top.t==='ship'&&!ptrs.size){const fs=ship(top.id);if(fs&&fs.state==='sea'){const fp=shipPos(fs);focusOn(fp.lon,fp.lat,0);}}const el=cv.parentElement;if(Math.abs(el.clientWidth-CW)>1||Math.abs(el.clientHeight-CH)>1)resizeMap();}
 if(S&&ui.tab==='co'&&!ui.sheet.length){ui.coT+=dt;if(ui.coT>1.5&&S.speed>0){ui.coT=0;ui.dirty=true;}}
 if(ui.dirty&&(!ui.ptr||now-ui.ptr>2500)){ui.dirty=false;renderAll();}
 liveT+=dt;if(liveT>0.2){liveT=0;updateLive();}
 drawMap(now);requestAnimationFrame(frame);}
function boot(data){
 setLangIdx(LANGS.indexOf(detectLang()));applyStatic();renderRot();
 if(data&&data.v===1&&Array.isArray(data.ships))S=data;else S=loadSave();
 const old=!!S&&S.hq===undefined,oldP=!!S&&S.xp===undefined;if(S)initCorp();applyOri();readTheme();resizeMap();
 if(S){S.speed=0;S.ev=S.ev||[];
  if(old&&!S.over)S.ev.push(evText({k:'info',title:()=>L('Yenilikler: otomasyon, ofis ve dünya','What’s new: automation, office and world','新内容：自动化、办公室和世界'),body:()=>L('Filo sekmesinde gemiler filolara ayrılıyor ve bekleyen gemiyi tek dokunuşla sefere çıkarabiliyorsun. Ofis sekmesinden filo müdürü ve makine enspektörü atayabilirsin. Dünya sekmesinde ülkelerle ilişkilerini ve gündemi görürsün.','Ships are now grouped into fleets in the Fleet tab, and you can dispatch a waiting ship with one tap. In the Office tab you can appoint fleet managers and a technical superintendent. The World tab shows your relations with countries and the agenda.','船队页面中的船舶现在按船队分组，等待中的船一键即可派出。在办公室页面可以任命船队经理和机务主管。世界页面显示你与各国的关系和时事。'),opts:[{l:OK3}]}));
  if(oldP&&!S.over)S.ev.push(evText({k:'info',title:()=>L('Yenilikler: tecrübe, ruhsat ve geliştirmeler','What’s new: experience, licences and upgrades','新内容：经验、执照和改装'),body:()=>L('Artık her gemi sınıfında ayrı tecrüben var. Yeni gemi almak için o sınıfın ruhsatı ve ofiste yer gerekiyor; büyük limanlar şirket seviyesiyle açılıyor. Şimdiye kadarki seferlerin tecrübe olarak sayıldı ve sahip olduğun gemilerin ruhsatları verildi. Gemi ekranındaki Geliştir bölümünden gemilerine yeni donanım taktırabilirsin.','You now have separate experience for each ship class. Buying a new ship needs that class’s licence and room in your office; big ports open with the company level. Your voyages so far count as experience, and you hold licences for the ships you own. Use the Upgrade section of the ship screen to fit new equipment.','现在每种船型都有各自的经验。购买新船需要该船型的执照和办公室容量；大港口随公司等级开放。你之前的航次已计入经验，并已获得所拥有船舶的执照。可以在船舶页面的“改装”中为船加装新设备。'),opts:[{l:OK3}]}));
  if(S.ships.length){const p=shipPos(S.ships[0]);focusOn(p.lon,p.lat,7,true);}R();}else showIntro();
 requestAnimationFrame(frame);}
